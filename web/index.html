<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="가보기 전에 갈 수 있는 길인지 알려 주는 동해 무장애 여행 코스 웹서비스">
<title>동해 길동무</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=Jua&display=swap">
<style>
/* 동해 길동무 — 동이(파란 갈매기·등대 모자)의 색에서 출발한 토큰.
   한 가지 강조: 첫 화면의 '수평선 위로 뜨는 해'. 나머지는 조용하게. */
:root {
  --bg: #F3F8FD; --surface: #FFFFFF; --mist: #E8F0FA; --line: #D3E0EF;
  --ink: #14243A; --muted: #556479;
  --sea: #2462B4; --sea-deep: #12355E; --sea-ink: #FFFFFF; --sea-soft: #DCE8F8;
  --sun: #F29A33; --sun-deep: #B85F00; --glow: #FFF1D3;
  --sky-top: #DCEBFA; --sky-low: #F7FAFE; --wave: #2462B4;
  --go: #1E7F38; --go-bg: #E3F4E8; --warn: #7A5300; --warn-dot: #F2B416; --warn-bg: #FFF2CC;
  --stop: #C2302C; --stop-bg: #FCE6E4; --on-signal: #FFFFFF;
  --f-display: "Jua", "IBM Plex Sans KR", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r-l: 28px; --r-m: 18px; --r-s: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1420; --surface: #111C2B; --mist: #18263A; --line: #2A3B53; --ink: #E8EEF6; --muted: #A0AEC0;
    --sea: #82AEF0; --sea-deep: #CFE0FA; --sea-ink: #0B1420; --sea-soft: #1C3152; --sun: #F5A852; --sun-deep: #F5A852; --glow: #3A2F1A;
    --sky-top: #0F2036; --sky-low: #0B1420; --wave: #1F4E8C;
    --go: #5ACB84; --go-bg: #15301F; --warn: #F2C14A; --warn-dot: #F2C14A; --warn-bg: #33290F;
    --stop: #F2766B; --stop-bg: #3A1A18; --on-signal: #0B1420; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1420; --surface: #111C2B; --mist: #18263A; --line: #2A3B53; --ink: #E8EEF6; --muted: #A0AEC0;
  --sea: #82AEF0; --sea-deep: #CFE0FA; --sea-ink: #0B1420; --sea-soft: #1C3152; --sun: #F5A852; --sun-deep: #F5A852; --glow: #3A2F1A;
  --sky-top: #0F2036; --sky-low: #0B1420; --wave: #1F4E8C;
  --go: #5ACB84; --go-bg: #15301F; --warn: #F2C14A; --warn-dot: #F2C14A; --warn-bg: #33290F;
  --stop: #F2766B; --stop-bg: #3A1A18; --on-signal: #0B1420; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 84px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.65; word-break: keep-all; overflow-wrap: break-word; }

button, input, select { font: inherit; color: inherit; }
img { max-width: 100%; }
a { color: var(--sea); }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; }
h2, h3 { font-family: var(--f-display); font-weight: 400; color: var(--sea-deep); letter-spacing: -.01em; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--sea); color: var(--sea-ink); padding: 8px 14px; border-radius: 10px; z-index: 50; }
.skip:focus { left: 12px; }
.muted { color: var(--muted); font-size: .92em; }

/* ---------- 머리글 ---------- */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--f-display); font-size: 26px; color: var(--sea); display: flex; align-items: center; gap: 8px; text-decoration: none; }
.brand img { height: 42px; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--ink); padding: 8px 12px; border-radius: 10px; font-weight: 600; }
.nav a:hover { background: var(--mist); }
.tools { display: flex; gap: 8px; }
.sos { border: 0; border-radius: var(--r-s); background: var(--stop); color: var(--on-signal); min-height: 44px; padding: 0 18px; font-weight: 700; cursor: pointer; }
.box { border: 1.5px solid var(--line); border-radius: var(--r-s); min-height: 44px; padding: 0 12px; background: var(--surface); color: var(--sea-deep); font-weight: 600; cursor: pointer; }
.box[aria-pressed="true"] { border-color: var(--sea); background: var(--sea-soft); }
@media (max-width: 760px) { .nav { display: none; } }

/* ---------- 첫 화면: 수평선 ---------- */
.hero { position: relative; background: linear-gradient(180deg, var(--sky-top), var(--sky-low) 78%); overflow: hidden; }
.hero-in { max-width: 1160px; margin: 0 auto; padding: 56px max(20px, env(safe-area-inset-right, 0px)) 96px max(20px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); gap: 32px; align-items: center; }
.hero h1 { font-family: var(--f-display); font-weight: 400; color: var(--sea-deep); font-size: clamp(34px, 5.2vw, 62px); line-height: 1.12; margin: 0 0 18px; letter-spacing: -.02em; max-width: 13em; }
.lead { font-size: 1.1em; max-width: 34em; margin: 0 0 26px; color: var(--ink); }
.ask { display: flex; gap: 8px; background: var(--surface); border: 2px solid var(--sea); border-radius: 999px; padding: 6px; max-width: 600px; box-shadow: 0 10px 30px -18px var(--sea); }
.ask input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 0 16px; min-height: 48px; font-size: 1.02em; }
.ask input:focus { outline: none; }
.ask:focus-within { outline: 3px solid var(--sun); outline-offset: 2px; }
.ask button { border: 0; border-radius: 999px; background: var(--sun); color: #2B1700; font-weight: 700; padding: 0 22px; min-height: 48px; cursor: pointer; white-space: nowrap; }
.tries { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; max-width: 640px; }
.tries button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; color: var(--sea-deep); font-size: .92em; }
.tries button:hover { border-color: var(--sea); }
.hero-art { position: relative; display: grid; place-items: center; min-height: 300px; }
.hero-art img { position: relative; width: min(300px, 70%); z-index: 1; }
.sun { position: absolute; width: min(320px, 80%); aspect-ratio: 1; border-radius: 50%; bottom: -40px;
  background: radial-gradient(circle, var(--sun) 0 58%, color-mix(in srgb, var(--sun) 35%, transparent) 59% 68%, transparent 69%);
  animation: rise 1.6s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes rise { from { transform: translateY(70px); opacity: .2; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sun { animation: none; } }
.sea { position: absolute; left: 0; right: 0; bottom: 0; height: 90px; z-index: 2; }
.sea svg { width: 100%; height: 100%; display: block; }
.sea path { fill: var(--wave); }
@media (max-width: 820px) {
  .hero-in { grid-template-columns: minmax(0, 1fr); padding-top: 24px; padding-bottom: 80px; }
  .ask button { padding: 0 16px; }
  .hero-art { min-height: 200px; order: -1; }
  .hero-art img { width: 160px; }
  .sun { width: 200px; bottom: -30px; }
}

/* ---------- 섹션 공통 ---------- */
.sec { padding-block: 56px 8px; }
.sec-head { max-width: 46em; margin-bottom: 20px; }
.sec-head h2 { font-size: clamp(26px, 3.2vw, 36px); margin: 0 0 6px; }
.sec-head p { margin: 0; color: var(--muted); }

/* ---------- 코스 만들기 ---------- */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid > .panel:first-child { position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow: auto; }
@media (max-width: 900px) { .grid > .panel:first-child { position: static; max-height: none; } }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 18px; min-width: 0; }
.says { display: flex; gap: 10px; align-items: flex-end; margin: 10px 0; }
.says img { height: 56px; flex: none; }
.bubble { background: var(--surface); border: 2px solid var(--sea); border-radius: 20px 20px 20px 6px; padding: 10px 14px; min-width: 0; }
.bubble b { display: block; font-family: var(--f-display); font-weight: 400; color: var(--sea); font-size: .85em; }
.me { display: flex; justify-content: flex-end; margin: 10px 0; }
.me span { background: var(--sea); color: var(--sea-ink); border-radius: 20px 20px 6px 20px; padding: 10px 14px; max-width: 85%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 15px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); cursor: pointer; }
.chip:hover { border-color: var(--sea); }
.chip[aria-pressed="true"] { border-color: var(--sun); background: var(--glow); font-weight: 600; }
.chip.go { background: var(--sea); border-color: var(--sea); color: var(--sea-ink); font-weight: 700; }
.chip:disabled { opacity: .55; cursor: default; }
.panel form input, .panel .chips input { border: 1.5px solid var(--line); border-radius: var(--r-s); padding: 0 12px; min-height: 46px; background: var(--surface); min-width: 0; }
.badge { display: inline-flex; gap: 4px; align-items: center; font-size: .8em; font-weight: 700; padding: 2px 10px; border-radius: 999px; white-space: nowrap; }
.g-G { background: var(--go-bg); color: var(--go); } .g-Y { background: var(--warn-bg); color: var(--warn); } .g-R { background: var(--stop-bg); color: var(--stop); }
.g-N { background: var(--mist); color: var(--muted); }
.stop { border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 14px; margin: 8px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; background: var(--surface); }
.map { height: 300px; border-radius: var(--r-m); overflow: hidden; border: 1px solid var(--line); background: var(--mist); display: grid; place-items: center; }
.via { font-size: .75em; font-weight: 700; display: inline-block; padding: 1px 10px; border-radius: 999px; margin: -4px 0 8px 66px; }
.via-llm { background: var(--sea-soft); color: var(--sea-deep); }
.via-rule { background: var(--mist); color: var(--muted); }
.stop .via { margin-left: 0; }

/* ---------- 관광지 ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { border: 0; background: none; padding: 10px 16px; font-family: var(--f-display); font-size: 1.15em; color: var(--muted); cursor: pointer; border-bottom: 4px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--z, var(--sea)); }
.filter { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.filter > span { font-weight: 600; }
.zone-d { margin: 4px 0 16px; }
.zone-d b { font-family: var(--f-display); font-weight: 400; font-size: 1.1em; margin-right: 6px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.art { position: relative; aspect-ratio: 300 / 130; }
.art svg { width: 100%; height: 100%; display: block; }
.art .badge { position: absolute; top: 10px; right: 10px; }
.pb { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pb h3 { margin: 0; font-size: 1.2em; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pb p { margin: 0; color: var(--muted); font-size: .94em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ex { font-family: var(--f-body); font-size: .7rem; font-weight: 700; color: var(--sun-deep); background: var(--glow); padding: 1px 8px; border-radius: 999px; }
.fac { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.fac li { font-size: .78em; background: var(--mist); border-radius: 8px; padding: 2px 8px; }
.add { margin-top: auto; align-self: flex-start; border: 1.5px solid var(--sea); color: var(--sea); background: var(--surface); border-radius: 999px; min-height: 40px; padding: 0 16px; font-weight: 700; cursor: pointer; }
.add.on { background: var(--sea); color: var(--sea-ink); }
.add:disabled { border-color: var(--line); color: var(--muted); cursor: default; }

/* ---------- 추천 코스 ---------- */
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.ccard { border-radius: var(--r-m); padding: 20px; background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--sea); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ccard h3 { margin: 0; font-size: 1.25em; }
.tags { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tags li { font-size: .82em; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.by { margin: 0; color: var(--muted); font-size: .88em; }
.start { margin-top: auto; align-self: flex-start; border: 0; background: var(--sea); color: var(--sea-ink); border-radius: 999px; min-height: 42px; padding: 0 18px; font-weight: 700; cursor: pointer; }

/* ---------- 후기 ---------- */
.rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.rv { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 18px; min-width: 0; }
.rv > p { margin: 0 0 10px; }
.rv-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rv-top span:not(.ex) { font-size: .8em; background: var(--mist); border-radius: 999px; padding: 1px 10px; }
.reply { display: flex; gap: 8px; align-items: flex-start; background: var(--mist); border-radius: var(--r-s); padding: 10px; }
.reply img { width: 40px; flex: none; }
.reply p { margin: 0; font-size: .92em; }
.reply b { display: block; font-family: var(--f-display); font-weight: 400; color: var(--sea); }

/* ---------- 안심(옆 시트) ---------- */
.sheet { position: fixed; z-index: 40; top: calc(76px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: min(440px, calc(100vw - 32px));
  max-height: calc(100vh - 100px); overflow: auto; background: var(--surface); border: 2px solid var(--stop); border-radius: var(--r-l); padding: 18px; box-shadow: 0 24px 60px -24px rgba(20, 36, 58, .45); }
.sheet h3 { margin: 14px 0 4px; font-size: 1.05em; }
.sheet .stop { flex-direction: column; gap: 2px; }

/* ---------- 바닥글 ---------- */
.foot { margin-top: 64px; background: var(--sea-deep); color: #E8F0FA; padding-block: 28px; }
.foot p { margin: 0 0 6px; max-width: 70em; font-size: .9em; }
.foot b { font-family: var(--f-display); font-weight: 400; font-size: 1.2em; margin-right: 6px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .foot { background: #08101A; } }
:root[data-theme="dark"] .foot { background: #08101A; }

/* ---------- 장소 사진 ---------- */
.ph { margin: 0; position: absolute; inset: 0; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 10px 6px; background: linear-gradient(transparent, rgba(10, 20, 32, .72)); font-size: .7rem; line-height: 1.3; }
.ph figcaption a { color: #fff; text-decoration: none; }
.ph figcaption a:hover { text-decoration: underline; }
.ph-s { position: static; flex: none; width: 76px; height: 76px; border-radius: var(--r-s); overflow: hidden; }
.credit { font-size: .72em; color: var(--muted); }

/* ---------- 작업2: 큰 버튼 질문 ---------- */
.big-chips .chip { min-height: 56px; padding: 0 20px; font-size: 1.05em; }
.chip small { font-size: .78em; color: var(--muted); margin-left: 4px; }
.chip.pick { display: inline-flex; align-items: center; gap: 8px; }
.chip.pick input { border: 0; background: transparent; font: inherit; color: inherit; min-height: 0; padding: 0; }
.when { display: grid; gap: 10px; margin-top: 8px; }
.when > .chip.go { justify-self: start; min-height: 52px; }

/* ---------- 작업3: 빠른 수정 ---------- */
.qc { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; margin-top: 10px; border-radius: var(--r-m); background: var(--mist); }
.qc .chip { background: var(--surface); }
.chip.undo { border-style: dashed; }

/* ---------- 작업2: 시간표 ---------- */
.tl-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.tl-date { font-family: var(--f-display); font-size: 1.35em; color: var(--sea-deep); margin: 0; }
.sum-btn { min-height: 48px; }
.tl { position: relative; }
.tl-drive { margin: 6px 0 2px 104px; font-size: .85em; }
.tl-card { display: grid; grid-template-columns: 58px 30px 1fr; gap: 0 8px; align-items: start; position: relative; }
.tl-card::before { content: ""; position: absolute; left: 80px; top: 30px; bottom: -34px; width: 2px; background: var(--line); }
.tl > div:last-child .tl-card::before { display: none; }
.tl-time { text-align: right; line-height: 1.2; padding-top: 4px; }
.tl-time b { display: block; font-size: 1.15em; font-variant-numeric: tabular-nums; }
.tl-time span { font-size: .8em; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--sea); color: var(--sea-ink); display: grid; place-items: center; font-weight: 700; position: relative; z-index: 1; }
.tl-body { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); padding: 12px 14px; min-width: 0; }
.tl-top { display: flex; gap: 10px; align-items: flex-start; }
.tl-top h4 { margin: 0; font-size: 1.08em; }
.tl-hours { margin: 2px 0 0; font-size: .85em; }
.tl-kind { margin-left: 6px; font-size: .72em; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--glow); color: var(--sun-deep); vertical-align: middle; }
.tl-kind.new { background: var(--sea-soft); color: var(--sea-deep); }
.tl-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.b-open { background: var(--go-bg); color: var(--go); }
.b-unknown { background: var(--warn-bg); color: var(--warn); }
.b-walk.flat { background: var(--go-bg); color: var(--go); }
.b-walk.gentle { background: var(--warn-bg); color: var(--warn); }
.b-walk.steep { background: var(--stop-bg); color: var(--stop); }
.b-walk.unk, .b-plain { background: var(--mist); color: var(--muted); }
.b-table { background: var(--sea-soft); color: var(--sea-deep); }
.b-table.floor { background: var(--warn-bg); color: var(--warn); }
.tl-why { margin: 6px 0; }
.tl-tip { margin: 8px 0; padding: 8px 10px; border-left: 3px solid var(--sun); background: var(--glow); border-radius: 0 var(--r-s) var(--r-s) 0; font-size: .92em; }
.tl-near { margin: 8px 0; font-size: .9em; }
.tl-near summary { cursor: pointer; color: var(--sea-deep); font-weight: 600; min-height: 32px; display: flex; align-items: center; }
.tl-near ul { margin: 4px 0 0 18px; padding: 0; display: grid; gap: 3px; }
.tl-near li.hl { font-weight: 700; }
.tl-act { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.tl-act .chip { min-height: 42px; font-size: .92em; }
.tl-more { margin: 4px 0 0 104px; font-size: .88em; }
.tl-more summary { cursor: pointer; color: var(--muted); }
.tl-skip, .tl-events { border-radius: var(--r-m); padding: 10px 14px; margin: 10px 0; background: var(--mist); }
.tl-skip ul, .tl-events ul { margin: 4px 0 0 18px; padding: 0; }
.tl-events.on { background: var(--glow); }
.tl-card.is-new .tl-body { border-color: var(--sea); box-shadow: 0 0 0 3px var(--sea-soft); }
@media (prefers-reduced-motion: no-preference) {
  .tl-card.is-new .tl-body { animation: tl-in .6s ease-out; }
  @keyframes tl-in { from { box-shadow: 0 0 0 10px var(--sea-soft); } }
}
.tl-time-m { display: none; }
@media (max-width: 560px) {
  .tl-card, body.big .tl-card { grid-template-columns: 30px 1fr; gap: 0 8px; }
  .tl-time { display: none; }
  .tl-time-m { display: block; margin: 0 0 6px; font-weight: 700; font-size: 1.1em; color: var(--sea-deep); font-variant-numeric: tabular-nums; }
  .tl-card::before, body.big .tl-card::before { left: 14px; }
  .tl-drive, .tl-more { margin-left: 38px; }
  .tl-top { flex-wrap: wrap; }
  .tl-top .ph-s { width: 72px; height: 72px; flex: none; }
  .tl-body { padding: 10px 12px; }
}

/* ---------- 작업4: 글자 크게 보기 + 큰 글씨 요약 일정표 ---------- */
.bigt { display: inline-flex; align-items: center; gap: 6px; }
.bigt span { font-family: var(--f-display); font-size: 1.25em; line-height: 1; }
body.big { font-size: 21px; }
body.big .chip { min-height: 54px; }
@media (min-width: 561px) {
  body.big .tl-card { grid-template-columns: 70px 34px 1fr; }
  body.big .tl-card::before { left: 95px; }
}
.sum { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow: auto; }
.sum-in { max-width: 760px; margin: 0 auto; padding: 28px 18px 40px; font-size: 22px; line-height: 1.5; }
.sum-head h2 { font-family: var(--f-display); font-size: 1.6em; margin: 0; color: var(--sea-deep); }
.sum-date { font-size: 1.15em; font-weight: 700; margin: 4px 0 18px; }
.sum-list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.sum-list li { display: grid; grid-template-columns: 4.2em 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.sum-t { font-size: 1.25em; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--sea-deep); }
.sum-n { font-size: 1.15em; }
.sum-b, .sum-s { margin: 2px 0 0; font-size: .85em; }
.sum-s { color: var(--muted); }
.sum-back { font-weight: 700; margin: 14px 0; }
.sum-emer { border: 2px solid var(--stop); border-radius: var(--r-m); padding: 10px 14px; margin: 14px 0; }
.sum-emer p { margin: 2px 0; }
.sum-act { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.sum-act .chip { min-height: 56px; font-size: .85em; padding: 0 22px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 80; max-width: min(92vw, 520px); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: var(--r-m); white-space: pre-wrap; }
@media print {
  body:has(.sum) > *:not(.sum), body:has(.sum) main, body:has(.sum) header, body:has(.sum) footer { display: none !important; }
  .sum { position: static; background: #fff; color: #000; }
  .sum-act, .toast { display: none !important; }
  .sum-in { font-size: 18pt; }
}

/* ---------- 달력 ---------- */
.cal { border: 1.5px solid var(--line); border-radius: var(--r-m); background: var(--surface); padding: 12px; max-width: 420px; width: 100%; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-head b { font-family: var(--f-display); font-weight: 400; font-size: 1.3em; color: var(--sea-deep); }
.cal-nav { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.6em; line-height: 1; cursor: pointer; }
.cal-nav:disabled { opacity: .35; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-wd { text-align: center; font-size: .85em; font-weight: 700; color: var(--muted); padding: 4px 0; }
.cal-day { aspect-ratio: 1; min-height: 40px; min-width: 0; padding: 0; border: 0; border-radius: var(--r-s); background: var(--mist); font-size: 1.1em; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.cal-day:hover:not(:disabled) { outline: 2px solid var(--sea); }
.cal-sun { color: var(--stop); } .cal-sat { color: var(--sea); }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--sun); }
.cal-day[aria-pressed="true"] { background: var(--sea); color: var(--sea-ink); }
.cal-day:disabled { background: transparent; color: var(--line); cursor: default; }
.cal-sel { margin: 10px 2px 0; }
.when-h { margin: 4px 0 0; font-weight: 700; }

/* ---------- v4 페이지 공통 ---------- */
.nav a[aria-current="page"] { color: var(--sea-deep); box-shadow: inset 0 -3px 0 var(--sun); }
.page-head { margin-bottom: 18px; }
.page-head h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.8em, 4vw, 2.4em); color: var(--sea-deep); margin: 6px 0 4px; }
.crumb { font-size: .9em; color: var(--muted); }
.crumb a { color: var(--sea-deep); }
.h3 { font-size: 1.15em; margin: 0 0 10px; }
.small { font-size: .85em; }
.cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; margin-bottom: 14px; }
.sec .panel + .panel, .sec .cards2 + .panel, .sec .panel + .cards2 { margin-top: 14px; }
.cards2 > .panel + .panel { margin-top: 0; }
.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.stops { columns: 2 220px; margin: 8px 0; padding-left: 1.4em; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92em; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: .85em; color: var(--muted); font-weight: 700; white-space: nowrap; }
.dot { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700; flex: none; margin-right: 6px; vertical-align: middle; }
.plink { color: inherit; text-decoration: none; }
.plink:hover { text-decoration: underline; }
.pcard .more { display: inline-block; margin: 2px 0 8px; color: var(--sea-deep); font-weight: 600; font-size: .92em; }

/* 장소 상세 */
.pp-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; align-items: start; }
.pp-grid > div { display: grid; gap: 14px; }
.pp-grid .panel + .panel { margin-top: 0; }
.pp-photo .ph { margin: 0; border-radius: var(--r-m); overflow: hidden; aspect-ratio: 4/3; }
.pp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pp-today { font-weight: 600; }
.seglist { margin: 12px 0; padding-left: 1.4em; display: grid; gap: 10px; }
.seglist li { padding-left: 4px; }
.seg-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seglist p { margin: 2px 0; }
.seg-src { font-size: .82em; }
.near-list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
@media (max-width: 860px) { .pp-grid { grid-template-columns: 1fr; } }

/* 편의시설 지도 */
.layers .chip { display: inline-flex; align-items: center; }
.layers .chip[aria-pressed="false"] .dot { filter: grayscale(1); opacity: .5; }
.fac-list { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 6px; max-height: 520px; overflow: auto; }
.fac-list li { display: flex; gap: 6px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r-s); background: var(--surface); border: 1px solid var(--line); }
.fac-list li.sel { border-color: var(--sea); box-shadow: 0 0 0 3px var(--sea-soft); }

/* 내 일정 */
.my-list { list-style: none; padding: 0; display: grid; gap: 12px; }
.my-list li { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.my-list li p { margin: 4px 0; }
.my-date { font-size: 1.1em; color: var(--sea-deep); }

/* 행사 달력 */
.ev-grid { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 18px; align-items: start; }
.ev-list { list-style: none; padding: 0; display: grid; gap: 10px; }
.ev-list p { margin: 4px 0; }
.cal-day.has-ev { position: relative; background: var(--glow); }
.cal-day.has-ev i { position: absolute; left: 50%; bottom: 5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--sun-deep); }
@media (max-width: 760px) { .ev-grid { grid-template-columns: 1fr; } }

/* 여행 준비 */
.emer { border: 2px solid var(--stop); }
.faq { display: grid; gap: 10px; margin-top: 14px; }
.faq summary { cursor: pointer; font-weight: 700; min-height: 32px; }

/* 관리자 */
.admin-key { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.admin-key input { min-height: 44px; }
.visit-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px 14px; margin: 14px 0; }
.visit-form h2, .visit-form .wide { grid-column: 1 / -1; }
.visit-form label { display: grid; gap: 4px; min-width: 0; font-size: .9em; font-weight: 600; }
.visit-form input, .visit-form select, .visit-form textarea { width: 100%; min-width: 0; box-sizing: border-box; min-height: 42px; font: inherit; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: var(--r-s); background: var(--surface); color: inherit; }
.visit-form .chip.go { justify-self: start; }
.rv-list { list-style: none; padding: 0; display: grid; gap: 10px; }
.rv-list select, .rv-list input { min-height: 42px; font: inherit; padding: 4px 10px; border: 1.5px solid var(--line); border-radius: var(--r-s); background: var(--surface); color: inherit; }

/* 아래 메뉴 */
.foot-nav { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 12px; }
.foot-nav a { color: inherit; font-weight: 600; }
.tabbar { display: none; }
@media (max-width: 760px) {
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar a { display: grid; justify-items: center; gap: 2px; padding: 8px 2px; min-height: 58px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 700; text-align: center; line-height: 1.15; }
  .tabbar a span { font-size: 20px; }
  .tabbar a[aria-current="page"] { color: var(--sea-deep); box-shadow: inset 0 3px 0 var(--sun); }
  body { padding-bottom: 66px; }
}
@media print { .tabbar { display: none !important; } }

/* ---------- 관리자 공지 (사이트 전체) ---------- */
.site-notes { display: grid; }
.site-note { margin: 0; padding: 10px 16px; text-align: center; background: var(--sea-soft); color: var(--sea-deep); font-size: .95em; }
.site-note.warn, .site-note.closed { background: var(--warn-bg); color: var(--warn); }
.site-note b { margin-right: 6px; }
.pp-notice { border-radius: var(--r-m); padding: 12px 14px; background: var(--sea-soft); color: var(--sea-deep); }
.pp-notice.warn { background: var(--warn-bg); color: var(--warn); }
.pp-notice.closed { background: var(--stop-bg); color: var(--stop); }
.pp-notice small { margin-left: 8px; opacity: .8; }
.pp-notice p { margin: 4px 0 0; color: var(--ink); }
.tl-notice { margin: 6px 0; padding: 6px 10px; border-radius: var(--r-s); background: var(--warn-bg); color: var(--warn); font-weight: 600; }

/* ---------- 관리자 화면 ---------- */
.admin .login { display: grid; gap: 12px; max-width: 420px; }
.admin .login label { display: grid; gap: 4px; font-weight: 600; }
.admin .login input, .pick-place select { min-height: 48px; font: inherit; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: var(--r-s); background: var(--surface); color: inherit; }
.chip.demo { border: 2px dashed var(--sun); }
.chip.danger { background: var(--stop); color: var(--on-signal); border-color: var(--stop); }
.err { color: var(--stop); font-weight: 600; }
.admin-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.admin-tabs { flex-wrap: wrap; }
.admin-msg { padding: 10px 14px; border-radius: var(--r-s); font-weight: 600; }
.admin-msg.ok { background: var(--go-bg); color: var(--go); }
.admin-msg.bad { background: var(--stop-bg); color: var(--stop); }
.pick-place { display: grid; gap: 6px; font-weight: 700; max-width: 420px; }
.days { display: flex; flex-wrap: wrap; gap: 8px 14px; border: 1.5px solid var(--line); border-radius: var(--r-s); padding: 8px 12px; }
.days legend { font-weight: 600; font-size: .9em; padding: 0 4px; }
label.day { display: inline-flex !important; align-items: center; gap: 6px; font-weight: 600; }
label.day input { width: 20px !important; height: 20px; min-height: 0 !important; }
.seg-edit input { width: 100%; min-width: 64px; min-height: 38px; font: inherit; padding: 4px 6px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: inherit; box-sizing: border-box; }
.seg-edit td:first-child input { min-width: 150px; }
.save-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.post-notice { margin: 10px 0; padding: 10px; border-radius: var(--r-s); background: var(--mist); }
.tbl tr.reverted td { opacity: .5; }
.backup { margin-bottom: 14px; }

.demo-note { background: var(--glow); color: var(--ink); border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
.demo-note .in { max-width: 1160px; margin: 0 auto; padding-block: 8px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.demo-note b { font-family: var(--f-display); font-weight: 400; color: var(--sun-deep); }
.demo-note a { color: var(--sea); font-weight: 600; }
</style>
