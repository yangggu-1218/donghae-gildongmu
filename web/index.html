<style>
/* 동해 길동무 — 동이(파란 갈매기·등대 모자)의 색에서 출발한 토큰.
   한 가지 강조: 첫 화면의 '수평선 위로 뜨는 해'. 나머지는 조용하게. */
:root {
  --bg: #F3F8FD; --surface: #FFFFFF; --mist: #E8F0FA; --line: #C9D8EA; --line-strong: #7A92B0;
  --ink: #14243A; --muted: #4F5E73;
  --sea: #2462B4; --sea-deep: #12355E; --sea-ink: #FFFFFF; --sea-soft: #DCE8F8;
  --sun: #F29A33; --sun-deep: #A45400; --glow: #FFF1D3;
  --sky-top: #DCEBFA; --sky-low: #F7FAFE; --wave: #2462B4;
  --go: #17692E; --go-bg: #E3F4E8; --warn: #6E4A00; --warn-dot: #F2B416; --warn-bg: #FFF2CC;
  --stop: #B3261E; --stop-bg: #FCE6E4; --on-signal: #FFFFFF;
  --shadow-float: 0 18px 40px -22px rgba(12, 35, 64, .55);
  --f-display: "Jua", "IBM Plex Sans KR", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --r-l: 28px; --r-m: 18px; --r-s: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1420; --surface: #111C2B; --mist: #18263A; --line: #2A3B53; --line-strong: #5B7394; --ink: #E8EEF6; --muted: #A0AEC0;
    --sea: #82AEF0; --sea-deep: #CFE0FA; --sea-ink: #0B1420; --sea-soft: #1C3152; --sun: #F5A852; --sun-deep: #F5A852; --glow: #3A2F1A;
    --sky-top: #0F2036; --sky-low: #0B1420; --wave: #1F4E8C;
    --go: #5ACB84; --go-bg: #15301F; --warn: #F2C14A; --warn-dot: #F2C14A; --warn-bg: #33290F;
    --stop: #F2766B; --stop-bg: #3A1A18; --on-signal: #0B1420; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1420; --surface: #111C2B; --mist: #18263A; --line: #2A3B53; --line-strong: #5B7394; --ink: #E8EEF6; --muted: #A0AEC0;
  --sea: #82AEF0; --sea-deep: #CFE0FA; --sea-ink: #0B1420; --sea-soft: #1C3152; --sun: #F5A852; --sun-deep: #F5A852; --glow: #3A2F1A;
  --sky-top: #0F2036; --sky-low: #0B1420; --wave: #1F4E8C;
  --go: #5ACB84; --go-bg: #15301F; --warn: #F2C14A; --warn-dot: #F2C14A; --warn-bg: #33290F;
  --stop: #F2766B; --stop-bg: #3A1A18; --on-signal: #0B1420; color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 84px; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.65; word-break: keep-all; overflow-wrap: break-word; }

button, input, select { font: inherit; color: inherit; }
img { max-width: 100%; }
a { color: var(--sea); }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { text-wrap: balance; }
h2, h3 { font-family: var(--f-display); font-weight: 400; color: var(--sea-deep); letter-spacing: -.01em; }
.wrap { max-width: 1160px; margin: 0 auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--sea); color: var(--sea-ink); padding: 11px 16px; border-radius: 10px; z-index: 50; }
.skip:focus { left: 12px; }
.muted { color: var(--muted); font-size: .92em; }

/* ---------- 머리글 ---------- */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.bar { display: flex; gap: 16px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding-block: 10px; }
.brand { font-family: var(--f-display); font-size: 26px; color: var(--sea); display: flex; align-items: center; gap: 8px; text-decoration: none; }
.brand img { height: 42px; }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { text-decoration: none; color: var(--ink); padding: 8px 12px; border-radius: 10px; font-weight: 600; }
.nav a:hover { background: var(--mist); }
.tools { display: flex; gap: 8px; }
.sos { border: 0; border-radius: var(--r-s); background: var(--stop); color: var(--on-signal); min-height: 44px; padding: 0 18px; font-weight: 700; cursor: pointer; }
.box { border: 1.5px solid var(--line-strong); border-radius: var(--r-s); min-height: 44px; padding: 0 12px; background: var(--surface); color: var(--sea-deep); font-weight: 600; cursor: pointer; }
.box[aria-pressed="true"] { border-color: var(--sea); background: var(--sea-soft); }
@media (max-width: 760px) { .nav { display: none; } }

/* ---------- 첫 화면: 실제 동해 사진 + 판정 카드 ---------- */
.hero { position: relative; isolation: isolate; overflow: hidden; background: linear-gradient(115deg, #0C2340 0%, #17457F 60%, #2462B4 100%); color: #fff; }
.hero-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 62%; z-index: -2; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(90deg, rgba(8, 24, 46, .88) 0%, rgba(8, 24, 46, .66) 42%, rgba(8, 24, 46, .12) 72%, rgba(8, 24, 46, 0) 100%), linear-gradient(0deg, rgba(8, 24, 46, .5), rgba(8, 24, 46, 0) 38%); }
.hero-in { max-width: 1160px; margin: 0 auto; min-height: min(640px, 78vh); padding: 72px max(20px, env(safe-area-inset-right, 0px)) 104px max(20px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, .5fr); gap: 32px; align-items: end; }
.hero h1 { font-family: var(--f-display); font-weight: 400; color: #fff; font-size: clamp(34px, 5vw, 60px); line-height: 1.14; margin: 0 0 18px; letter-spacing: -.02em; max-width: 12.5em; text-shadow: 0 2px 18px rgba(4, 14, 28, .45); }
.lead { font-size: 1.12em; max-width: 33em; margin: 0 0 28px; color: #EEF4FB; }
.ask { display: flex; gap: 8px; align-items: center; background: #fff; border-radius: 999px; padding: 6px 6px 6px 8px; max-width: 620px; box-shadow: 0 18px 40px -18px rgba(4, 14, 28, .8); }
.ask-dongi { height: 46px; width: 46px; object-fit: contain; flex: none; }
.ask input { flex: 1; min-width: 0; border: 0; background: transparent; color: #14243A; padding: 0 8px; min-height: 52px; font-size: 1.04em; }
.ask input::placeholder { color: #5B6B80; }
.ask input:focus { outline: none; }
.ask:focus-within { outline: 3px solid var(--sun); outline-offset: 3px; }
.ask button { border: 0; border-radius: 999px; background: #F29A33; color: #2B1700; font-weight: 700; padding: 0 24px; min-height: 52px; cursor: pointer; white-space: nowrap; }
.ask button:hover { background: #F7AC52; }
.tries { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; max-width: 660px; }
.tries button { border: 1px solid rgba(255, 255, 255, .55); background: rgba(8, 24, 46, .42); backdrop-filter: blur(6px); border-radius: 999px; padding: 7px 16px; min-height: 44px; cursor: pointer; color: #fff; font-size: .95em; }
.tries button:hover { background: rgba(8, 24, 46, .7); border-color: #fff; }
.hero-spot { justify-self: end; display: grid; gap: 4px; text-decoration: none; color: #14243A; background: #fff; border-radius: var(--r-m); padding: 16px 18px; min-width: 220px; box-shadow: var(--shadow-float); }
.hero-spot:hover { background: #fff; }
.hero-spot-k { font-size: .875em; color: #4F5E73; font-weight: 600; }
.hero-spot b { font-family: var(--f-display); font-weight: 400; font-size: 1.3em; color: #12355E; line-height: 1.2; }
.hero-spot-g { display: flex; align-items: center; gap: 8px; font-size: .9em; flex-wrap: wrap; }
.hero-spot-g .g-G { background: #E3F4E8; color: #17692E; } .hero-spot-g .g-Y { background: #FFF2CC; color: #6E4A00; } .hero-spot-g .g-R { background: #FCE6E4; color: #B3261E; } .hero-spot-g .g-N { background: #E8F0FA; color: #4F5E73; }
.hero-spot-m { font-size: .9em; font-weight: 700; color: #2462B4; text-decoration: underline; text-underline-offset: 3px; }
@media (max-width: 820px) {
  .hero::after { background: linear-gradient(180deg, rgba(8, 24, 46, .5) 0%, rgba(8, 24, 46, .78) 55%, rgba(8, 24, 46, .92) 100%); }
  .hero-in { grid-template-columns: minmax(0, 1fr); min-height: 0; padding-top: 120px; padding-bottom: 72px; gap: 20px; }
  .hero-bg { object-position: 42% 40%; }
  .ask button { padding: 0 16px; }
  .ask-dongi { height: 38px; width: 38px; }
  .hero-spot { justify-self: start; min-width: 0; grid-template-columns: auto; }
}

/* ---------- 확인 범위 숫자 ---------- */
.facts { margin-top: 28px; }
.facts ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; }
.facts li + li { border-left: 1px solid var(--line); }
.facts a { display: grid; gap: 2px; padding: 18px 20px; text-decoration: none; color: var(--ink); height: 100%; }
.facts a:hover { background: var(--mist); }
.facts b { font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 3.4vw, 40px); line-height: 1.1; color: var(--sea); }
.facts b small { font-size: .5em; margin-left: 2px; color: var(--sea-deep); }
.facts span { font-size: .95em; color: var(--muted); font-weight: 600; }
@media (max-width: 700px) {
  .facts ul { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts li + li { border-left: 0; } .facts li:nth-child(even) { border-left: 1px solid var(--line); } .facts li:nth-child(n+3) { border-top: 1px solid var(--line); }
  .facts a { padding: 14px 16px; }
}

/* ---------- 권역 타일 ---------- */
.ztiles { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
.ztile { position: relative; grid-column: span 2; min-height: 220px; border-radius: var(--r-m); overflow: hidden; display: flex; align-items: flex-end; text-decoration: none; color: #fff; background: var(--z, var(--sea)); isolation: isolate; }
.ztile:nth-child(-n+2) { grid-column: span 3; min-height: 300px; }
.ztile .ph { z-index: -2; }
.ztile .ph img { transition: transform .5s ease; }
.ztile::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, rgba(8, 24, 46, .86) 0%, rgba(8, 24, 46, .35) 46%, rgba(8, 24, 46, 0) 70%); }
.ztile-t { display: grid; gap: 2px; padding: 18px 20px; border-left: 6px solid var(--z, var(--sun)); margin: 0 0 16px; }
.ztile-t b { font-family: var(--f-display); font-weight: 400; font-size: 1.7em; line-height: 1.15; }
.ztile-t span { font-size: .95em; color: #EEF4FB; }
.ztile-t em { font-style: normal; font-size: .85em; font-weight: 700; color: #FFD9A6; }
@media (hover: hover) and (prefers-reduced-motion: no-preference) { .ztile:hover .ph img { transform: scale(1.04); } }
@media (max-width: 860px) { .ztiles { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } .ztile, .ztile:nth-child(-n+2) { grid-column: span 1; min-height: 190px; } .ztile:first-child { grid-column: span 2; min-height: 220px; } .ztile-t { padding: 12px 14px; margin-bottom: 12px; } .ztile-t b { font-size: 1.4em; } .ztile-t span { font-size: .85em; } }

/* ---------- 더 알아보기 ---------- */
.more-grid { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.more-grid a { display: grid; gap: 4px; height: 100%; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); text-decoration: none; color: var(--ink); }
.more-grid a:hover { border-color: var(--sea); background: var(--mist); }
.more-grid b { font-family: var(--f-display); font-weight: 400; font-size: 1.25em; color: var(--sea-deep); }
.more-grid span { font-size: .92em; color: var(--muted); }

/* ---------- 섹션 공통 ---------- */
.sec { padding-block: 56px 8px; }
.sec-head { max-width: 46em; margin-bottom: 20px; }
.sec-head h2 { font-size: clamp(26px, 3.2vw, 36px); margin: 0 0 6px; }
.sec-head p { margin: 0; color: var(--muted); }

/* ---------- 코스 만들기 ---------- */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.grid > .panel:first-child { position: sticky; top: 84px; max-height: calc(100vh - 100px); overflow: auto; }
@media (max-width: 900px) { .grid > .panel:first-child { position: static; max-height: none; } }
@media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l); padding: 18px; min-width: 0; }
.says { display: flex; gap: 10px; align-items: flex-end; margin: 10px 0; }
.says img { height: 56px; flex: none; }
.bubble { background: var(--mist); border: 1px solid var(--line); border-radius: 20px 20px 20px 6px; padding: 10px 14px; min-width: 0; }
.bubble b { display: block; font-family: var(--f-display); font-weight: 400; color: var(--sea-deep); font-size: .9em; }
.me { display: flex; justify-content: flex-end; margin: 10px 0; }
.me span { background: var(--sea); color: var(--sea-ink); border-radius: 20px 20px 6px 20px; padding: 10px 14px; max-width: 85%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 15px; border-radius: 999px; border: 1.5px solid var(--line-strong); background: var(--surface); cursor: pointer; }
a.chip { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; color: var(--sea-deep); font-weight: 600; }
.chip:hover { border-color: var(--sea); }
.chip[aria-pressed="true"] { border-color: var(--sun); background: var(--glow); font-weight: 600; }
.chip.go { background: var(--sea); border-color: var(--sea); color: var(--sea-ink); font-weight: 700; }
.chip:disabled, .chip.go:disabled, .start:disabled, .ask button:disabled, .tries button:disabled { background: var(--mist); border-color: var(--line); color: var(--muted); cursor: default; }
.panel form input, .panel .chips input { border: 1.5px solid var(--line-strong); border-radius: var(--r-s); padding: 0 12px; min-height: 46px; background: var(--surface); min-width: 0; }
.badge { display: inline-flex; gap: 4px; align-items: center; font-size: max(14px, .875em); font-weight: 700; line-height: 1.35; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.g-G { background: var(--go-bg); color: var(--go); } .g-Y { background: var(--warn-bg); color: var(--warn); } .g-R { background: var(--stop-bg); color: var(--stop); }
.g-N { background: var(--mist); color: var(--muted); }
.stop { border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 14px; margin: 8px 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; background: var(--surface); }
.map { height: 300px; border-radius: var(--r-m); overflow: hidden; border: 1px solid var(--line); background: var(--mist); display: grid; place-items: center; }
.via { font-size: .75em; font-weight: 700; display: inline-block; padding: 1px 10px; border-radius: 999px; margin: -4px 0 8px 66px; }
.via-llm { background: var(--sea-soft); color: var(--sea-deep); }
.via-rule { background: var(--mist); color: var(--muted); }
.stop .via { margin-left: 0; }

/* ---------- 관광지 ---------- */
.tabs { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { border: 0; background: none; padding: 10px 16px; font-family: var(--f-display); font-size: 1.15em; color: var(--muted); cursor: pointer; border-bottom: 4px solid transparent; margin-bottom: -1px; }
.tabs button[aria-pressed="true"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--z, var(--sea)); }
.tabs button:hover { color: var(--ink); }
.filter { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.filter > span { font-weight: 600; }
.zone-d { margin: 4px 0 16px; }
.zone-d b { font-family: var(--f-display); font-weight: 400; font-size: 1.1em; margin-right: 6px; }
.pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.art { position: relative; aspect-ratio: 300 / 130; }
.art svg { width: 100%; height: 100%; display: block; }
.art .badge { position: absolute; top: 10px; right: 10px; }
.pb { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pb h3 { margin: 0; font-size: 1.2em; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.pb p { margin: 0; color: var(--muted); font-size: .94em; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.ex { font-family: var(--f-body); font-size: .7rem; font-weight: 700; color: var(--sun-deep); background: var(--glow); padding: 1px 8px; border-radius: 999px; }
.fac { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.fac li { font-size: .78em; background: var(--mist); border-radius: 8px; padding: 2px 8px; }
.add { margin-top: auto; align-self: flex-start; border: 1.5px solid var(--sea); color: var(--sea); background: var(--surface); border-radius: 999px; min-height: 44px; padding: 0 16px; font-weight: 700; cursor: pointer; }
.add.on { background: var(--sea); color: var(--sea-ink); }
.add:disabled { border-color: var(--line); color: var(--muted); cursor: default; }

/* ---------- 추천 코스 ---------- */
.cgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.ccard { border-radius: var(--r-m); padding: 20px; background: var(--surface); border: 1px solid var(--line); border-top: 6px solid var(--sea); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.ccard h3 { margin: 0; font-size: 1.25em; }
.tags { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.tags li { font-size: .82em; border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px; }
.by { margin: 0; color: var(--muted); font-size: .88em; }
.start { margin-top: auto; align-self: flex-start; border: 0; background: var(--sea); color: var(--sea-ink); border-radius: 999px; min-height: 48px; padding: 0 20px; font-weight: 700; cursor: pointer; }

/* ---------- 후기 ---------- */
.rgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.rv { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 18px; min-width: 0; }
.rv > p { margin: 0 0 10px; }
.rv-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.rv-top span:not(.ex) { font-size: .8em; background: var(--mist); border-radius: 999px; padding: 1px 10px; }
.reply { display: flex; gap: 8px; align-items: flex-start; background: var(--mist); border-radius: var(--r-s); padding: 10px; }
.reply img { width: 40px; flex: none; }
.reply p { margin: 0; font-size: .92em; }
.reply b { display: block; font-family: var(--f-display); font-weight: 400; color: var(--sea); }

/* ---------- 안심(옆 시트) ---------- */
.sheet { position: fixed; z-index: 40; top: calc(76px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: min(440px, calc(100vw - 32px));
  max-height: calc(100vh - 100px); overflow: auto; background: var(--surface); border: 2px solid var(--stop); border-radius: var(--r-l); padding: 18px; box-shadow: 0 24px 60px -24px rgba(20, 36, 58, .45); }
.sheet h3 { margin: 14px 0 4px; font-size: 1.05em; }
.sheet .stop { flex-direction: column; gap: 2px; }

/* ---------- 바닥글 ---------- */
.foot { margin-top: 64px; background: var(--sea-deep); color: #E8F0FA; padding-block: 28px; }
.foot p { margin: 0 0 6px; max-width: 70em; font-size: .9em; }
.foot b { font-family: var(--f-display); font-weight: 400; font-size: 1.2em; margin-right: 6px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .foot { background: #08101A; } }
:root[data-theme="dark"] .foot { background: #08101A; }

/* ---------- 장소 사진 ---------- */
.ph { margin: 0; position: absolute; inset: 0; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph figcaption { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 10px 6px; background: linear-gradient(transparent, rgba(10, 20, 32, .72)); font-size: .7rem; line-height: 1.3; }
.ph figcaption a { color: #fff; text-decoration: none; }
.ph figcaption a:hover { text-decoration: underline; }
.ph-s { position: static; flex: none; width: 76px; height: 76px; border-radius: var(--r-s); overflow: hidden; }
.credit { font-size: .72em; color: var(--muted); }

/* ---------- 작업2: 큰 버튼 질문 ---------- */
.big-chips .chip { min-height: 56px; padding: 0 20px; font-size: 1.05em; }
.chip small { font-size: .78em; color: var(--muted); margin-left: 4px; }
.chip.pick { display: inline-flex; align-items: center; gap: 8px; }
.chip.pick input { border: 0; background: transparent; font: inherit; color: inherit; min-height: 0; padding: 0; }
.when { display: grid; }

/* ---------- 작업3: 빠른 수정 ---------- */
.qc .chip { background: var(--surface); }
.chip.undo { border-style: dashed; }

/* ---------- 작업2: 시간표 ---------- */
.tl-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
.tl-date { font-family: var(--f-display); font-size: 1.35em; color: var(--sea-deep); margin: 0; }
.sum-btn { min-height: 48px; }
.tl { position: relative; }
.tl-drive { margin: 6px 0 2px 104px; font-size: .85em; }
.tl-card { display: grid; grid-template-columns: 58px 30px 1fr; gap: 0 8px; align-items: start; position: relative; }
.tl-card::before { content: ""; position: absolute; left: 80px; top: 30px; bottom: -34px; width: 2px; background: var(--line); }
.tl > div:last-child .tl-card::before { display: none; }
.tl-time { text-align: right; line-height: 1.2; padding-top: 4px; }
.tl-time b { display: block; font-size: 1.15em; font-variant-numeric: tabular-nums; }
.tl-time span { font-size: .8em; color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--sea); color: var(--sea-ink); display: grid; place-items: center; font-weight: 700; position: relative; z-index: 1; }
.tl-body { border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); padding: 12px 14px; min-width: 0; }
.tl-top { display: flex; gap: 10px; align-items: flex-start; }
.tl-top h4 { margin: 0; font-size: 1.08em; }
.tl-hours { margin: 2px 0 0; font-size: .85em; }
.tl-kind { margin-left: 6px; font-size: .72em; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--glow); color: var(--sun-deep); vertical-align: middle; display: inline-block; white-space: nowrap; line-height: 1.4; margin-top: 2px; }
.tl-kind.new { background: var(--sea-soft); color: var(--sea-deep); }
.tl-badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 4px; }
.b-open { background: var(--go-bg); color: var(--go); }
.b-unknown { background: var(--warn-bg); color: var(--warn); }
.b-walk.flat { background: var(--go-bg); color: var(--go); }
.b-walk.gentle { background: var(--warn-bg); color: var(--warn); }
.b-walk.steep { background: var(--stop-bg); color: var(--stop); }
.b-walk.unk, .b-plain { background: var(--mist); color: var(--muted); }
.b-table { background: var(--sea-soft); color: var(--sea-deep); }
.b-table.floor { background: var(--warn-bg); color: var(--warn); }
.tl-why { margin: 6px 0; }
.tl-tip { margin: 8px 0; padding: 8px 10px; border-left: 3px solid var(--sun); background: var(--glow); border-radius: 0 var(--r-s) var(--r-s) 0; font-size: .92em; }
.tl-near { margin: 8px 0; font-size: .9em; }
.tl-near summary { cursor: pointer; color: var(--sea-deep); font-weight: 600; min-height: 44px; display: flex; align-items: center; }
.tl-near ul { margin: 4px 0 0 18px; padding: 0; display: grid; gap: 3px; }
.tl-near li.hl { font-weight: 700; }
.tl-act { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.tl-act .chip { min-height: 44px; font-size: .95em; }
.tl-more { margin: 4px 0 0 104px; font-size: .88em; }
.tl-more summary, .tl-eats summary { cursor: pointer; color: var(--sea-deep); font-weight: 600; min-height: 44px; display: flex; align-items: center; }
.tl-skip, .tl-events { border-radius: var(--r-m); padding: 10px 14px; margin: 10px 0; background: var(--mist); }
.tl-skip ul, .tl-events ul { margin: 4px 0 0 18px; padding: 0; }
.tl-events.on { background: var(--glow); }
.tl-card.is-new .tl-body { border-color: var(--sea); box-shadow: 0 0 0 3px var(--sea-soft); }
@media (prefers-reduced-motion: no-preference) {
  .tl-card.is-new .tl-body { animation: tl-in .6s ease-out; }
  @keyframes tl-in { from { box-shadow: 0 0 0 10px var(--sea-soft); } }
}
.tl-time-m { display: none; }
@media (max-width: 560px) {
  .tl-card, body.big .tl-card { grid-template-columns: 30px 1fr; gap: 0 8px; }
  .tl-time { display: none; }
  .tl-time-m { display: block; margin: 0 0 6px; font-weight: 700; font-size: 1.1em; color: var(--sea-deep); font-variant-numeric: tabular-nums; }
  .tl-card::before, body.big .tl-card::before { left: 14px; }
  .tl-drive, .tl-more { margin-left: 38px; }
  .tl-top { flex-wrap: wrap; }
  .tl-top .ph-s { width: 72px; height: 72px; flex: none; }
  .tl-body { padding: 10px 12px; }
}

/* ---------- 작업4: 글자 크게 보기 + 큰 글씨 요약 일정표 ---------- */
.bigt { display: inline-flex; align-items: center; gap: 6px; }
.bigt span { font-family: var(--f-display); font-size: 1.25em; line-height: 1; }
body.big { font-size: 21px; }
body.big .chip { min-height: 54px; }
@media (min-width: 561px) {
  body.big .tl-card { grid-template-columns: 70px 34px 1fr; }
  body.big .tl-card::before { left: 95px; }
}
.sum { position: fixed; inset: 0; z-index: 60; background: var(--bg); overflow: auto; }
.sum-in { max-width: 760px; margin: 0 auto; padding: 28px 18px 40px; font-size: 22px; line-height: 1.5; }
.sum-head h2 { font-family: var(--f-display); font-size: 1.6em; margin: 0; color: var(--sea-deep); }
.sum-date { font-size: 1.15em; font-weight: 700; margin: 4px 0 18px; }
.sum-list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.sum-list li { display: grid; grid-template-columns: 4.2em 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.sum-t { font-size: 1.25em; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--sea-deep); }
.sum-n { font-size: 1.15em; }
.sum-b, .sum-s { margin: 2px 0 0; font-size: .85em; }
.sum-s { color: var(--muted); }
.sum-back { font-weight: 700; margin: 14px 0; }
.sum-emer { border: 2px solid var(--stop); border-radius: var(--r-m); padding: 10px 14px; margin: 14px 0; }
.sum-emer p { margin: 2px 0; }
.sum-act { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.sum-act .chip { min-height: 56px; font-size: .85em; padding: 0 22px; }
@media print {
  /* 일정표는 main 안에 있어서 main을 숨기면 백지가 됨 → 나머지는 보이지만 않게 하고 일정표만 맨 위에 */
  body:has(.sum) *:not(:has(.sum)):not(.sum):not(.sum *) { display: none !important; }   /* 일정표가 아닌 것은 자리도 차지하지 않게 (빈 쪽 방지) */
  body:has(.sum) * { visibility: hidden !important; }
  body:has(.sum) .sum, body:has(.sum) .sum * { visibility: visible !important; }
  body:has(.sum) { background: #fff !important; }
  .sum { position: static !important; width: 100% !important; height: auto !important; overflow: visible !important; background: #fff !important; color: #000 !important; box-shadow: none !important; }
  .sum * { color: #000 !important; }
  .sum-act, .toast { display: none !important; }
  .sum-in { font-size: 18pt; }
}

/* ---------- 달력 ---------- */
.cal { border: 1.5px solid var(--line); border-radius: var(--r-m); background: var(--surface); padding: 12px; max-width: 420px; width: 100%; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.cal-head b { font-family: var(--f-display); font-weight: 400; font-size: 1.3em; color: var(--sea-deep); }
.cal-nav { width: 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 1.6em; line-height: 1; cursor: pointer; }
.cal-nav:disabled { opacity: .35; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-wd { text-align: center; font-size: .85em; font-weight: 700; color: var(--muted); padding: 4px 0; }
.cal-day { aspect-ratio: 1; min-height: 44px; min-width: 0; padding: 0; border: 0; border-radius: var(--r-s); background: var(--mist); font-size: 1.1em; font-weight: 600; cursor: pointer; font-variant-numeric: tabular-nums; }
.cal-day:hover:not(:disabled) { outline: 2px solid var(--sea); }
.cal-sun { color: var(--stop); } .cal-sat { color: var(--sea); }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--sun); }
.cal-day[aria-pressed="true"] { background: var(--sea); color: var(--sea-ink); }
.cal-day:disabled { background: transparent; color: var(--line); cursor: default; }
.cal-sel { margin: 10px 2px 0; }
.when-h { margin: 4px 0 0; font-weight: 700; }

/* ---------- v4 페이지 공통 ---------- */
.nav a[aria-current="page"] { color: var(--sea-deep); box-shadow: inset 0 -3px 0 var(--sun); }
.page-head { margin-bottom: 18px; }
.page-head h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(1.8em, 4vw, 2.4em); color: var(--sea-deep); margin: 6px 0 4px; }
.crumb { font-size: .9em; color: var(--muted); }
.crumb a { color: var(--sea-deep); }
.h3 { font-size: 1.15em; margin: 0 0 10px; }
.small { font-size: .85em; }
.cards2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); gap: 14px; margin-bottom: 14px; }
.sec .panel + .panel, .sec .cards2 + .panel, .sec .panel + .cards2 { margin-top: 14px; }
.cards2 > .panel + .panel { margin-top: 0; }
.plain { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.stops { columns: 2 220px; margin: 8px 0; padding-left: 1.4em; }
.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl { width: 100%; border-collapse: collapse; font-size: .92em; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: .85em; color: var(--muted); font-weight: 700; white-space: nowrap; }
.dot { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; color: #fff; font-size: 11px; font-weight: 700; flex: none; margin-right: 6px; vertical-align: middle; }
.plink { color: inherit; text-decoration: none; }
.plink:hover { text-decoration: underline; }
.pcard .more { display: inline-flex; align-items: center; min-height: 44px; margin: -6px 0 2px; color: var(--sea-deep); font-weight: 600; font-size: .92em; }

/* 장소 상세 */
.pp-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 16px; align-items: start; }
.pp-grid > div { display: grid; gap: 14px; }
.pp-grid .panel + .panel { margin-top: 0; }
.pp-photo .ph { margin: 0; border-radius: var(--r-m); overflow: hidden; aspect-ratio: 4/3; }
.pp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pp-today { font-weight: 600; }
.seglist { margin: 12px 0; padding-left: 1.4em; display: grid; gap: 10px; }
.seglist li { padding-left: 4px; }
.seg-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.seglist p { margin: 2px 0; }
.seg-src { font-size: .82em; }
.near-list { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 8px; }
@media (max-width: 860px) { .pp-grid { grid-template-columns: 1fr; } }

/* 편의시설 지도 */
.layers .chip { display: inline-flex; align-items: center; }
.layers .chip[aria-pressed="false"] .dot { filter: grayscale(1); opacity: .5; }
.fac-list { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 6px; max-height: 520px; overflow: auto; }
.fac-list li { display: flex; gap: 6px; align-items: flex-start; padding: 8px 10px; border-radius: var(--r-s); background: var(--surface); border: 1px solid var(--line); }
.fac-list li.sel { border-color: var(--sea); box-shadow: 0 0 0 3px var(--sea-soft); }

/* 내 일정 */
.my-list { list-style: none; padding: 0; display: grid; gap: 12px; }
.my-list li { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.my-list li p { margin: 4px 0; }
.my-date { font-size: 1.1em; color: var(--sea-deep); }

/* 행사 달력 */
.ev-grid { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 18px; align-items: start; }
.ev-list { list-style: none; padding: 0; display: grid; gap: 10px; }
.ev-list p { margin: 4px 0; }
.cal-day.has-ev { position: relative; background: var(--glow); }
.cal-day.has-ev i { position: absolute; left: 50%; bottom: 5px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--sun-deep); }
@media (max-width: 760px) { .ev-grid { grid-template-columns: 1fr; } }

/* 여행 준비 */
.emer { border: 2px solid var(--stop); }
.faq { display: grid; gap: 10px; margin-top: 14px; }
.faq summary { cursor: pointer; font-weight: 700; min-height: 44px; display: flex; align-items: center; }

/* 관리자 */
.admin-key { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.admin-key input { min-height: 44px; }
.visit-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 10px 14px; margin: 14px 0; }
.visit-form h2, .visit-form .wide { grid-column: 1 / -1; }
.visit-form label { display: grid; gap: 4px; min-width: 0; font-size: .9em; font-weight: 600; }
.visit-form input, .visit-form select, .visit-form textarea { width: 100%; min-width: 0; box-sizing: border-box; min-height: 42px; font: inherit; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: var(--r-s); background: var(--surface); color: inherit; }
.visit-form .chip.go { justify-self: start; }
.rv-list { list-style: none; padding: 0; display: grid; gap: 10px; }
.rv-list select, .rv-list input { min-height: 42px; font: inherit; padding: 4px 10px; border: 1.5px solid var(--line); border-radius: var(--r-s); background: var(--surface); color: inherit; }

/* 아래 메뉴 */
.foot-nav { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 12px; }
.foot-nav a { color: inherit; font-weight: 600; display: inline-flex; align-items: center; min-height: 44px; }
.tabbar { display: none; }
@media (max-width: 760px) {
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar a { display: grid; justify-items: center; gap: 2px; padding: 8px 2px; min-height: 58px; text-decoration: none; color: var(--muted); font-size: 11.5px; font-weight: 700; text-align: center; line-height: 1.15; }
  .tabbar a span { font-size: 20px; }
  .tabbar a[aria-current="page"] { color: var(--sea-deep); box-shadow: inset 0 3px 0 var(--sun); }
  body { padding-bottom: 66px; }
}
@media print { .tabbar { display: none !important; } }

/* ---------- 관리자 공지 (사이트 전체) ---------- */
.site-notes { display: grid; }
.site-note { margin: 0; padding: 10px 16px; text-align: center; background: var(--sea-soft); color: var(--sea-deep); font-size: .95em; }
.site-note.warn, .site-note.closed { background: var(--warn-bg); color: var(--warn); }
.site-note b { margin-right: 6px; }
.pp-notice { border-radius: var(--r-m); padding: 12px 14px; background: var(--sea-soft); color: var(--sea-deep); }
.pp-notice.warn { background: var(--warn-bg); color: var(--warn); }
.pp-notice.closed { background: var(--stop-bg); color: var(--stop); }
.pp-notice small { margin-left: 8px; opacity: .8; }
.pp-notice p { margin: 4px 0 0; color: var(--ink); }
.tl-notice { margin: 6px 0; padding: 6px 10px; border-radius: var(--r-s); background: var(--warn-bg); color: var(--warn); font-weight: 600; }

/* ---------- 관리자 화면 ---------- */
.admin .login { display: grid; gap: 12px; max-width: 420px; }
.admin .login label { display: grid; gap: 4px; font-weight: 600; }
.admin .login input, .pick-place select { min-height: 48px; font: inherit; padding: 6px 12px; border: 1.5px solid var(--line); border-radius: var(--r-s); background: var(--surface); color: inherit; }
.chip.demo { border: 2px dashed var(--sun); }
.chip.danger { background: var(--stop); color: var(--on-signal); border-color: var(--stop); }
.err { color: var(--stop); font-weight: 600; }
.admin-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.admin-tabs { flex-wrap: wrap; }
.admin-msg { padding: 10px 14px; border-radius: var(--r-s); font-weight: 600; }
.admin-msg.ok { background: var(--go-bg); color: var(--go); }
.admin-msg.bad { background: var(--stop-bg); color: var(--stop); }
.pick-place { display: grid; gap: 6px; font-weight: 700; max-width: 420px; }
.days { display: flex; flex-wrap: wrap; gap: 8px 14px; border: 1.5px solid var(--line); border-radius: var(--r-s); padding: 8px 12px; }
.days legend { font-weight: 600; font-size: .9em; padding: 0 4px; }
label.day { display: inline-flex !important; align-items: center; gap: 6px; font-weight: 600; }
label.day input { width: 20px !important; height: 20px; min-height: 0 !important; }
.seg-edit input { width: 100%; min-width: 64px; min-height: 38px; font: inherit; padding: 4px 6px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: inherit; box-sizing: border-box; }
.seg-edit td:first-child input { min-width: 150px; }
.save-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.post-notice { margin: 10px 0; padding: 10px; border-radius: var(--r-s); background: var(--mist); }
.tbl tr.reverted td { opacity: .5; }
.backup { margin-bottom: 14px; }

/* ---------- 사진 공통: 못 불러오면 그림·바탕색이 대신 보인다 ---------- */
.ph-bad { display: none; }
.ccard { overflow: hidden; }
.ccard-ph { position: relative; aspect-ratio: 16 / 8; margin: -20px -20px 6px; background: var(--sea-soft); }
.pcard .art { background: var(--mist); }
.pcard:hover { border-color: var(--sea); }
.ccard { border-top: 1px solid var(--line); }

/* ---------- 장소 사진 모음 ---------- */
.pp-gallery { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.pp-gallery li { display: grid; gap: 4px; font-size: .88em; color: var(--muted); }
.pp-gph, .ev-ph { position: relative; aspect-ratio: 4 / 3; border-radius: var(--r-s); overflow: hidden; background: var(--mist); }
.ev-ph { aspect-ratio: 16 / 7; margin-bottom: 10px; }

/* ---------- 관광지 검색 ---------- */
.psearch { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 16px; }
.psearch label { font-weight: 600; }

.jump { margin-bottom: 16px; }

/* ---------- 장소 소개 묶음 ---------- */

/* ---------- 지금의 동해 ---------- */

/* ---------- 빠른 메뉴 (넓은 화면에서만, 모바일은 아래 탭바) ---------- */

  background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 6px; box-shadow: 0 16px 36px -22px rgba(18, 53, 94, .6); }

  font: inherit; font-size: .74em; font-weight: 600; color: var(--sea-deep); text-decoration: none; cursor: pointer; text-align: center; line-height: 1.25; }

/* ---- 코스 짜기 대화 칸: 위 진행 단계 · 가운데 대화(여기만 스크롤) · 아래 답 버튼과 입력칸(늘 보임) ---- */
.grid > .panel.chat { position: sticky; top: 76px; height: min(780px, calc(100vh - 92px)); max-height: none; overflow: hidden; display: flex; flex-direction: column; padding: 0; }
.steps { display: flex; gap: 4px; list-style: none; margin: 0; padding: 10px 14px 0; overflow-x: auto; font-size: .82em; font-weight: 700; color: var(--muted); flex: none; }
.steps li { flex: 1; text-align: center; padding: 6px 4px; border-bottom: 3px solid var(--line); white-space: nowrap; }
.steps li.done { color: var(--sea); border-color: var(--sea); }
.steps li.cur { color: var(--sea-deep); border-color: var(--sun-deep); }
.chat-log { flex: 1; overflow-y: auto; padding: 6px 16px 10px; overscroll-behavior: contain; min-height: 120px; }
.chat-dock { flex: none; border-top: 1px solid var(--line); padding: 12px 14px 14px; background: var(--surface); max-height: 64%; overflow-y: auto; display: grid; gap: 10px; }
.chat-dock .big-chips .chip { min-height: 48px; padding: 0 16px; font-size: 1em; }
.chat-dock .chips input { flex: 1 1 200px; }
.composer { display: flex; gap: 8px; }
.composer input { flex: 1; min-height: 48px; }
.typing { color: var(--muted); font-size: .9em; margin: 6px 0 0 4px; }
.qc { display: flex; gap: 8px; overflow-x: auto; flex-wrap: nowrap; padding-bottom: 4px; }
.qc .chip { flex: none; }
.when { gap: 10px; margin: 0; }
.when > .chip.go { justify-self: stretch; min-height: 50px; }
.dstrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
.dchip { flex: none; width: 54px; min-height: 66px; border: 1.5px solid var(--line); border-radius: var(--r-s); background: var(--mist); display: grid; place-items: center; padding: 4px 0; font: inherit; color: inherit; cursor: pointer; }
.dchip small { font-size: .75em; color: var(--muted); font-weight: 700; line-height: 1.2; }
.dchip b { font-size: 1.2em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.dchip.sun b { color: var(--stop); } .dchip.sat b { color: var(--sea); }
.dchip[aria-pressed="true"] { background: var(--sea); border-color: var(--sea); }
.dchip[aria-pressed="true"] small, .dchip[aria-pressed="true"] b { color: var(--sea-ink); }
.dchip.more { background: var(--surface); border-style: dashed; }
.dchip:focus-visible { outline: 3px solid var(--sun-deep); outline-offset: 2px; }
.trow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.trow > span { font-weight: 700; margin-right: 4px; }
.trow .chip { min-height: 44px; padding: 0 14px; }
.chat-dock .cal { max-width: 360px; padding: 8px; }
.chat-dock .cal-day { aspect-ratio: auto; height: 44px; min-height: 44px; font-size: 1em; }
.chat-dock .cal-nav { width: 44px; height: 44px; font-size: 1.3em; }
.chat-dock .cal-sel { display: none; }
/* 코스 만들기 전 오른쪽: 내 여행 조건 */
.trip h3 { margin: 0 0 6px; }
.trip dl { margin: 0 0 10px; }
.trip dl > div { display: grid; grid-template-columns: 84px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); align-items: start; }
.trip dt { color: var(--muted); font-weight: 700; font-size: .9em; }
.trip dd { margin: 0; font-weight: 600; }
.trip .todo dd { color: var(--muted); font-weight: 400; }
.chip.sm { min-height: 44px; padding: 0 12px; font-size: .88em; }
.ztag { display: inline-block; font-size: .78em; font-weight: 700; margin-bottom: 2px; }
/* 담기 알림과 '담은 곳' 버튼 (색은 밝은·어두운 화면 모두 같은 남색) */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; display: flex; align-items: center; gap: 10px; width: max-content; max-width: min(640px, calc(100vw - 32px)); background: #12355E; color: #fff; padding: 10px 8px 10px 18px; border-radius: 16px; box-shadow: 0 8px 28px rgba(18, 53, 94, .3); }
.toast .chip.go { flex: none; background: #fff; color: #12355E; border-color: #fff; }
.toast .x { flex: none; background: none; border: 0; color: #fff; font-size: 1.4em; width: 44px; height: 44px; cursor: pointer; }
.cart { position: fixed; left: 24px; bottom: 24px; z-index: 50; background: #12355E; color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 700; text-decoration: none; box-shadow: 0 6px 20px rgba(18, 53, 94, .3); }
@media (max-width: 900px) {
  .grid > .panel.chat { position: relative; top: 0; height: calc(100dvh - 150px); min-height: 480px; }
  .toast, .cart { bottom: calc(70px + env(safe-area-inset-bottom)); }
  .cart { left: 16px; }
}
@media (prefers-reduced-motion: reduce) { .chat-log { scroll-behavior: auto; } }
.qc .chip.go { background: var(--sea); color: var(--sea-ink); }
/* '코스 만들기'로 오면 대화 칸이 화면 위에 꼭 맞게 */
.howto h2 { margin-bottom: 14px; }
.howto ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.howto li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 18px; display: grid; gap: 6px; align-content: start; }
.howto .n { width: 32px; height: 32px; border-radius: 50%; background: var(--sea); color: var(--sea-ink); display: grid; place-items: center; font-weight: 700; }
.howto b { font-size: 1.08em; color: var(--sea-deep); }
.howto p { margin: 0; color: var(--muted); }
.howto-go { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin: 16px 0 0; }

@media (max-width: 700px) { .howto ol { grid-template-columns: 1fr; } }
/* 대화 칸 크기: 화면 높이 − 머리말 − 아래 탭. 답 버튼 칸만 스크롤되고 입력칸은 늘 맨 아래에 보인다 */

.chat-dock { display: flex; flex-direction: column; gap: 10px; overflow: hidden; max-height: 66%; }
.dock-opts { overflow-y: auto; display: grid; gap: 10px; min-height: 0; }
.composer { flex: none; }
@media (max-width: 900px) {
  .grid > .panel.chat { position: relative; top: 0; height: calc(100dvh - var(--hdr, 64px) - var(--tab, 58px) - 16px); min-height: 360px; }
}
@media (max-width: 600px) {
  .bar { gap: 8px; padding-block: 6px; flex-wrap: nowrap; }
  .brand { font-size: 20px; } .brand img { height: 32px; }
  .tools { gap: 6px; }

}
@media (max-width: 400px) { .brand { font-size: 0; gap: 0; } .tools .bigt { padding: 0 8px; } }
html { scroll-padding-top: calc(var(--hdr, 76px) + 8px); }
@media (max-width: 600px) {
  .trow { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  .trow > *, .trow .chip { flex: none; }
  .dchip { width: 50px; min-height: 54px; }
}
/* 날씨: 날짜 칸의 작은 아이콘, 고른 날 예보 한 줄, 시간표 머리의 예보 */
.dchip .wx { font-style: normal; font-size: .85em; line-height: 1; }
.wrow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.wline { font-weight: 700; margin-right: 4px; }
.wline.wet, .tl-wx.wet { color: var(--sea-deep); }
.tl-wx { margin: 4px 0 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 600; }
@media (max-width: 600px) { .wrow { flex-wrap: nowrap; overflow-x: auto; } .wrow > * { flex: none; } .dchip { min-height: 62px; } }

/* ---- 동이 브리핑: 한 줄 요약 · 이렇게 맞췄어요 · 챙기세요 ---- */
.brief { border: 1.5px solid var(--sea); border-radius: var(--r-m); background: var(--sea-soft); padding: 14px 16px; margin: 0 0 14px; }
.brief.pending { border-style: dashed; }
.brief-k { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; margin: 0; font-weight: 700; color: var(--sea-deep); font-size: .9em; }
.brief-k img { width: 30px; height: 30px; }
.brief-k .via { margin: 0; }
.brief h3 { margin: 6px 0 8px; font-size: 1.2em; line-height: 1.35; }
.fits { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.fits li { display: flex; gap: 10px; align-items: baseline; background: var(--surface); border-radius: var(--r-s); padding: 8px 12px; font-weight: 600; }
.fits li span { flex: none; width: 1.4em; text-align: center; }
.bring { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0 0; }
.bring b { margin-right: 4px; }
.brief-act { margin: 10px 0 0; display: flex; gap: 6px; flex-wrap: wrap; }
.brief-act:empty { display: none; }
/* 대화: 알아들은 조건 칩, 보낸 사진, 사진 판독 카드 */
.got { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 8px; }
.got small, .pc-row small { color: var(--muted); font-weight: 700; margin-right: 2px; width: 100%; }
.me-img { display: block; max-width: 180px; max-height: 180px; border-radius: 10px; margin-bottom: 6px; object-fit: cover; }
.pcheck { display: grid; gap: 8px; margin-top: 8px; }
.pcheck > .badge { justify-self: start; }
.pc-row { display: flex; flex-wrap: wrap; gap: 6px; }
.pc-tips { display: grid; gap: 4px; font-weight: 600; }
.chip.cam { flex: none; min-width: 48px; justify-content: center; cursor: pointer; font-size: 1.2em; padding: 0 12px; display: inline-flex; align-items: center; }
.chip.cam:focus-within { outline: 3px solid var(--sun-deep); outline-offset: 2px; }

/* 근처 식당 (일반음식점 인허가 현황) */
.eats .eat-g { margin: 6px 0 8px; flex-wrap: wrap; }
.eats .eat-g small { opacity: .6; margin-left: 2px; }
.eat-list { list-style: none; margin: 0; padding: 0; }
.eat-list li { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.eat-n { min-width: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.eat-n small { width: 100%; }
.eat-a { display: flex; gap: 6px; flex-shrink: 0; }
.eat-a .chip { padding: 4px 10px; font-size: .85em; }
.eat-sort { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
.eat-why { margin: 0 0 4px; }

/* 여행 기간 콤보 상자 */
.sel-days { display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px 6px 16px; border: 1.5px solid var(--line-strong); border-radius: 999px; background: var(--surface); font-weight: 600; min-height: 44px; }
.sel-days span { font-size: .9em; color: var(--muted); }
.sel-days select { border: 0; background: transparent; font: inherit; font-weight: 700; color: var(--ink); padding: 6px 4px; cursor: pointer; min-height: 40px; }
.sel-days:focus-within { outline: 3px solid var(--sun); outline-offset: 2px; }
/* 여러 날 여행: 날짜 탭 */
.day-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; margin-bottom: 4px; scrollbar-width: thin; }
.day-tabs button { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 14px; border-radius: 14px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.day-tabs button small { font-size: max(14px, .8em); color: var(--muted); }
.day-tabs button.on { background: var(--sea); border-color: var(--sea); color: var(--sea-ink); }
.day-tabs button.on small { color: var(--sea-ink); }
.day-free { background: var(--go-bg); border-radius: var(--r-s); padding: 12px 14px; }

/* 칩: 글자가 위로 붙거나 줄바꿈되지 않게 (span·a·button 모두 같은 모양) */
.chip { display: inline-flex; align-items: center; justify-content: center; text-align: center; line-height: 1.25; }
span.chip, .chip.plain { cursor: default; white-space: nowrap; }
.chip.plain { display: inline-flex; padding: 0 15px; gap: 0; color: var(--muted); }
.chip.plain:hover { border-color: var(--line); }
/* 숙소 예약 링크 */
.book { display: inline-flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.book .chip { min-height: 44px; padding: 0 14px; font-size: .88em; text-decoration: none; }
/* 예시(현장 실측 전) 판정 표시: 판정 배지 안의 작은 꼬리표와 장소 상세 안내 */
.badge .ex-in { font-size: 1em; font-weight: 600; }
.seg-ex { background: var(--warn-bg, #FFF2CC); color: var(--ink); border-radius: 12px; padding: 8px 12px; margin: 8px 0 4px; font-size: .92em; }
/* 동이 말풍선 안의 'AI 답변' 꼬리표 */
.via.via-msg { display: table; margin: 6px 0 0; }
/* 첫 화면: 예시 코스로 바로 가기 */
.hero-jump { display: inline-flex; align-items: center; min-height: 44px; margin-top: 14px; padding: 0 16px; border-radius: 999px; font-weight: 700; font-size: .92em;
  color: #fff; background: rgba(4, 14, 28, .55); border: 1.5px solid rgba(255, 255, 255, .7); text-decoration: none; backdrop-filter: blur(4px); }
.hero-jump:hover { background: rgba(4, 14, 28, .75); }
.hero-plain .hero-jump { color: var(--sea-deep); background: var(--surface); border-color: var(--sea); }

/* ==========================================================================
   2026-11-18 디자인 정리 (DESIGN.md 기준)
   ========================================================================== */
/* 가장 작은 글자 14px — 어르신이 함께 보는 화면. em 단위라 '글자 크게 보기'를 따라 커진다 */
.steps, .tl-drive, .tl-hours, .tl-time span, .small, .bigdata .small, .seg-src, .credit, .fac li, .tags li, .via, .ex,
.now-k, .ztile-t em, .rv-top span:not(.ex), .chip small, .dchip small, .cal-wd, .got small, .pc-row small, .tl-kind,
.eats .eat-g small, .eat-n small, .by, .crumb { font-size: max(14px, .875em); }
.ex { font-size: max(14px, .8em); padding: 1px 8px; }
.via { padding: 2px 10px; }

/* 대화 칸: 진행 단계는 글자만 조금 크게, 현재 단계는 굵게 */

/* 긴급·도움 창: 제목과 닫기(×)는 위에 붙어 있고 안쪽만 스크롤 */

.tr-call { display: flex; align-items: center; gap: 12px; padding: 12px 18px; margin: 4px 0 14px; border-radius: var(--r-m); background: var(--sea); color: var(--sea-ink); text-decoration: none; max-width: 420px; min-height: 64px; }
.tr-call .ic { width: 28px; height: 28px; }
.tr-call b { display: block; font-size: 1.5em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tr-call small { font-size: 14px; opacity: .95; }
.tr-call:hover { filter: brightness(.95); }
.tr-facts { margin: 0 0 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.tr-facts.one { grid-template-columns: 1fr; }
.tr-facts > div { background: var(--mist); border-radius: var(--r-s); padding: 10px 12px; }
.tr-facts dt { font-size: 14px; font-weight: 700; color: var(--muted); }
.tr-facts dd { margin: 2px 0 0; font-weight: 600; }
.tr-facts dd small { font-weight: 400; }
.tr-phones { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.tr-phones a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; }
.tr-checks { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.tr-checks li { padding-left: 14px; border-left: 3px solid var(--sun); }
.tr-checks b { color: var(--sea-deep); margin-right: 6px; }
.tr-note { margin: 10px 0 0; padding: 8px 12px; border-radius: var(--r-s); background: var(--warn-bg); color: var(--ink); }
.tr-more { margin: 6px 0; }
.tr-more summary { cursor: pointer; font-weight: 600; color: var(--sea-deep); min-height: 44px; display: flex; align-items: center; list-style: none; }
.tr-more summary::-webkit-details-marker { display: none; }
.tr-more summary::before { content: "▸"; margin-right: 8px; color: var(--sea); }
.tr-more[open] > summary::before { content: "▾"; }
.tr-who { margin: 4px 0 8px; padding-left: 1.3em; display: grid; gap: 4px; }
.tr-route { list-style: none; counter-reset: st; margin: 6px 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 4px; }
.tr-route li { counter-increment: st; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: var(--mist); font-size: .95em; }
.tr-route li::before { content: counter(st); width: 22px; height: 22px; border-radius: 50%; background: var(--sea); color: var(--sea-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.tr-filter { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
.tr-filter input { min-height: 44px; width: min(320px, 100%); border: 1.5px solid var(--line-strong); border-radius: 999px; padding: 0 16px; background: var(--surface); }
.tr-list { list-style: none; margin: 0; padding: 0; }
.tr-list > li { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tr-list > li > div:first-child { display: grid; min-width: 0; }
.tr-list small { font-size: 14px; }
.tr-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tr-list.compact > li { flex-wrap: nowrap; }
@media (max-width: 600px) {
  .tr-jump { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tr-jump button { min-height: 64px; font-size: .92em; }
  .tr-facts { grid-template-columns: 1fr 1fr; }
}

/* ---------- 관리자: 누가 로그인했는지 · 한눈에 · 계정 ---------- */
.admin-who { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: flex-end; }
.who-badge { display: inline-flex; gap: 6px; align-items: center; }
[class^="role-"] { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.role-owner { background: var(--sea); color: var(--sea-ink); }
.role-editor { background: var(--sea-soft); color: var(--sea-deep); }
.role-surveyor { background: var(--go-bg); color: var(--go); }
.dash-hello { margin: 0 0 12px; }
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
.dash-card { display: grid; gap: 2px; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; min-height: 44px; }
.dash-card:hover:not(:disabled) { border-color: var(--sea); }
.dash-card:disabled { cursor: default; opacity: 1; }
.dash-card.warn { border-left: 5px solid var(--sun); }
.dash-k { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--muted); }
.dash-k .ic { color: var(--sea); }
.dash-card > b { font-family: var(--f-display); font-weight: 400; font-size: 2em; color: var(--sea-deep); line-height: 1.1; }
.dash-recent li { padding: 4px 0; border-bottom: 1px solid var(--line); }
.role-list li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pw-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pw-row input { flex: 1 1 140px; }
.acc-tbl select { min-height: 44px; }
.acc-tbl .chips { gap: 6px; }
.who-filter { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; margin: 4px 0 10px; }
.who-filter select { min-height: 44px; border: 1.5px solid var(--line-strong); border-radius: var(--r-s); padding: 0 10px; background: var(--surface); }

/* ==========================================================================
   동해시 마스코트 (CIP 디자인표준편람 BS-19~32) — 얼굴은 대화 칸, 전신·응용형은 페이지 곳곳
   ========================================================================== */
.says img, .reply img { object-fit: contain; }
.says img { height: 60px; width: 60px; }
.brand img { width: 44px; object-fit: contain; }
.ask-dongi { object-fit: contain; }
.page-head.has-photo { padding-right: 150px; }
.page-head-mascot { position: absolute; right: 18px; bottom: -6px; height: 150px; width: auto; z-index: 0; filter: drop-shadow(0 6px 10px rgba(4, 14, 28, .35)); pointer-events: none; }
.page-head:not(.has-photo) { position: relative; }
@media (max-width: 700px) { .page-head.has-photo { padding-right: 104px; } .page-head-mascot { height: 104px; right: 6px; } }
.pp-scene { margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); display: grid; justify-items: center; gap: 4px; }
.pp-scene img { max-height: 220px; width: auto; max-width: 100%; }
.pp-scene figcaption { font-family: var(--f-display); color: var(--sea-deep); }
.pp-notice { position: relative; }
.pp-notice-mascot { float: right; height: 72px; width: auto; margin: -4px 0 4px 10px; }
.sheet-hello { display: flex; gap: 10px; align-items: flex-end; margin: 6px 0 10px; }
.sheet-hello img { height: 110px; width: auto; flex: none; }
.sheet-hello .bubble { margin: 0; }
.typing { display: flex; align-items: center; gap: 8px; }
.typing img { width: 40px; height: 40px; object-fit: contain; }
@media (prefers-reduced-motion: no-preference) { .typing img { animation: dongi-think 1.6s ease-in-out infinite; } @keyframes dongi-think { 50% { transform: rotate(-6deg); } } }
/* 사용법 상자: 캐릭터 없이 글만 (사용자 의견 — 캐릭터가 있으면 어지러움) */
.howto-strip { grid-template-columns: 1fr auto; }
.howto-strip h3 { grid-column: 1 / -1; }
.howto-strip ol { grid-column: 1; }
.howto-more { grid-column: 2; }
@media (max-width: 900px) { .howto-strip { grid-template-columns: 1fr; } .howto-strip ol, .howto-more { grid-column: 1; } }
/* 대화: 얼굴은 최근 말풍선에만 */
.says.quiet img { visibility: hidden; }
.says.quiet { margin-top: 4px; }
/* 빠른 수정 버튼: 옆으로 밀지 않고 여러 줄로 (가로 스크롤 막대가 입력칸 위에서 깨져 보이던 문제) */
.qc { flex-wrap: wrap; overflow-x: visible; padding-bottom: 0; }
.qc .chip { flex: 0 1 auto; }
.chat-dock .qc .chip { min-height: 44px; padding: 0 14px; font-size: .95em; }
.panel.empty img { width: 140px; height: auto; }

/* ---------- 코스가 나온 뒤: 대화는 오른쪽 아래 위젯, 코스(왼쪽)·지도(오른쪽) ---------- */
.grid.has-course { grid-template-columns: minmax(0, 1fr); }
.grid.has-course > .panel.chat.widget { display: none; }
.grid.has-course > .panel.chat.widget.open { display: flex; position: fixed; z-index: 65; right: 20px; bottom: 20px; top: auto; width: min(420px, calc(100vw - 40px));
  height: min(680px, calc(100dvh - var(--hdr, 64px) - 40px)); box-shadow: 0 24px 60px -20px rgba(12, 35, 64, .5); border-color: var(--sea); }
.widget-bar { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px 8px 16px; border-bottom: 1px solid var(--line); background: var(--sea-soft); border-radius: var(--r-l) var(--r-l) 0 0; }
.widget-bar b { font-family: var(--f-display); font-weight: 400; color: var(--sea-deep); font-size: 1.1em; }
.chat-fab { position: fixed; z-index: 65; right: 20px; bottom: 20px; display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 8px; min-height: 64px; border: 2px solid var(--sea); border-radius: 999px;
  background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; box-shadow: 0 16px 36px -16px rgba(12, 35, 64, .55); }
.chat-fab img { width: 52px; height: 52px; object-fit: contain; border-radius: 50%; background: var(--sea-soft); }
.chat-fab b { display: block; color: var(--sea-deep); line-height: 1.25; }
.chat-fab small { display: block; color: var(--muted); font-size: 14px; }
.chat-fab:hover { background: var(--mist); }
#timeline.res { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .85fr); gap: 0 22px; align-items: start; }
#timeline.res > * { grid-column: 1; }
#timeline.res > .res-map { grid-column: 2; grid-row: 1 / span 30; position: sticky; top: calc(var(--hdr, 64px) + 12px); display: grid; gap: 10px; }
#timeline.res > .res-map .map { height: min(560px, calc(100dvh - var(--hdr, 64px) - 120px)); }
#timeline.res > .res-map .chip { justify-self: start; text-decoration: none; }
@media (max-width: 900px) {
  #timeline.res { grid-template-columns: minmax(0, 1fr); }
  #timeline.res > .res-map { grid-column: 1; grid-row: auto; position: static; }
  #timeline.res > .res-map .map { height: 280px; }
  .chat-fab { right: 12px; bottom: calc(74px + env(safe-area-inset-bottom)); padding-right: 14px; }
  .grid.has-course > .panel.chat.widget.open { left: 0; right: 0; bottom: 0; width: 100%; height: min(78dvh, 640px); border-radius: var(--r-l) var(--r-l) 0 0; z-index: 70; }
}
@media print { .chat-fab { display: none !important; } }
/* 더 묻기 몇 번째인지, 다르게 짜 보기 버튼 */
.xq-step { width: 100%; font-size: 14px; font-weight: 700; color: var(--muted); }
.chip.alt { border-color: var(--sun-deep); color: var(--sea-deep); font-weight: 600; }
.typo-fix { color: var(--sun-deep); }
/* 공영주차장: 가까운 곳 추천·지도 */
.tr-near { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
.tr-near-sel { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; }
.tr-near-sel select { min-height: 44px; border: 1.5px solid var(--line-strong); border-radius: var(--r-s); padding: 0 10px; background: var(--surface); max-width: 220px; }
.tr-rec { margin: 0 0 10px; padding: 8px 12px; border-radius: var(--r-s); background: var(--glow); }
#tr-parking .map { height: 300px; margin-bottom: 12px; }
.tr-list > li.rec { background: color-mix(in srgb, var(--glow) 60%, transparent); border-radius: var(--r-s); padding-inline: 8px; }
.badge.rec-b { background: var(--sun-deep); color: #fff; }
.badge.b-dist { background: var(--sea-soft); color: var(--sea-deep); }
.tr-go { display: flex; gap: 6px; }
.tr-go .chip { text-decoration: none; }
/* 행사: 곧 열리는 것 · 해마다 열리는 축제 */
.ev-next { margin-bottom: 12px; border-left: 5px solid var(--go); }
.ev-next ul { margin-top: 6px; }
.ev-yearly { margin-top: 18px; }
.ev-y-list { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 6px; }
.ev-y-list li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ev-y-list li > div { display: grid; flex: 1; min-width: 0; }
.ev-m { flex: none; width: 52px; height: 52px; border-radius: 14px; background: var(--sea-soft); color: var(--sea-deep); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.15em; }
.stay-kinds { margin: 0 0 12px; }

/* ---------- 2026-11-19 사용자 의견 ---------- */
/* 상단 메뉴 바를 페이지 배경과 구분: 흰 바탕 + 아래 그림자 */
.top { background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: 0 2px 10px rgba(18, 53, 94, .08); }
/* 편의시설 지도: 켜고 끄는 버튼 줄과 지도 사이 띄우기 */
.layers.chips { margin: 0 0 18px; }
.sec .layers + .map { margin-top: 0; }
/* 코스 짜기: 코스가 나오기 전에는 대화 한 칸만 (오른쪽 조건 칸·지도 없앰) */
.grid:not(.has-course) { grid-template-columns: minmax(0, 1fr); max-width: 820px; margin-inline: auto; }
.grid:not(.has-course) > #timeline { display: none; }
.trip-line { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--mist); }
.tl-chip { display: inline-flex; align-items: center; min-height: 32px; padding: 2px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .9em; font-weight: 600; color: var(--sea-deep); }
/* 입구 두 갈래: 고르기 전엔 카드만, 고르면 대화창. 무장애 카드를 더 크게(주 기능) */
.fork-stage { padding: 28px 28px 32px; display: grid; gap: 18px; }
.fork-hi { display: flex; gap: 12px; align-items: center; margin: 0; }
.fork-hi img { width: 64px; height: 64px; object-fit: contain; flex: none; }
.fork-hi span { background: var(--mist); border: 1px solid var(--line); border-radius: 20px 20px 20px 6px; padding: 10px 14px; }
.fork-hi b { display: block; font-family: var(--f-display); font-weight: 400; color: var(--sea-deep); font-size: .9em; }
.fork-q { margin: 4px 0 0; font-size: 1.35em; }
.fork { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; align-items: stretch; }
.fork-btn { display: flex; align-items: center; gap: 16px; text-align: left; padding: 20px 22px; border: 2px solid var(--line-strong); border-radius: var(--r-l); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; min-height: 120px; }
.fork-btn:hover, .fork-btn:focus-visible { border-color: var(--sea); background: var(--sea-soft); }
.fork-btn .ic { flex: none; color: var(--sea); width: 32px; height: 32px; }
.fork-btn b { display: block; color: var(--sea-deep); font-size: 1.2em; font-family: var(--f-display); font-weight: 400; }
.fork-btn small { display: block; color: var(--muted); font-size: max(14px, .92em); line-height: 1.45; margin-top: 2px; }
.fork-btn em { display: block; font-style: normal; font-size: max(14px, .88em); color: var(--sea-deep); margin-top: 8px; font-weight: 600; }
.fork-btn.main { border-color: var(--sea); background: color-mix(in srgb, var(--sea-soft) 60%, var(--surface)); min-height: 160px; padding: 26px 26px; }
.fork-btn.main .ic { width: 44px; height: 44px; }
.fork-btn.main b { font-size: 1.5em; }
@media (max-width: 640px) { .fork { grid-template-columns: 1fr; } .fork-btn.main { min-height: 130px; } .fork-btn { min-height: 92px; } .fork-stage { padding: 20px 16px 22px; } }
.grid:not(.has-course) > .panel.chat:has(.fork-stage) { height: auto; }

/* 지도 점 정보 카드 (누르거나 마우스를 올리면) */
.map-pop { position: relative; min-width: 220px; max-width: 300px; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-m); box-shadow: 0 6px 20px rgba(18, 53, 94, .22); padding: 14px 40px 12px 16px; display: grid; gap: 4px; font-family: var(--f-body); font-size: 15px; line-height: 1.45; text-align: left; white-space: normal; word-break: keep-all; }
.map-pop b { font-size: 1.12em; color: var(--sea-deep); }
.map-pop span { color: var(--muted); }
.map-pop-x { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; border-radius: 50%; }
.map-pop-x:hover { background: var(--mist); }
.map-pop-go { display: flex; gap: 10px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
.map-pop-go a { color: var(--sea-deep); font-weight: 600; min-height: 36px; display: inline-flex; align-items: center; }
.map-pop-go a.go { background: var(--sea); color: var(--sea-ink); padding: 0 14px; border-radius: 999px; text-decoration: none; }
.map-pop.sketch { position: absolute; left: 12px; bottom: 12px; z-index: 2; }

/* 코스 지도: 우리 지도 / 카카오 길찾기 */
.route-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.route-frame { width: 100%; border: 1px solid var(--line); display: block; background: var(--mist); }
#timeline.res > .res-map .route-frame { height: min(640px, calc(100dvh - var(--hdr, 64px) - 170px)); }
.route-note { margin: 0; }
@media (max-width: 900px) { #timeline.res > .res-map .route-frame { height: 520px; } }
/* 글자 크게 보기 + 넓은 화면: 머리말을 두 줄로 정리 (로고·버튼 한 줄, 메뉴 한 줄) — 영어에서 버튼이 엉뚱하게 내려가던 줄바꿈 */
@media (min-width: 761px) {
  body.big .bar { display: grid; grid-template-columns: auto 1fr; align-items: center; row-gap: 4px; }
  body.big .brand { grid-column: 1; grid-row: 1; }
  body.big .tools { grid-column: 2; grid-row: 1; justify-self: end; }
  body.big .nav { grid-column: 1 / -1; grid-row: 2; }
}
/* 글자 크게 보기 + 좁은 화면: 교통 정보 칸은 한 줄에 하나 (두 칸이면 단어마다 줄이 바뀜) */
@media (max-width: 600px) { body.big .tr-facts { grid-template-columns: 1fr; } }
@media (max-width: 900px) { body.big .tr-facts { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { body.big .tr-facts { grid-template-columns: 1fr; } }
.ko-name { font-family: var(--f-body); font-size: .7em; font-weight: 400; }
/* 입구 카드: 좁은 화면에서는 아이콘을 글 위로 */
@media (max-width: 640px) {
  .fork-btn { flex-direction: column; align-items: flex-start; gap: 8px; }
  .fork-btn .ic, .fork-btn.main .ic { width: 30px; height: 30px; }
  .fork-hi img { width: 44px; height: 44px; }
}

/* 입구 카드 v2 (사용자 의견): 사용법 상자와 같은 폭, 두 카드 반반, 작은 이름표 + 큰 제목 + 설명 */
.grid:not(.has-course) { max-width: none; }
.fork { grid-template-columns: 1fr 1fr; gap: 16px; }
.fork-btn, .fork-btn.main { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 8px; min-height: 170px; padding: 24px 26px; }
.fork-btn.main { background: color-mix(in srgb, var(--sea-soft) 60%, var(--surface)); }
.fork-k { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); font-size: 1.02em; }
.fork-btn .fork-k .ic, .fork-btn.main .fork-k .ic { width: 26px; height: 26px; color: var(--sea); }
.fork-btn b, .fork-btn.main b { font-size: 1.55em; line-height: 1.3; color: var(--sea-deep); }
.fork-btn small { font-size: max(15px, 1em); color: var(--muted); }
@media (max-width: 640px) { .fork { grid-template-columns: 1fr; } .fork-btn, .fork-btn.main { min-height: 0; padding: 18px; } .fork-btn b, .fork-btn.main b { font-size: 1.3em; } }

/* 지도 정보 카드: 점 아래로 뜰 때 */
.map-pop.below { margin-top: 18px; }
.map-pop:not(.sketch):not(.below) { margin-bottom: 18px; }
/* 교통: 누른 안내만 열림 */
.tr-jump button[aria-pressed="true"] { background: var(--sea); border-color: var(--sea); color: var(--sea-ink); }

.pp2-segs > li { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; padding: 14px 16px; border-radius: 16px; background: var(--mist); }

.pp2-seg-n { display: inline-flex; align-items: center; gap: 6px; font-size: 1.05rem; }
.pp2-seg-n .ic { color: var(--sea); }
.pp2-segs .seg-src { font-size: .85rem; }
.pp2-more { margin-top: 10px; }
.pp2-more > summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 700; color: var(--sea-deep); }

/* 관광지 목록 새 화면 (2026-11-20): 첫 띠 · 무장애 검색 · 맞춤 필터/정렬 · 카드 */
.pl2 { display: grid; gap: 16px; }

.bf2 { border-radius: 18px; overflow: hidden; border: 1.5px solid var(--sea); background: var(--surface); }
.bf2-bar { width: 100%; min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 0 20px; border: 0; background: var(--sea); color: var(--sea-ink); font: inherit; font-weight: 700; font-size: 1.12rem; cursor: pointer; }

.bf2-body { padding: 18px 20px 14px; background: var(--mist); display: grid; gap: 14px; }
.bf2-cats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
.bf2-cat { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; min-height: 112px; padding: 12px 6px;
  border: 2px solid transparent; border-radius: 16px; background: var(--surface); color: var(--muted); font: inherit; font-weight: 700; font-size: 1.02rem; cursor: pointer; box-shadow: 0 2px 8px rgba(18,53,94,.07); }

  .bf2-opts { grid-template-columns: 1fr 1fr; }
}

.pl2-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); box-shadow: 0 2px 10px rgba(18,53,94,.06); }
.pl2-pop { position: relative; }
.pl2-tool { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 18px; border: 1.5px solid var(--sea); border-radius: 999px; background: var(--surface); color: var(--sea-deep); font: inherit; font-weight: 700; cursor: pointer; }
.pl2-tool[aria-expanded="true"] { background: var(--sea); color: var(--sea-ink); }
.pl2-tool.plain { border-color: transparent; }
.pl2-tool.plain[aria-expanded="true"] { background: var(--sea-soft); color: var(--sea-deep); }
.pl2-n { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--sun); color: #fff; font-size: .82rem; }
.pl2-panel { position: absolute; top: calc(100% + 10px); left: 0; z-index: 30; width: min(560px, calc(100vw - 32px)); padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 14px 34px rgba(18,53,94,.18); display: grid; gap: 12px; }
.pl2-pop.right .pl2-panel { left: auto; right: 0; width: 220px; }
.pl2-grp p { margin: 0 0 6px; font-weight: 700; color: var(--muted); font-size: .92rem; }
.pl2-panel-foot { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.pl2-sort { list-style: none; margin: 0; padding: 6px; gap: 2px; }
.pl2-sort button { width: 100%; min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.pl2-sort button[aria-selected="true"] { background: var(--sea-soft); color: var(--sea-deep); font-weight: 700; }
.pl2-on { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pl2-onchip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--sea-soft); color: var(--sea-deep); font: inherit; font-weight: 600; cursor: pointer; }
.pl2-onchip span { font-size: 1.15rem; line-height: 1; }

.pl2-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.pl2-card { border-radius: 20px; box-shadow: 0 2px 10px rgba(18,53,94,.06); }
.pl2-card .art { position: relative; }
.pl2-tag { position: absolute; left: 12px; bottom: 12px; z-index: 1; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.95); color: var(--sea-deep); font-weight: 700; font-size: .88rem; }

.pl2-card .pb { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pl2-card h3 { margin: 0; }

.pl2-ic { list-style: none; margin: 2px 0 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; }
.pl2-ic li { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--sea-soft); color: var(--sea-deep); }
.pl2-ic .ic { width: 18px; height: 18px; }
.pl2-P { font-family: Arial, sans-serif; font-size: .8rem; border: 2px solid currentColor; border-radius: 4px; width: 18px; height: 18px; display: grid; place-items: center; line-height: 1; }
.pl2-foot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }

.pl2-empty { grid-column: 1 / -1; display: grid; gap: 8px; justify-items: start; }
@media (max-width: 620px) {
  .pl2-hero { min-height: 0; background: linear-gradient(180deg, rgba(255,255,255,.2) 0%, var(--surface) 55%), var(--pl2-img) center top / cover no-repeat; }
  .pl2-hero-txt { padding: 110px 18px 18px; }
  .pl2-tools { border-radius: 18px; }

}
.pl2-tool { white-space: nowrap; }
@media (max-width: 620px) { .pl2-tool { padding: 0 12px; font-size: .95rem; gap: 6px; } .pl2-tools { padding: 6px; } }

/* 무장애 픽토그램 (열린관광 아이콘을 모양 틀로, 색은 글자색) */
.acc-ic { display: inline-block; flex: none; background: currentColor; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; }

/* 카드 이름 오른쪽 끝의 '오늘 여유/보통/붐빔' 작은 알약 */
.pl2-name { display: flex; align-items: center; gap: 8px; }
.pl2-name .plink { min-width: 0; }
.pl2 .pl2-crowd { position: static; margin-left: auto; flex: none; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; line-height: 1.6; white-space: nowrap; border: 1px solid transparent; }
.pl2-crowd.crowd-low { background: #E3F4EA; color: #1E6B3E; border-color: #BFE3CD; }

/* 동이 브리핑: 실내/바깥 바꾸기를 오른쪽 위로 ('챙기세요' 칩과 헷갈리지 않게, BUG-004) */
.brief-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brief-top .brief-k { margin: 0; }
.brief .brief-act { margin: 0; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 1.5px solid var(--sea); border-radius: 999px; background: var(--surface); color: var(--sea-deep); font: inherit; font-weight: 700; cursor: pointer; }
