.my-list { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 14px; }
.panel.trip { display: grid; gap: 10px; align-content: start; }
.trip.is-fav { border-color: var(--sun); }
.trip.is-past { background: color-mix(in srgb, var(--surface) 70%, var(--mist)); }
.trip-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.trip-when { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.trip-when b { font-size: 1.1em; color: var(--sea-deep); font-variant-numeric: tabular-nums; }
.dday { font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--sea-soft); color: var(--sea-deep); }
.dday.now { background: var(--sun); color: #2B1700; }
.dday.past { background: var(--mist); color: var(--muted); }
.star-btn { width: 48px; padding: 0; flex: none; }
.star-btn[aria-pressed="true"]::before { content: none; }
.star-btn .ic { width: 24px; height: 24px; color: var(--muted); }
.ic.star-on { fill: var(--sun); color: var(--sun-deep); }
.my-gh .ic.star-on { width: 22px; height: 22px; }
.trip-title { margin: 0; font-size: 1.2em; }
.trip-stops { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; }
.trip-stops li { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.trip-stops li + li::before { content: "→"; color: var(--muted); margin-right: 2px; }
.trip-stops .n { width: 22px; height: 22px; border-radius: 50%; background: var(--sea); color: var(--sea-ink); display: inline-grid; place-items: center; font-size: 13px; }
.trip-act { gap: 6px; }
.trip-act .chip { min-height: 44px; font-size: .92em; }
.ic.flip { transform: rotate(180deg); }
.trip-sure { display: inline-flex; flex-wrap: wrap; gap: 6px; align-items: center; font-weight: 600; color: var(--stop); }
.trip-name { display: flex; flex-wrap: wrap; gap: 6px; }
.trip-name input { flex: 1 1 200px; min-height: 44px; border: 1.5px solid var(--line-strong); border-radius: var(--r-s); padding: 0 12px; background: var(--surface); }
.trip-saved { font-size: 14px; }
.trip-detail { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 10px; }
.trip-facts { margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.trip-facts > div { background: var(--mist); border-radius: var(--r-s); padding: 8px 12px; }
.trip-facts dt { font-size: 14px; font-weight: 700; color: var(--muted); }
.trip-facts dd { margin: 0; font-weight: 600; }
.trip-tl { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.trip-tl > li { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: start; }
.tt-time { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--sea-deep); text-align: right; line-height: 1.25; padding-top: 2px; }
.tt-time small { display: block; color: var(--muted); font-weight: 600; font-size: 14px; }
.tt-body { border: 1px solid var(--line); border-radius: var(--r-s); padding: 8px 12px; background: var(--surface); min-width: 0; }
.tt-head { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.tt-body p { margin: 4px 0 0; }
.tt-links { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.tt-links a, .tt-links span { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; }
.tt-links .ic { color: var(--sea); }
/* 사용법 띠: 제목은 윗줄, 세 단계는 아랫줄 (좁은 PC에서 글자가 4줄로 꺾이지 않게) */
.howto-strip { grid-template-columns: 1fr auto; padding: 12px 56px 12px 18px; }
.howto-strip h3 { grid-column: 1 / -1; }
.howto-strip ol { grid-column: 1; }
.howto-more { grid-column: 2; align-self: end; }
@media (max-width: 900px) { .howto-strip { grid-template-columns: 1fr; } .howto-strip ol, .howto-more { grid-column: 1; } }
/* 내 일정: 자세히 펼친 카드는 한 줄을 다 쓴다 */
.my-list > .trip:has(.trip-detail) { grid-column: 1 / -1; }

/* ---------- 교통 안내: 질문 순서대로, 핵심만 먼저 ---------- */
.tr-jump { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
.tr-jump button { display: grid; justify-items: center; gap: 4px; min-height: 72px; padding: 10px 6px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); color: var(--sea-deep); font: inherit; font-weight: 700; cursor: pointer; text-align: center; line-height: 1.25; }
.tr-jump button:hover { border-color: var(--sea); background: var(--mist); }
.tr-jump .ic { width: 26px; height: 26px; color: var(--sea); }
.tr-sec { margin-top: 18px; scroll-margin-top: calc(var(--hdr, 64px) + 12px); }
.tr-head { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
.tr-head > .ic { width: 34px; height: 34px; padding: 6px; border-radius: 12px; background: var(--sea-soft); color: var(--sea); flex: none; }
.tr-head h2 { margin: 0; font-size: 1.35em; }
.tr-head p { margin: 2px 0 0; }
.tr-h2 { display: flex; align-items: center; gap: 10px; font-size: 1.35em; margin: 0 0 10px; }
.tr-h2 .ic { color: var(--sea); }
.tr-van { border: 2px solid var(--sea); }
.tr-call { display: flex; align-items: center; gap: 12px; padding: 12px 18px; margin: 4px 0 14px; border-radius: var(--r-m); background: var(--sea); color: var(--sea-ink); text-decoration: none; max-width: 420px; min-height: 64px; }
.tr-call .ic { width: 28px; height: 28px; }
.tr-call b { display: block; font-size: 1.5em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tr-call small { font-size: 14px; opacity: .95; }
.tr-call:hover { filter: brightness(.95); }
.tr-facts { margin: 0 0 12px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 8px; }
.tr-facts.one { grid-template-columns: 1fr; }
.tr-facts > div { background: var(--mist); border-radius: var(--r-s); padding: 10px 12px; }
.tr-facts dt { font-size: 14px; font-weight: 700; color: var(--muted); }
.tr-facts dd { margin: 2px 0 0; font-weight: 600; }
.tr-facts dd small { font-weight: 400; }
.tr-phones { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.tr-phones a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; }
.tr-checks { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 6px; }
.tr-checks li { padding-left: 14px; border-left: 3px solid var(--sun); }
.tr-checks b { color: var(--sea-deep); margin-right: 6px; }
.tr-note { margin: 10px 0 0; padding: 8px 12px; border-radius: var(--r-s); background: var(--warn-bg); color: var(--ink); }
.tr-more { margin: 6px 0; }
.tr-more summary { cursor: pointer; font-weight: 600; color: var(--sea-deep); min-height: 44px; display: flex; align-items: center; list-style: none; }
.tr-more summary::-webkit-details-marker { display: none; }
.tr-more summary::before { content: "▸"; margin-right: 8px; color: var(--sea); }
.tr-more[open] > summary::before { content: "▾"; }
.tr-who { margin: 4px 0 8px; padding-left: 1.3em; display: grid; gap: 4px; }
.tr-route { list-style: none; counter-reset: st; margin: 6px 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 4px; }
.tr-route li { counter-increment: st; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px 4px 4px; border-radius: 999px; background: var(--mist); font-size: .95em; }
.tr-route li::before { content: counter(st); width: 22px; height: 22px; border-radius: 50%; background: var(--sea); color: var(--sea-ink); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.tr-filter { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 8px; }
.tr-filter input { min-height: 44px; width: min(320px, 100%); border: 1.5px solid var(--line-strong); border-radius: 999px; padding: 0 16px; background: var(--surface); }
.tr-list { list-style: none; margin: 0; padding: 0; }
.tr-list > li { display: flex; justify-content: space-between; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tr-list > li > div:first-child { display: grid; min-width: 0; }
.tr-list small { font-size: 14px; }
.tr-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tr-list.compact > li { flex-wrap: nowrap; }
@media (max-width: 600px) {
  .tr-jump { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tr-jump button { min-height: 64px; font-size: .92em; }
  .tr-facts { grid-template-columns: 1fr 1fr; }
}

/* ---------- 관리자: 누가 로그인했는지 · 한눈에 · 계정 ---------- */
.admin-who { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; justify-content: flex-end; }
.who-badge { display: inline-flex; gap: 6px; align-items: center; }
[class^="role-"] { display: inline-block; font-size: 14px; font-weight: 700; padding: 2px 10px; border-radius: 999px; }
.role-owner { background: var(--sea); color: var(--sea-ink); }
.role-editor { background: var(--sea-soft); color: var(--sea-deep); }
.role-surveyor { background: var(--go-bg); color: var(--go); }
.dash-hello { margin: 0 0 12px; }
.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 14px; }
.dash-card { display: grid; gap: 2px; text-align: left; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; min-height: 44px; }
.dash-card:hover:not(:disabled) { border-color: var(--sea); }
.dash-card:disabled { cursor: default; opacity: 1; }
.dash-card.warn { border-left: 5px solid var(--sun); }
.dash-k { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; color: var(--muted); }
.dash-k .ic { color: var(--sea); }
.dash-card > b { font-family: var(--f-display); font-weight: 400; font-size: 2em; color: var(--sea-deep); line-height: 1.1; }
.dash-recent li { padding: 4px 0; border-bottom: 1px solid var(--line); }
.role-list li { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.pw-row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.pw-row input { flex: 1 1 140px; }
.acc-tbl select { min-height: 44px; }
.acc-tbl .chips { gap: 6px; }
.who-filter { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; margin: 4px 0 10px; }
.who-filter select { min-height: 44px; border: 1.5px solid var(--line-strong); border-radius: var(--r-s); padding: 0 10px; background: var(--surface); }

/* ==========================================================================
   동해시 마스코트 (CIP 디자인표준편람 BS-19~32) — 얼굴은 대화 칸, 전신·응용형은 페이지 곳곳
   ========================================================================== */
.says img, .reply img { object-fit: contain; }
.says img { height: 60px; width: 60px; }
.brand img { width: 44px; object-fit: contain; }
.ask-dongi { object-fit: contain; }
.page-head.has-photo { padding-right: 150px; }
.page-head-mascot { position: absolute; right: 18px; bottom: -6px; height: 150px; width: auto; z-index: 0; filter: drop-shadow(0 6px 10px rgba(4, 14, 28, .35)); pointer-events: none; }
.page-head:not(.has-photo) { position: relative; }
@media (max-width: 700px) { .page-head.has-photo { padding-right: 104px; } .page-head-mascot { height: 104px; right: 6px; } }
.pp-scene { margin: 0; padding: 12px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); display: grid; justify-items: center; gap: 4px; }
.pp-scene img { max-height: 220px; width: auto; max-width: 100%; }
.pp-scene figcaption { font-family: var(--f-display); color: var(--sea-deep); }
.pp-notice { position: relative; }
.pp-notice-mascot { float: right; height: 72px; width: auto; margin: -4px 0 4px 10px; }
.sheet-hello { display: flex; gap: 10px; align-items: flex-end; margin: 6px 0 10px; }
.sheet-hello img { height: 110px; width: auto; flex: none; }
.sheet-hello .bubble { margin: 0; }
.typing { display: flex; align-items: center; gap: 8px; }
.typing img { width: 40px; height: 40px; object-fit: contain; }
@media (prefers-reduced-motion: no-preference) { .typing img { animation: dongi-think 1.6s ease-in-out infinite; } @keyframes dongi-think { 50% { transform: rotate(-6deg); } } }
/* 사용법 상자: 캐릭터 없이 글만 (사용자 의견 — 캐릭터가 있으면 어지러움) */
.howto-strip { grid-template-columns: 1fr auto; }
.howto-strip h3 { grid-column: 1 / -1; }
.howto-strip ol { grid-column: 1; }
.howto-more { grid-column: 2; }
@media (max-width: 900px) { .howto-strip { grid-template-columns: 1fr; } .howto-strip ol, .howto-more { grid-column: 1; } }
/* 대화: 얼굴은 최근 말풍선에만 */
.says.quiet img { visibility: hidden; }
.says.quiet { margin-top: 4px; }
/* 빠른 수정 버튼: 옆으로 밀지 않고 여러 줄로 (가로 스크롤 막대가 입력칸 위에서 깨져 보이던 문제) */
.qc { flex-wrap: wrap; overflow-x: visible; padding-bottom: 0; }
.qc .chip { flex: 0 1 auto; }
.chat-dock .qc .chip { min-height: 44px; padding: 0 14px; font-size: .95em; }
.panel.empty img { width: 140px; height: auto; }

/* ---------- 코스가 나온 뒤: 대화는 오른쪽 아래 위젯, 코스(왼쪽)·지도(오른쪽) ---------- */
.grid.has-course { grid-template-columns: minmax(0, 1fr); }
.grid.has-course > .panel.chat.widget { display: none; }
.grid.has-course > .panel.chat.widget.open { display: flex; position: fixed; z-index: 65; right: 20px; bottom: 20px; top: auto; width: min(420px, calc(100vw - 40px));
  height: min(680px, calc(100dvh - var(--hdr, 64px) - 40px)); box-shadow: 0 24px 60px -20px rgba(12, 35, 64, .5); border-color: var(--sea); }
.widget-bar { flex: none; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px 8px 16px; border-bottom: 1px solid var(--line); background: var(--sea-soft); border-radius: var(--r-l) var(--r-l) 0 0; }
.widget-bar b { font-family: var(--f-display); font-weight: 400; color: var(--sea-deep); font-size: 1.1em; }
.chat-fab { position: fixed; z-index: 65; right: 20px; bottom: 20px; display: flex; align-items: center; gap: 10px; padding: 8px 18px 8px 8px; min-height: 64px; border: 2px solid var(--sea); border-radius: 999px;
  background: var(--surface); color: var(--ink); font: inherit; text-align: left; cursor: pointer; box-shadow: 0 16px 36px -16px rgba(12, 35, 64, .55); }
.chat-fab img { width: 52px; height: 52px; object-fit: contain; border-radius: 50%; background: var(--sea-soft); }
.chat-fab b { display: block; color: var(--sea-deep); line-height: 1.25; }
.chat-fab small { display: block; color: var(--muted); font-size: 14px; }
.chat-fab:hover { background: var(--mist); }
#plan:has(.course-layout) { max-width: 1520px; }
@media (min-width: 1321px) {
  #plan:has(.course-layout) { max-width: min(1520px, calc(100% - 176px)); }
}
.course-layout { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: clamp(16px, 2vw, 28px); align-items: start; margin-block: 16px 24px; }
.res-map { display: grid; gap: 10px; min-width: 0; position: sticky; top: calc(var(--hdr, 64px) + 12px); container-type: inline-size; }
.course-schedule { min-width: 0; }
.course-schedule > h3 { margin: 0 0 6px; color: var(--sea-deep); }
.course-route-frame { display: block; width: 100%; height: clamp(350px, calc(100dvh - var(--hdr, 64px) - 180px), 720px); border: 1px solid var(--line); background: white; }
@container (max-width: 740px) {
  .course-route-frame { zoom: .78; height: clamp(450px, calc((100dvh - var(--hdr, 64px) - 180px) / .78), 780px); }
}
@container (max-width: 500px) {
  .course-route-frame { zoom: .7; height: clamp(600px, 90dvh, 800px); }
}
.course-guidance[open] { max-height: 35dvh; overflow: auto; }
.course-guidance { padding: 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s); }
.course-guidance details { border-top: 1px solid var(--line); }
.course-guidance summary { padding: 10px 0; min-height: 44px; cursor: pointer; font-weight: 600; }
.course-guidance ol { margin: 0 0 12px; padding-inline-start: 2em; }
.course-guidance button { background: transparent; color: var(--sea); border: none; min-height: 44px; text-align: start; font: inherit; cursor: pointer; }
.course-guidance button[aria-pressed=true] { font-weight: 700; text-decoration: underline; }
@media (min-width: 800px) { .tl-head .chat-fab { position: static; box-shadow: none; } }
.res-map .map { height: clamp(245px, calc(100dvh - var(--hdr, 64px) - 220px), 560px); }
.res-map .chip { justify-self: start; text-decoration: none; }
@media (max-width: 900px) {
  .course-layout { grid-template-columns: minmax(0, 1fr); }
  .res-map { position: static; }
  .res-map .map { height: clamp(320px, 55dvh, 560px); }
  .chat-fab { position: static; flex-basis: 100%; justify-content: center; box-shadow: none; border-radius: var(--r-s); }
  .chat-fab img { width: 40px; height: 40px; }
  .grid.has-course > .panel.chat.widget.open { left: 0; right: 0; bottom: 0; width: 100%; height: min(78dvh, 640px); border-radius: var(--r-l) var(--r-l) 0 0; z-index: 70; }
}
@media print { .chat-fab { display: none !important; } }
@media (max-width: 480px) {
  .ask { display: grid; grid-template-columns: minmax(0, 1fr) auto; padding: 8px; border-radius: var(--r-m); }
  .ask-dongi { display: none; }
  .ask input { width: 100%; }
  .ask button:last-child { grid-column: 1 / -1; border-radius: var(--r-s); }
}
/* 더 묻기 몇 번째인지, 다르게 짜 보기 버튼 */
.xq-step { width: 100%; font-size: 14px; font-weight: 700; color: var(--muted); }
.chip.alt { border-color: var(--sun-deep); color: var(--sea-deep); font-weight: 600; }
.typo-fix { color: var(--sun-deep); }
/* 공영주차장: 가까운 곳 추천·지도 */
.tr-near { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 10px; }
.tr-near-sel { display: inline-flex; gap: 8px; align-items: center; font-weight: 600; }
.tr-near-sel select { min-height: 44px; border: 1.5px solid var(--line-strong); border-radius: var(--r-s); padding: 0 10px; background: var(--surface); max-width: 220px; }
.tr-rec { margin: 0 0 10px; padding: 8px 12px; border-radius: var(--r-s); background: var(--glow); }
.parking-layout { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
#tr-parking .map { width: 100%; height: auto; aspect-ratio: 1; }
.parking-results { min-width: 0; }
@media (min-width: 900px) {
  .parking-layout { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
}
.tr-list > li.rec { background: color-mix(in srgb, var(--glow) 60%, transparent); border-radius: var(--r-s); padding-inline: 8px; }
.badge.rec-b { background: var(--sun-deep); color: #fff; }
.badge.b-dist { background: var(--sea-soft); color: var(--sea-deep); }
.tr-go { display: flex; gap: 6px; }
.tr-go .chip { text-decoration: none; }
/* 행사: 곧 열리는 것 · 해마다 열리는 축제 */
.ev-next { margin-bottom: 12px; border-left: 5px solid var(--go); }
.ev-next ul { margin-top: 6px; }
.ev-yearly { margin-top: 18px; }
.ev-y-list { list-style: none; margin: 8px 0; padding: 0; display: grid; gap: 6px; }
.ev-y-list li { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ev-y-list li > div { display: grid; flex: 1; min-width: 0; }
.ev-m { flex: none; width: 52px; height: 52px; border-radius: 14px; background: var(--sea-soft); color: var(--sea-deep); display: grid; place-items: center; font-family: var(--f-display); font-size: 1.15em; }
.stay-kinds { margin: 0 0 12px; }

/* ---------- 2026-11-19 사용자 의견 ---------- */
/* 상단 메뉴 바를 페이지 배경과 구분: 흰 바탕 + 아래 그림자 */
.top { background: color-mix(in srgb, var(--surface) 94%, transparent); box-shadow: 0 2px 10px rgba(18, 53, 94, .08); }
/* 편의시설 지도: 켜고 끄는 버튼 줄과 지도 사이 띄우기 */
.layers.chips { margin: 0 0 18px; }
.sec .layers + .map { margin-top: 0; }
/* 코스 짜기: 코스가 나오기 전에는 대화 한 칸만 (오른쪽 조건 칸·지도 없앰) */
.grid:not(.has-course) { grid-template-columns: minmax(0, 1fr); max-width: 820px; margin-inline: auto; }
.planner-shell .grid:not(.has-course) > #timeline { display: block; }
.trip-line { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 14px; border-bottom: 1px solid var(--line); background: var(--mist); }
.tl-chip { display: inline-flex; align-items: center; min-height: 32px; padding: 2px 12px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); font-size: .9em; font-weight: 600; color: var(--sea-deep); }
/* 입구 두 갈래: 고르기 전엔 카드만, 고르면 대화창. 무장애 카드를 더 크게(주 기능) */
.fork-stage { padding: 28px 28px 32px; display: grid; gap: 18px; }
.fork-hi { display: flex; gap: 12px; align-items: center; margin: 0; }
.fork-hi img { width: 64px; height: 64px; object-fit: contain; flex: none; }
.fork-hi span { background: var(--mist); border: 1px solid var(--line); border-radius: 20px 20px 20px 6px; padding: 10px 14px; }
.fork-hi b { display: block; font-family: var(--f-display); font-weight: 400; color: var(--sea-deep); font-size: .9em; }
.fork-q { margin: 4px 0 0; font-size: 1.35em; }
.fork { display: grid; grid-template-columns: 3fr 2fr; gap: 14px; align-items: stretch; }
.fork-btn { display: flex; align-items: center; gap: 16px; text-align: left; padding: 20px 22px; border: 2px solid var(--line-strong); border-radius: var(--r-l); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; min-height: 120px; }
.fork-btn:hover, .fork-btn:focus-visible { border-color: var(--sea); background: var(--sea-soft); }
.fork-btn .ic { flex: none; color: var(--sea); width: 32px; height: 32px; }
.fork-btn b { display: block; color: var(--sea-deep); font-size: 1.2em; font-family: var(--f-display); font-weight: 400; }
.fork-btn small { display: block; color: var(--muted); font-size: max(14px, .92em); line-height: 1.45; margin-top: 2px; }
.fork-btn em { display: block; font-style: normal; font-size: max(14px, .88em); color: var(--sea-deep); margin-top: 8px; font-weight: 600; }
.fork-btn.main { border-color: var(--sea); background: color-mix(in srgb, var(--sea-soft) 60%, var(--surface)); min-height: 160px; padding: 26px 26px; }
.fork-btn.main .ic { width: 44px; height: 44px; }
.fork-btn.main b { font-size: 1.5em; }
@media (max-width: 640px) { .fork { grid-template-columns: 1fr; } .fork-btn.main { min-height: 130px; } .fork-btn { min-height: 92px; } .fork-stage { padding: 20px 16px 22px; } }
.grid:not(.has-course) > .panel.chat:has(.fork-stage) { height: auto; }

/* 지도 점 정보 카드 (누르거나 마우스를 올리면) */
.map-pop { position: relative; min-width: 220px; max-width: 300px; background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: var(--r-m); box-shadow: 0 6px 20px rgba(18, 53, 94, .22); padding: 14px 40px 12px 16px; display: grid; gap: 4px; font-family: var(--f-body); font-size: 15px; line-height: 1.45; text-align: left; white-space: normal; word-break: keep-all; }
.map-pop b { font-size: 1.12em; color: var(--sea-deep); }
.map-pop span { color: var(--muted); }
.map-pop-x { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--muted); cursor: pointer; border-radius: 50%; }
.map-pop-x:hover { background: var(--mist); }
.map-pop-go { display: flex; gap: 10px; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
.map-pop-go a { color: var(--sea-deep); font-weight: 600; min-height: 36px; display: inline-flex; align-items: center; }
.map-pop-go a.go { background: var(--sea); color: var(--sea-ink); padding: 0 14px; border-radius: 999px; text-decoration: none; }
.map-pop.sketch { position: absolute; left: 12px; bottom: 12px; z-index: 2; }

/* 코스 지도: 우리 지도 / 카카오 길찾기 */
.route-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.route-frame { width: 100%; border: 1px solid var(--line); display: block; background: var(--mist); }
#timeline.res > .res-map .route-frame { height: min(640px, calc(100dvh - var(--hdr, 64px) - 170px)); }
.route-note { margin: 0; }
@media (max-width: 900px) { #timeline.res > .res-map .route-frame { height: 520px; } }
/* 글자 크게 보기 + 넓은 화면: 머리말을 두 줄로 정리 (로고·버튼 한 줄, 메뉴 한 줄) — 영어에서 버튼이 엉뚱하게 내려가던 줄바꿈 */
@media (min-width: 761px) {
  body.big .bar { display: grid; grid-template-columns: auto 1fr; align-items: center; row-gap: 4px; }
  body.big .brand { grid-column: 1; grid-row: 1; }
  body.big .tools { grid-column: 2; grid-row: 1; justify-self: end; }
  body.big .nav { grid-column: 1 / -1; grid-row: 2; }
}
/* 글자 크게 보기 + 좁은 화면: 교통 정보 칸은 한 줄에 하나 (두 칸이면 단어마다 줄이 바뀜) */
@media (max-width: 600px) { body.big .tr-facts { grid-template-columns: 1fr; } }
@media (max-width: 900px) { body.big .tr-facts { grid-template-columns: 1fr 1fr; } }
@media (max-width: 600px) { body.big .tr-facts { grid-template-columns: 1fr; } }
.ko-name { font-family: var(--f-body); font-size: .7em; font-weight: 400; }
/* 입구 카드: 좁은 화면에서는 아이콘을 글 위로 */
@media (max-width: 640px) {
  .fork-btn { flex-direction: column; align-items: flex-start; gap: 8px; }
  .fork-btn .ic, .fork-btn.main .ic { width: 30px; height: 30px; }
  .fork-hi img { width: 44px; height: 44px; }
}

/* 입구 카드 v2 (사용자 의견): 사용법 상자와 같은 폭, 두 카드 반반, 작은 이름표 + 큰 제목 + 설명 */
.grid:not(.has-course) { max-width: none; }
.fork { grid-template-columns: 1fr 1fr; gap: 16px; }
.fork-btn, .fork-btn.main { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 8px; min-height: 170px; padding: 24px 26px; }
.fork-btn.main { background: color-mix(in srgb, var(--sea-soft) 60%, var(--surface)); }
.fork-k { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; color: var(--ink); font-size: 1.02em; }
.fork-btn .fork-k .ic, .fork-btn.main .fork-k .ic { width: 26px; height: 26px; color: var(--sea); }
.fork-btn b, .fork-btn.main b { font-size: 1.55em; line-height: 1.3; color: var(--sea-deep); }
.fork-btn small { font-size: max(15px, 1em); color: var(--muted); }
@media (max-width: 640px) { .fork { grid-template-columns: 1fr; } .fork-btn, .fork-btn.main { min-height: 0; padding: 18px; } .fork-btn b, .fork-btn.main b { font-size: 1.3em; } }

/* 지도 정보 카드: 점 아래로 뜰 때 */
.map-pop.below { margin-top: 18px; }
.map-pop:not(.sketch):not(.below) { margin-bottom: 18px; }
/* 교통: 누른 안내만 열림 */
.tr-jump button[aria-pressed="true"] { background: var(--sea); border-color: var(--sea); color: var(--sea-ink); }
.tr-jump button[aria-pressed="true"] .ic { color: var(--sea-ink); }
.tr-none { margin: 4px 0 18px; }
/* 입구 카드 색 구분: 무장애 = 바다 파랑, 일반 = 햇살 주황 */
.fork-btn:not(.main) { background: color-mix(in srgb, var(--sun) 12%, var(--surface)); border-color: color-mix(in srgb, var(--sun-deep) 55%, var(--line-strong)); }
.fork-btn:not(.main):hover, .fork-btn:not(.main):focus-visible { background: color-mix(in srgb, var(--sun) 22%, var(--surface)); border-color: var(--sun-deep); }
.fork-btn:not(.main) .fork-k .ic { color: var(--sun-deep); }
.fork-btn:not(.main) b { color: color-mix(in srgb, var(--sun-deep) 70%, var(--ink)); }

/* ==========================================================================
   커뮤니티 '다녀온 길' — 눈에 띄는 요소는 코스 띠 하나, 나머지는 조용하게
   ========================================================================== */
.cm-top { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; justify-content: space-between; margin: 0 0 14px; }
.cm-note { margin: 0; max-width: 60ch; }
.cm-write { display: inline-flex; align-items: center; gap: 8px; }
.cm-filter { display: grid; gap: 10px; margin: 0 0 12px; }
.cm-sel select, .cm-search input, .cm-form input, .cm-form select, .cm-form textarea { min-height: 44px; border: 1.5px solid var(--line-strong); border-radius: var(--r-s); padding: 8px 12px; background: var(--surface); color: var(--ink); font: inherit; width: 100%; box-sizing: border-box; }
.cm-sel { display: inline-flex; } .cm-sel select { width: auto; }
.cm-search input { max-width: 520px; }
.cm-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.cm-card { display: grid; gap: 10px; height: 100%; box-sizing: border-box; padding: 18px 18px 14px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); color: var(--ink); text-decoration: none; }
.cm-card:hover, .cm-card:focus-visible { border-color: var(--sea); }
.cm-kind { font-size: max(14px, .88em); font-weight: 700; color: var(--sea-deep); }
.cm-kind.free { color: var(--sun-deep); }
.cm-title { font-size: 1.12em; line-height: 1.4; }
.cm-tip { display: flex; gap: 6px; align-items: flex-start; font-size: max(14px, .92em); color: var(--muted); }
.cm-tip .ic { flex: none; margin-top: 3px; color: var(--sea); }
.cm-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: max(14px, .88em); color: var(--muted); margin: 0; }
.cm-stars { color: var(--sun-deep); letter-spacing: 1px; }
.cm-mine { font-style: normal; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--sea-soft); color: var(--sea-deep); }
/* 코스 띠: 점과 선으로 잇는 작은 노선도. 식당·카페는 속이 빈 점 */
.cm-strip { list-style: none; margin: 0; padding: 4px 0 0; display: flex; flex-wrap: wrap; row-gap: 10px; }
.cm-strip li { position: relative; display: flex; align-items: center; padding-left: 18px; margin-right: 22px; font-size: max(14px, .92em); font-weight: 600; color: var(--sea-deep); }
.cm-strip li::before { content: ""; position: absolute; left: 0; width: 11px; height: 11px; border-radius: 50%; background: var(--sea); box-shadow: 0 0 0 3px var(--sea-soft); }
.cm-strip li.eat::before { background: var(--surface); border: 2.5px solid var(--sun-deep); box-shadow: none; width: 7px; height: 7px; }
.cm-strip li:not(:last-child)::after { content: ""; position: absolute; right: -18px; top: 50%; width: 14px; border-top: 2px dashed var(--line-strong); }
.cm-detail .cm-post { display: grid; gap: 12px; }
.cm-h { font-size: clamp(1.5em, 3vw, 2em); margin: 0; line-height: 1.3; }
.cm-detail .cm-strip li { font-size: 1.02em; }
.cm-actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cm-actions .btn-go, .cm-form .btn-go { display: inline-flex; align-items: center; gap: 8px; justify-self: start; }
.cm-body { white-space: pre-line; line-height: 1.8; max-width: 70ch; margin: 0; }
.cm-tips { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cm-tips li { display: flex; gap: 8px; align-items: flex-start; background: var(--mist); border-radius: var(--r-s); padding: 10px 12px; }
.cm-tips .ic { flex: none; margin-top: 4px; color: var(--sea); }
.cm-clist { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 10px; }
.cm-clist li { border-bottom: 1px solid var(--line); padding-bottom: 10px; }
.cm-clist b { margin-right: 8px; } .cm-clist p { margin: 4px 0 0; }
.cm-form { display: grid; gap: 12px; }
.cm-form label { display: grid; gap: 6px; font-weight: 600; }
.cm-form fieldset { border: 1px solid var(--line); border-radius: var(--r-m); padding: 12px 14px; display: grid; gap: 10px; margin: 0; }
.cm-form legend { font-weight: 700; padding: 0 6px; }
.cm-form.inline { grid-template-columns: minmax(0, 160px) minmax(0, 1fr) auto auto; align-items: center; margin-top: 8px; }
.cm-chk { display: inline-flex !important; grid-auto-flow: column; align-items: center; gap: 6px; font-weight: 500 !important; min-height: 44px; }
.cm-chk input { width: 22px !important; min-height: 22px !important; }
.cm-pick { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.cm-pick li span { margin-right: 8px; font-weight: 600; }
.cm-rate { display: inline-flex; gap: 4px; }
.cm-rate button { width: 44px; height: 44px; border: 0; background: none; font-size: 28px; color: var(--line-strong); cursor: pointer; border-radius: 50%; }
.cm-rate button.on { color: var(--sun-deep); }
.cm-report { margin-top: 8px; }
.cm-place { display: grid; gap: 10px; }
.cm-empty { text-align: left; }
@media (max-width: 640px) { .cm-form.inline { grid-template-columns: 1fr; } }

/* 코스 뒤 장소·숙소 더하기 */
.add-row { display: flex; flex-wrap: wrap; gap: 8px; }
.add-row .chip { display: inline-flex; align-items: center; }
.stay-on { background: color-mix(in srgb, #6B4FA0 12%, var(--surface)); border-color: #6B4FA0; color: #4A3478; font-weight: 600; }
.stay-x { margin-left: 6px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: none; font-size: 20px; cursor: pointer; color: inherit; }
.add-pane { display: grid; gap: 8px; padding: 12px; }
.add-pane input { min-height: 44px; width: 100%; box-sizing: border-box; border: 1.5px solid var(--line-strong); border-radius: var(--r-s); padding: 0 12px; font: inherit; background: var(--surface); color: var(--ink); }
.add-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; max-height: 300px; overflow: auto; }
.add-list button { width: 100%; text-align: left; display: grid; gap: 2px; padding: 10px 12px; min-height: 44px; border: 1px solid var(--line); border-radius: var(--r-s); background: var(--surface); color: var(--ink); font: inherit; cursor: pointer; }
.add-list button:hover, .add-list button:focus-visible { border-color: var(--sea); background: var(--mist); }
.add-list small { color: var(--muted); }

/* 편의시설 목록: 누르면 지도에서 그 점으로 */
.fac-list .fac-item { display: flex; gap: 10px; align-items: flex-start; width: 100%; text-align: left; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }

/* 커뮤니티 첫 화면: 두 문 */
.cm-hub { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.cm-door { display: grid; gap: 8px; align-content: start; padding: 26px; border-radius: var(--r-l); border: 2px solid var(--line-strong); text-decoration: none; color: var(--ink); min-height: 190px; }
.cm-door.talk { background: color-mix(in srgb, var(--sea-soft) 60%, var(--surface)); border-color: var(--sea); }
.cm-door.ask { background: color-mix(in srgb, var(--sun) 12%, var(--surface)); border-color: color-mix(in srgb, var(--sun-deep) 55%, var(--line-strong)); }
.cm-door:hover, .cm-door:focus-visible { box-shadow: 0 0 0 3px var(--sea-soft); }
.cm-door-k { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
.cm-door-k .ic { width: 24px; height: 24px; color: var(--sea); }
.cm-door.ask .cm-door-k .ic { color: var(--sun-deep); }
.cm-door b { font-family: var(--f-display); font-weight: 400; font-size: 1.6em; color: var(--sea-deep); line-height: 1.3; }
.cm-door.ask b { color: color-mix(in srgb, var(--sun-deep) 70%, var(--ink)); }
.cm-door small { color: var(--muted); }
.cm-back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-weight: 600; color: var(--sea-deep); text-decoration: none; }
.cm-back-ic { transform: rotate(90deg); }
.cm-ask { display: grid; gap: 16px; }
.cm-ask h1 { margin: 0; }
.guide-in { display: grid; gap: 12px; }
.guide-in .prep summary { font-weight: 700; cursor: pointer; min-height: 44px; display: flex; align-items: center; }
.cm-answer { background: var(--mist); border-radius: var(--r-s); padding: 10px 12px; }
.ok-msg { color: var(--go, #1E7A45); font-weight: 600; }
.inq-text { white-space: pre-line; }
@media (max-width: 700px) { .cm-hub { grid-template-columns: 1fr; } }
/* ==========================================================================
   사이트 아래 (한국관광공사 누리집 아래쪽 구성 참고): 밝은 회색 바탕, 왼쪽 기관 로고, 오른쪽 공식 SNS
   ========================================================================== */
.site-foot { --foot-bg: #EEF1F5; background: var(--foot-bg); color: var(--ink); border-top: 1px solid var(--line); padding: 0 0 36px; margin-top: 48px; }
.site-foot a { color: inherit; }
.sf-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 24px; padding: 14px 0; border-bottom: 1px solid var(--line); }
.sf-admin { display: inline-flex; align-items: center; min-height: 32px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); font-size: 14px; font-weight: 600; text-decoration: none; color: var(--muted) !important; }
.sf-admin:hover, .sf-admin:focus-visible { color: var(--sea-deep) !important; border-color: var(--sea); }
.sf-links { display: flex; flex-wrap: wrap; gap: 4px 20px; }
.sf-links a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; text-decoration: none; }
.sf-links a:hover { text-decoration: underline; }
.sf-main { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 40px; padding-top: 28px; align-items: start; }
.sf-logos { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; margin-bottom: 18px; }
.sf-logos a { display: inline-flex; border-radius: 8px; }
.sf-logos img { height: 52px; width: auto; display: block; }
.sf-brand { margin: 0 0 8px; }
.sf-note { margin: 0 0 6px; font-size: max(14px, .88em); color: var(--muted); max-width: 72ch; }
.sf-sns-h { margin: 0 0 10px; font-weight: 700; text-align: right; }
.sf-sns { list-style: none; margin: 0; padding: 0; display: flex; gap: 12px; }
.sf-sns a { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: var(--surface); color: #2B3442; border: 1px solid var(--line); }
.sf-sns a:hover, .sf-sns a:focus-visible { color: var(--sea-deep); border-color: var(--sea); }
@media (max-width: 760px) { .sf-main { grid-template-columns: 1fr; } .sf-sns-h { text-align: left; } .sf-logos img { height: 44px; } }
@media (prefers-color-scheme: dark) { .site-foot { --foot-bg: #121D2B; } .sf-sns a { color: #E8EEF6; } }

/* ==========================================================================
   로그인 · 프로필 (이 기기)
   ========================================================================== */
.pf-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px 0 6px; border: 1.5px solid var(--line-strong); border-radius: 999px; background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600; white-space: nowrap; }
.pf-btn.login { padding: 0 14px; }
.pf-btn:hover, .pf-btn:focus-visible { border-color: var(--sea); }
.pf-av { display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; color: #fff; font-weight: 700; flex: none; }
.pf-av.big { width: 84px; height: 84px; font-size: 36px; font-family: var(--f-display); font-weight: 400; }
.pf-nick { max-width: 8em; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 1100px) { .pf-nick { display: none; } .pf-btn { padding: 0 6px; } .pf-btn.login { padding: 0 12px; } }
@media (max-width: 600px) { .pf-btn.login .pf-ic { display: none; } }
.pf-login .pf-card { max-width: 520px; display: grid; gap: 14px; }
.pf-tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.pf-tabs button { min-height: 48px; border: 0; background: none; font: inherit; font-weight: 700; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; }
.pf-tabs button[aria-selected="true"] { color: var(--sea-deep); border-bottom-color: var(--sun); }
.pf { display: grid; gap: 16px; }
.pf-hero { display: flex; flex-wrap: wrap; gap: 18px 22px; align-items: center; padding: 28px; border-radius: var(--r-l); background: linear-gradient(120deg, var(--sea-soft), var(--surface)); border: 1px solid var(--line); }
.pf-who { flex: 1; min-width: 200px; }
.pf-who h1 { margin: 0; }
.pf-who p { margin: 4px 0 0; }
.pf-tags { display: flex; flex-wrap: wrap; gap: 6px; }

.bf2-ck input { width: 22px; height: 22px; accent-color: var(--sea); flex: none; }
.bf2-note { grid-column: 1 / -1; margin: 4px 0 0; }
.bf2-hint { margin: 0; text-align: center; }
@media (max-width: 760px) {
  .bf2-cats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .bf2-cat { min-height: 92px; font-size: .95rem; }
  .bf2-opts { grid-template-columns: 1fr 1fr; }
}

.pl2-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); box-shadow: 0 2px 10px rgba(18,53,94,.06); }
.pl2-pop { position: relative; }
.pl2-tool { display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 0 18px; border: 1.5px solid var(--sea); border-radius: 999px; background: var(--surface); color: var(--sea-deep); font: inherit; font-weight: 700; cursor: pointer; }
.pl2-tool[aria-expanded="true"] { background: var(--sea); color: var(--sea-ink); }
.pl2-tool.plain { border-color: transparent; }
.pl2-tool.plain[aria-expanded="true"] { background: var(--sea-soft); color: var(--sea-deep); }
.pl2-n { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: var(--sun); color: #fff; font-size: .82rem; }
.pl2-panel { position: absolute; top: calc(100% + 10px); left: 0; z-index: 30; width: min(560px, calc(100vw - 32px)); padding: 16px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); box-shadow: 0 14px 34px rgba(18,53,94,.18); display: grid; gap: 12px; }
.pl2-pop.right .pl2-panel { left: auto; right: 0; width: 220px; }
.pl2-grp p { margin: 0 0 6px; font-weight: 700; color: var(--muted); font-size: .92rem; }
.pl2-panel-foot { display: flex; justify-content: flex-end; gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.pl2-sort { list-style: none; margin: 0; padding: 6px; gap: 2px; }
.pl2-sort button { width: 100%; min-height: 44px; padding: 0 14px; border: 0; border-radius: 10px; background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
.pl2-sort button[aria-selected="true"] { background: var(--sea-soft); color: var(--sea-deep); font-weight: 700; }
.pl2-on { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pl2-onchip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 12px; border: 0; border-radius: 999px; background: var(--sea-soft); color: var(--sea-deep); font: inherit; font-weight: 600; cursor: pointer; }
.pl2-onchip span { font-size: 1.15rem; line-height: 1; }

.pl2-grid { grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.pl2-card { border-radius: 20px; box-shadow: 0 2px 10px rgba(18,53,94,.06); }
.pl2-card .art { position: relative; }
.pl2-tag { position: absolute; left: 12px; bottom: 12px; z-index: 1; padding: 4px 12px; border-radius: 999px; background: rgba(255,255,255,.95); color: var(--sea-deep); font-weight: 700; font-size: .88rem; }
.pl2-crowd { position: absolute; right: 10px; bottom: 12px; z-index: 1; }
.pl2-card .pb { display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pl2-card h3 { margin: 0; }
.pl2-desc { margin: 0; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pl2-ic { list-style: none; margin: 2px 0 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; }
.pl2-ic li { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--sea-soft); color: var(--sea-deep); }
.pl2-ic .ic { width: 18px; height: 18px; }
.pl2-P { font-family: Arial, sans-serif; font-size: .8rem; border: 2px solid currentColor; border-radius: 4px; width: 18px; height: 18px; display: grid; place-items: center; line-height: 1; }
.pl2-foot { margin-top: auto; padding-top: 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.pl2-foot .add { margin: 0; }
.pl2-foot .more { margin: 0; padding: 0 14px; border: 1.5px solid var(--line-strong); border-radius: 999px; min-height: 40px; text-decoration: none; }
.pl2-empty { grid-column: 1 / -1; display: grid; gap: 8px; justify-items: start; }
@media (max-width: 620px) {
  .pl2-hero { min-height: 0; background: linear-gradient(180deg, rgba(255,255,255,.2) 0%, var(--surface) 55%), var(--pl2-img) center top / cover no-repeat; }
  .pl2-hero-txt { padding: 110px 18px 18px; }
  .pl2-tools { border-radius: 18px; }
  .pl2-pop.right .pl2-panel { width: 200px; }
}
.pl2-tool { white-space: nowrap; }
@media (max-width: 620px) { .pl2-tool { padding: 0 12px; font-size: .95rem; gap: 6px; } .pl2-tools { padding: 6px; } }

/* 무장애 픽토그램 (열린관광 아이콘을 모양 틀로, 색은 글자색) */
.acc-ic { display: inline-block; flex: none; background: currentColor; -webkit-mask-size: contain; mask-size: contain; -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-position: center; mask-position: center; }

/* 카드 이름 오른쪽 끝의 '오늘 여유/보통/붐빔' 작은 알약 */
.pl2-name { display: flex; align-items: center; gap: 8px; }
.pl2-name .plink { min-width: 0; }
.pl2 .pl2-crowd { position: static; margin-left: auto; flex: none; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 700; line-height: 1.6; white-space: nowrap; border: 1px solid transparent; }
.pl2-crowd.crowd-low { background: #E3F4EA; color: #1E6B3E; border-color: #BFE3CD; }
.pl2-crowd.crowd-mid { background: #FFF3DC; color: #8A5A00; border-color: #F2DDB0; }
.pl2-crowd.crowd-high { background: #FDE7E7; color: #A3262A; border-color: #F3C4C4; }
:root[data-theme="dark"] .pl2-crowd.crowd-low { background: #173A27; color: #9BE0B6; border-color: #2A5A3E; }
:root[data-theme="dark"] .pl2-crowd.crowd-mid { background: #3A2E12; color: #F5CB7A; border-color: #5A4718; }
:root[data-theme="dark"] .pl2-crowd.crowd-high { background: #3E1A1C; color: #F4A3A6; border-color: #642A2E; }

/* 동이 브리핑: 실내/바깥 바꾸기를 오른쪽 위로 ('챙기세요' 칩과 헷갈리지 않게, BUG-004) */
.brief-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brief-top .brief-k { margin: 0; }
.brief .brief-act { margin: 0; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border: 1.5px solid var(--sea); border-radius: 999px; background: var(--surface); color: var(--sea-deep); font: inherit; font-weight: 700; cursor: pointer; }
.brief .brief-act:hover { background: var(--sea); color: var(--sea-ink); }
.brief .brief-act .ic { width: 18px; height: 18px; }

/* IMP-005: 무장애 여행 버튼도 마우스를 올리면 색이 바뀌게 (일반 여행과 같게) */
.fork-btn.main:hover, .fork-btn.main:focus-visible { background: var(--sea-soft); border-color: var(--sea-deep); box-shadow: 0 4px 14px rgba(18,53,94,.14); }
.fork-btn:not(.main):hover, .fork-btn:not(.main):focus-visible { box-shadow: 0 4px 14px rgba(18,53,94,.14); }

/* IMP-012: 글자 크게 보기에서 빠른 메뉴 글자가 칸을 넘지 않게 */
.quick a, .quick button { text-align: center; word-break: keep-all; line-height: 1.25; }
body.big .quick a, body.big .quick button { width: 88px; font-size: 14px; }

.req { color: #C9302C; font-weight: 700; }
.cm-load { display: grid; gap: 4px; margin: 0 0 10px; }
.cm-load select { min-height: 44px; border: 1.5px solid var(--line-strong); border-radius: var(--r-s); padding: 0 10px; background: var(--surface); color: var(--ink); }

/* 긴급·도움: 지금 열림/닫힘을 색으로 바로 구분 */
.st-pill { display: inline-block; margin-right: 8px; padding: 1px 10px; border-radius: 999px; font-size: .85em; font-weight: 800; vertical-align: 1px; }
.st-open { background: #E3F4EA; color: #1E6B3E; }
.st-closed { background: #FDE7E7; color: #A3262A; }
.st-check { background: var(--mist); color: var(--muted); }
.sheet-row.is-closed > span:first-child { color: var(--muted); }

/* 숙소: 무장애 확인 숙소는 픽토그램, 자세히는 펼쳐서 / 전체 목록 제목 (IMP-013·014) */
.bf-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bf-picto { margin: 0; }
.bf-more > summary, .bf-food > summary { min-height: 40px; display: flex; align-items: center; cursor: pointer; color: var(--sea-deep); font-weight: 600; }
.bf-food { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
.stay-all-h { margin: 18px 0 2px; }
.stay-kinds .chip:disabled { opacity: .45; cursor: default; }

/* IMP-011: 열어 본 일정은 넓은 화면에서 왼쪽 요약·오른쪽 시간표로 (오른쪽이 텅 비지 않게) */
@media (min-width: 900px) {
  .my-list > .trip:has(.trip-detail) { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 2fr); column-gap: 28px; align-items: start; }
  .my-list > .trip:has(.trip-detail) > *:not(.trip-detail) { grid-column: 1; }
  .my-list > .trip:has(.trip-detail) > .trip-detail { grid-column: 2; grid-row: 1 / span 20; border-top: 0; border-left: 1px solid var(--line); padding: 0 0 0 24px; }
}


/* 편의시설 지도: 내 위치 빨간 점 */
.me-dot { width: 18px; height: 18px; border-radius: 50%; background: #E0262B; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(224,38,43,.22), 0 1px 4px rgba(0,0,0,.4); }
@media (prefers-reduced-motion: no-preference) { .me-dot { animation: me-pulse 2s ease-out infinite; } }
@keyframes me-pulse { 0% { box-shadow: 0 0 0 0 rgba(224,38,43,.45), 0 1px 4px rgba(0,0,0,.4); } 100% { box-shadow: 0 0 0 14px rgba(224,38,43,0), 0 1px 4px rgba(0,0,0,.4); } }
.map-loc { margin: 6px 0 8px; }

/* ---------- AI 판정관 · 최근 길 상태 (docs/17_AI_FEATURES.md) ---------- */
.ai-card { border: 1px solid var(--line); border-left: 4px solid var(--line-strong); border-radius: var(--r-m); padding: 12px 14px; margin: 10px 0 14px; background: var(--surface); }

.ai-status { margin: 14px 0; }
.ai-status.s-ok { border-left-color: var(--go); }
.ai-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ai-top .pp2-h { margin: 0 6px 0 0; }
.ai-by { margin: 0; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.ai-top .ai-by { margin-left: auto; }
.ai-head { margin: 8px 0 4px; font-weight: 600; line-height: 1.5; }

.trip-suggestions h3 { margin: 0 0 6px; }

.trip-suggestions li { padding-block: 5px; }

.trip-suggestions li small { display: block; color: var(--muted); }
.trip-suggestions + .trip { margin-top: 16px; }

.candidate-jump { display: none; }
@media (max-width: 760px) { .candidate-jump { display: inline-flex; margin: 4px 0; } }

/* Shared frame for planning, then the route and its inspector. */
.planner-shell { border: 1px solid var(--line-strong); border-radius: var(--r-m); background: var(--surface); }
.planner-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--sea-soft); border-radius: var(--r-m) var(--r-m) 0 0; }
.planner-bar h2, .workspace-heading { color: var(--sea-deep); font-size: 1.15em; }

.prefs-fields fieldset { border: 0; border-top: 1px solid var(--line); padding: 6px 0; margin: 14px 0; min-width: 0; }
.prefs-fields legend { font-weight: 700; padding-inline-end: 8px; }

.prefs-choices input { width: 18px; height: 18px; accent-color: var(--sea); }
.planner-shell .course-layout { margin-block: 0 16px; }
@media (min-width: 901px) {
  #plan.wrap { max-width: min(1440px, 94%); }

  .planner-shell .course-layout { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 0; align-items: stretch; }

  .planner-shell .course-schedule { padding-inline-start: 18px; border-inline-start: 1px solid var(--line); max-height: max(420px, calc(100dvh - var(--hdr, 64px) - 116px)); overflow-y: auto; scrollbar-gutter: stable; }
  .workspace-tabs { position: sticky; top: 0; z-index: 2; }
}
@media (max-width: 540px) {
  .planner-bar { padding: 10px; }
  .planner-actions { margin-inline-start: 0; }
  .planner-bar .chip { padding-inline: 9px; }
  .planner-shell .res-map .map { height: clamp(240px, 36dvh, 340px); }

}

@media (min-width: 1321px) {
  #plan.wrap { max-width: min(1440px, calc(100% - 192px)); }
}

.map-stop-editor { display: flex; flex-wrap: wrap; align-items: end; gap: 8px 14px; }
.map-stop-editor label { display: grid; gap: 4px; font-size: .9em; font-weight: 700; max-width: 100%; }
.map-stop-editor select { max-width: 100%; min-height: 44px; padding: 5px 9px; border-radius: 6px; color: var(--ink); background: var(--surface); border: 1px solid var(--line-strong); font: inherit; }
button.course-pin { padding: 0; border: 0; background: transparent; cursor: pointer; }

[data-course-stop][data-selected="true"] .tl-body { outline: 2px solid var(--sea); outline-offset: -2px; }

.pane-switch { display: none; }
.stop-pager, .route-links { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

.planner-shell .course-layout {
  --editor-height: calc(100dvh - var(--hdr, 64px) - var(--editor-offset, 100px) - var(--tab, 0px) - 18px);
  height: max(350px, var(--editor-height));

.planner-shell .res-map .map, .planner-shell .res-map .course-route-frame { flex: 1 1 0%; min-height: 100px; height: 0; }
.planner-shell .course-schedule { min-height: 0; max-height: 100%; overflow: auto; overscroll-behavior: contain; }
.route-links { position: relative; }
.route-links .course-guidance[open] { position: absolute; z-index: 4; bottom: 0; left: 0; width: 100%; max-height: 34dvh; }
@media (max-width: 900px) {
  .pane-switch { display: flex; gap: 4px; }
  .planner-shell .course-layout { display: flex; flex-direction: column; }

}

.stop-overview { background: var(--surface); border: 1px solid var(--line); padding: 12px; border-radius: var(--r-m); }

.planner-shell .course-schedule { max-height: none; height: auto; overflow: visible; scrollbar-gutter: auto; }
.course-schedule .workspace-tabs, .course-schedule .stop-pager { position: static; }
.course-schedule > .tl { margin: 8px 0; }
.course-schedule .tl-drive { margin: 0 0 4px; }
.course-schedule > .muted { margin: 8px 0; }
.course-schedule .route-costs { margin: 6px 0; }
.course-schedule .route-costs > div { min-width: 0; }
.planner-shell .res-map { height: max(350px, var(--editor-height)); }
@media (min-width: 901px) {
  .planner-shell .course-layout { height: auto; min-height: max(350px, var(--editor-height)); grid-template-columns: minmax(0, 1.58fr) minmax(360px, 1fr); align-items: start; }
}
@media (max-width: 900px) {
  .planner-shell .course-layout { height: auto; min-height: max(350px, var(--editor-height)); }
  .planner-shell .course-layout > .res-map { flex: 0 0 auto; }
}

@media (max-width: 900px) {
  .planner-shell .course-layout { align-items: stretch; }
  .planner-shell .course-layout > :is(.course-schedule,.res-map) { width: 100%; }
}
@media (min-width: 901px) {
  #plan.wrap:has(.course-layout) { width: calc(100% - 40px); max-width: 1640px; }
}
@media (min-width: 1321px) {
  #plan.wrap:has(.course-layout) { width: calc(100% - 120px); margin-inline: max(16px, calc((100% - 1640px) / 2)) auto; }
}

.planner-tools-toggle { display: none; }
@media (max-width: 600px) {
  .planner-tools-toggle { display: inline-flex; margin-inline-start: auto; }
  .planner-actions[data-open="false"] { display: none; }
  .planner-shell .planner-bar { gap: 4px 8px; padding: 6px 10px; }
  .planner-shell .pane-switch { flex: 1 0 100%; }
  .planner-shell .grid > #timeline.res { padding: 8px; }
}

@media (min-width: 901px) { .planner-shell > .grid:not(.has-course):has(> #timeline) { grid-template-columns: repeat(2,minmax(0,1fr)); } }
.planner-shell > .grid:not(.has-course) {
  --planning-pane-height: min(780px, calc(100dvh - var(--hdr, 64px) - var(--tab, 0px) - var(--planner-bar-height, 48px) - 18px));
}
.planner-shell > .grid:not(.has-course):has(> #timeline) > .panel.chat {
  position: static;
  height: var(--planning-pane-height);
}
@media (min-width: 901px) {
  .planner-shell > .grid:not(.has-course) > #timeline { max-height: var(--planning-pane-height); }
}

.course-pin.leg-from .course-pin-face { background: #197342; }
.course-pin.leg-to .course-pin-face { background: #b7382d; }
.leg-summary { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 10px; font-weight: 700; line-height: 1.4; }
.leg-summary small { color: var(--muted); }
.leg-summary strong { margin-inline-start: auto; font-size: .9em; color: var(--sea-deep); }

.planner-shell > .grid[hidden] { display: none; }

.planning-wait { overflow: hidden; border-radius: 0 0 var(--r-m) var(--r-m); background: var(--surface); }
.planning-heading { display: flex; align-items: center; gap: 12px; padding: clamp(16px, 2vw, 28px); color: var(--ink); }
.planning-heading strong { font-size: clamp(1.05rem, 2vw, 1.5rem); line-height: 1.35; }
.planning-indicator { width: 12px; height: 12px; border-radius: 50%; background: #2376c8; box-shadow: 0 0 0 5px #2376c81e; flex: none; }
.planning-map { position: relative; overflow: hidden; background: #f1f2eb; border-top: 1px solid var(--line); }
.planning-map svg { display: block; width: 100%; height: auto; aspect-ratio: 2 / 1; }
.planning-map text { font-family: inherit; paint-order: stroke; stroke-linejoin: round; }
.planning-area-label { fill: #627d83; stroke: #f1f5ef; stroke-width: 2px; font-size: 18px; letter-spacing: .1em; }
.planning-pin-label { fill: #253c4e; }
.planning-pin-label text { stroke: #fffefa; stroke-width: 4px; font-size: 18px; font-weight: 700; }
.planning-trace { stroke-dasharray: 1; animation: planning-draw 8s linear infinite; }
@keyframes planning-draw { 0%,7% { stroke-dashoffset: 1; } 49%,59% { stroke-dashoffset: .36; } 91%,100% { stroke-dashoffset: 0; } }
.planning-map-meta { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 12px; background: var(--surface); font-size: .8em; color: var(--muted); }
.planning-map-meta a { color: inherit; }
.planning-guide-static { display: none; }
@media (max-width: 600px) {
  .planning-map svg { height: clamp(240px, 70vw, 320px); }
  .planning-pin-label text { font-size: 24px; }
}
@media (prefers-reduced-motion: reduce) {
  .planning-trace { animation: none; }
  .planning-guide-moving { display: none; }
  .planning-guide-static { display: block; }
}

.demo-note { background: var(--glow); color: var(--ink); border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
.demo-note .in { max-width: 1160px; margin: 0 auto; padding-block: 8px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.demo-note b { font-family: var(--f-display); font-weight: 400; color: var(--sun-deep); }
.demo-note a { color: var(--sea); font-weight: 600; }
</style>
