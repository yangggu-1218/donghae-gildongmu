/* 긴급·도움: 지금 열림/닫힘을 색으로 바로 구분 */
.st-pill { display: inline-block; margin-right: 8px; padding: 1px 10px; border-radius: 999px; font-size: .85em; font-weight: 800; vertical-align: 1px; }
.st-open { background: #E3F4EA; color: #1E6B3E; }
.st-closed { background: #FDE7E7; color: #A3262A; }
.st-check { background: var(--mist); color: var(--muted); }
.sheet-row.is-closed > span:first-child { color: var(--muted); }

/* 숙소: 이동약자 확인 숙소는 픽토그램, 자세히는 펼쳐서 / 전체 목록 제목 (IMP-013·014) */
.bf-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.bf-picto { margin: 0; }
.bf-more > summary, .bf-food > summary { min-height: 40px; display: flex; align-items: center; cursor: pointer; color: var(--sea-deep); font-weight: 600; }
.bf-food { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 6px; }
.stay-all-h { margin: 18px 0 2px; }
.stay-kinds .chip:disabled { opacity: .45; cursor: default; }

/* IMP-011: 열어 본 일정은 넓은 화면에서 왼쪽 요약·오른쪽 시간표로 (오른쪽이 텅 비지 않게) */
@media (min-width: 900px) {
  .my-list > .trip:has(.trip-detail) { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 2fr); column-gap: 28px; align-items: start; }
  .my-list > .trip:has(.trip-detail) > *:not(.trip-detail) { grid-column: 1; }
  .my-list > .trip:has(.trip-detail) > .trip-detail { grid-column: 2; grid-row: 1 / span 20; border-top: 0; border-left: 1px solid var(--line); padding: 0 0 0 24px; }
}


/* 편의시설 지도: 내 위치 빨간 점 */
.me-dot { width: 18px; height: 18px; border-radius: 50%; background: #E0262B; border: 3px solid #fff; box-shadow: 0 0 0 6px rgba(224,38,43,.22), 0 1px 4px rgba(0,0,0,.4); }
@media (prefers-reduced-motion: no-preference) { .me-dot { animation: me-pulse 2s ease-out infinite; } }
@keyframes me-pulse { 0% { box-shadow: 0 0 0 0 rgba(224,38,43,.45), 0 1px 4px rgba(0,0,0,.4); } 100% { box-shadow: 0 0 0 14px rgba(224,38,43,0), 0 1px 4px rgba(0,0,0,.4); } }
.map-loc { margin: 6px 0 8px; }

/* ---------- AI 판정관 · 최근 길 상태 (docs/17_AI_FEATURES.md) ---------- */
.ai-card { border: 1px solid var(--line); border-left: 4px solid var(--line-strong); border-radius: var(--r-m); padding: 12px 14px; margin: 10px 0 14px; background: var(--surface); }
.ai-card.loading { background: var(--mist); border-left-color: var(--line); }
.ai-judge.v-G { border-left-color: var(--go); }
.ai-judge.v-Y, .ai-status.s-caution { border-left-color: var(--sun-deep); }
.ai-judge.v-R, .ai-status.s-issue { border-left-color: var(--stop); }
.ai-status { margin: 14px 0; }
.ai-status.s-ok { border-left-color: var(--go); }
.ai-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; }
.ai-top .pp2-h { margin: 0 6px 0 0; }
.ai-by { margin: 0; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
.ai-top .ai-by { margin-left: auto; }
.ai-head { margin: 8px 0 4px; font-weight: 600; line-height: 1.5; }
.ai-sub { margin: 10px 0 4px; font-size: .95rem; }
.ai-list { margin: 0; padding-left: 1.2em; line-height: 1.6; }
.ai-list.warn li::marker { color: var(--stop); }
.ai-prop { border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 12px; margin: 8px 0; }
.ai-prop.done { opacity: .65; }
.ai-models td, .ai-models th { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); }
.ai-models { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }

/* =====================================================================
   2026-11-21 정보 밀도 · 반응형 정리 (팀 의견: 글·상자는 줄이고 픽토그램으로)
   ===================================================================== */
.picto { flex: none; display: inline-block; vertical-align: -.2em; }

/* AI 판정 카드: 큰 표지 하나 + 한 줄 항목들 */
.ai-card { padding: 10px 12px; margin: 8px 0 10px; }
.aj-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.aj-verdict { font-size: 1.12em; color: var(--ink); }
.aj-conf { display: inline-flex; gap: 3px; margin-left: 2px; }
.aj-conf i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.aj-conf i.on { background: var(--sea); }
.aj-top .via { margin-left: auto; cursor: help; }
.aj-head { margin: 6px 0 2px; font-weight: 600; }
.aj-list, .ai-status .ai-list { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
.aj-list li { display: flex; gap: 8px; align-items: flex-start; line-height: 1.45; }
.aj-list li[title] { cursor: help; }
.aj-list .picto { margin-top: .1em; }
.aj-warn { font-weight: 600; }
.aj-state { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: .9em; cursor: help; }
.ai-status .ai-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: space-between; }
.ai-status .ai-top h2 { margin: 0; }
.ai-head { margin: 6px 0 0; }

/* 관광지 상세: 구간은 한 줄 카드, 설명 줄은 픽토그램 한 줄 */
.pp2-segs { gap: 8px; margin: 8px 0; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
.pp2-segs > li { padding: 10px 12px; gap: 4px; border-radius: 12px; }
.pp2-segs .badge { display: inline-flex; align-items: center; gap: 5px; cursor: help; }
.pp2-segs p.muted { font-size: .88em; }
.pp2-line { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0 0; }
.pp2-line .picto { margin-top: .15em; }
details.pp2-know > summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
details.pp2-know > summary::-webkit-details-marker { display: none; }
details.pp2-know > summary::after { content: "▾"; color: var(--sea-deep); font-size: 1.1em; }
details.pp2-know[open] > summary::after { content: "▴"; }
details.pp2-know > summary h2 { margin: 0; }
.pp2-info dd[title] { cursor: help; text-decoration: underline dotted var(--line-strong); text-underline-offset: 3px; }

/* 근처 식당: 종류·정렬은 고르기 상자 한 줄 */
.eat-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 8px; }
.eat-bar > span { cursor: help; display: inline-flex; align-items: center; gap: 4px; margin-right: auto; }
.box.sm { min-height: 40px; font-size: .9em; padding: 0 8px; }

/* 코스 짜기 전 대화: 메신저처럼 가운데 한 장, 말풍선은 작게, 답 고르기도 동이 말풍선 안에 */
.grid:not(.has-course) { grid-template-columns: minmax(0, 1fr); }
.grid:not(.has-course) > #timeline { display: none; }
.grid:not(.has-course) > .panel.chat { width: 100%; max-width: 820px; justify-self: center; height: auto;
  max-height: min(720px, calc(100dvh - var(--hdr, 64px) - var(--tab, 0px) - 20px)); }
.grid:not(.has-course) > .panel.chat .chat-log { min-height: 0; max-height: 300px; }
.chat-log .says { margin: 6px 0; gap: 8px; }
.chat-log .says img { height: 40px; }
.chat-log .says.quiet img { visibility: hidden; height: 1px; width: 40px; }
.chat-log .bubble { padding: 7px 12px; border-radius: 16px 16px 16px 4px; max-width: min(85%, 560px); font-size: .97em; line-height: 1.5; }
.chat-log .bubble > b:first-child { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.chat-log .me { margin: 6px 0; }
.chat-log .me span { padding: 7px 12px; border-radius: 16px 16px 4px 16px; max-width: min(80%, 480px); }
.chat-dock { border-top: 0; padding: 4px 14px 12px; gap: 8px; }
.dock-opts:not(:empty) { margin-left: 48px; background: var(--mist); border: 1px solid var(--line); border-radius: 16px 16px 16px 4px; padding: 10px; }
.chat-dock .big-chips .chip { min-height: 44px; padding: 0 14px; font-size: .95em; }
.steps { padding: 8px 12px 0; font-size: .78em; }
.steps li { padding: 4px 2px; }
.dchip { width: 48px; min-height: 54px; }
.composer input { min-height: 44px; }
@media (max-width: 600px) {
  .dock-opts:not(:empty) { margin-left: 0; }
  .chat-log .says img { height: 32px; }
  .chat-log .bubble { max-width: 88%; }
}

/* 빠른 메뉴: 평소엔 작은 단추, 가까이 가면 펼침 (넓은 화면 · 태블릿에서도) */
.quick { padding: 4px; gap: 0; transition: box-shadow .2s; }
.quick-mini { display: grid; justify-items: center; gap: 2px; width: 52px; padding: 8px 2px; border: 0; background: none; border-radius: 12px; font: inherit; font-size: .7em; font-weight: 700; color: var(--sea-deep); cursor: pointer; }
.quick-mini .ic { width: 24px; height: 24px; color: var(--sea); }
.quick-x { align-self: flex-end; width: 32px; height: 32px; border: 0; background: none; border-radius: 50%; font-size: 1.3em; line-height: 1; color: var(--muted); cursor: pointer; }
.quick-x:hover { background: var(--mist); }
.quick.open { box-shadow: 0 18px 40px -18px rgba(18, 53, 94, .7); }
@media (max-width: 1320px) { .quick { display: flex; } }
@media (max-width: 760px) { .quick { display: none; } }
@media (prefers-reduced-motion: no-preference) { .quick.open a, .quick.open > button:not(.quick-x) { animation: q-in .18s ease-out both; } @keyframes q-in { from { opacity: 0; transform: translateX(8px); } } }

/* 챗봇 단추: 평소엔 동이 얼굴 동그라미, 마우스를 올리거나 포커스하면 글이 펼쳐짐 */
.chat-fab.mini { padding: 6px; gap: 0; min-height: 0; }
.chat-fab.mini span { max-width: 0; overflow: hidden; white-space: nowrap; opacity: 0; transition: max-width .25s, opacity .2s, margin .25s; }
.chat-fab.mini:hover span, .chat-fab.mini:focus-visible span { max-width: 260px; opacity: 1; margin: 0 12px 0 8px; }
.widget-x { margin-left: auto; width: 40px; height: 40px; border: 0; border-radius: 50%; background: var(--mist); color: var(--sea-deep); font-size: 1.4em; line-height: 1; cursor: pointer; }
.widget-x:hover { background: var(--sea-soft); }
.pp2-line a[href^="tel:"] { white-space: nowrap; }
@media (max-width: 600px) {
  .pp2-segs > li { flex-direction: row; flex-wrap: wrap; align-items: center; column-gap: 8px; padding: 8px 10px; }
  .pp2-segs .pp2-seg-n { flex: 1 1 60%; font-size: .95em; }
  .pp2-segs p.muted { flex-basis: 100%; }
  .aj-top .via { margin-left: 0; }
}

/* 관리자: 탭 줄 + [더 보기], 자료로 채우기 */
.admin-more select { min-height: 44px; border: 0; background: none; font: inherit; font-weight: 600; color: var(--muted); padding: 0 8px; cursor: pointer; }
.admin-more.on select { color: var(--ink); font-weight: 700; box-shadow: inset 0 -3px 0 var(--sea); }
.import-box { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0 4px; padding: 10px 12px; border: 1.5px dashed var(--sea); border-radius: var(--r-m); background: var(--sea-soft); }
.import-h { display: inline-flex; align-items: center; gap: 6px; margin-right: 4px; }
.import-file { display: inline-flex; align-items: center; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.import-url { flex: 1 1 220px; min-width: 0; min-height: 44px; font: inherit; padding: 0 10px; border: 1.5px solid var(--line); border-radius: var(--r-s); background: var(--surface); color: inherit; }
.import-box .err { flex-basis: 100%; margin: 0; }
.ai-fill { margin: 8px 0; padding: 10px 12px; border-left: 4px solid var(--sea); background: var(--mist); border-radius: var(--r-s); }
.ai-fill p { margin: 0 0 6px; }
.ai-missing { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
@media (max-width: 600px) { .admin-tabs { flex-wrap: nowrap; overflow-x: auto; } .admin-tabs > * { flex: none; } }
.import-h .via { margin-left: 2px; }
.admin-more, .eat-bar label { position: relative; }
/* 360px 폰(갤럭시 등)에서 머리말 단추가 넘치지 않게 */
@media (max-width: 420px) {
  .bar { min-width: 0; }
  .tools { gap: 4px; min-width: 0; flex-shrink: 1; }
  .tools .sos { padding: 0 8px; }
  .tools #lang { max-width: 72px; padding: 0 4px; }
  .tools .bigt { padding: 0 6px; }
}
.pp2-info dl > div { grid-template-columns: minmax(0, 7.5em) minmax(0, 1fr); } .pp2-info dd { min-width: 0; overflow-wrap: anywhere; }
@media (max-width: 420px) { .pp2-info dl > div { grid-template-columns: minmax(0, 6.2em) minmax(0, 1fr); gap: 6px; } }

/* =====================================================================
   2026-11-21 시(市)를 위한 기능 — 이용자 불편 알리기 · 관리자 [제보·민원] (docs/19_CITY_REPORTS.md)
   ===================================================================== */
.cr-btn { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; white-space: nowrap; }
@media (max-width: 1440px) { .cr-btn span { display: none; } .cr-btn { padding: 0 10px; } }
.brand, .tools .sos, .tools .box { white-space: nowrap; }
@media (max-width: 600px) { .tools .cr-btn { display: none; } }
.sheet-cr { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 4px 0 10px; }
.cr-cols { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 900px) { .cr-cols { grid-template-columns: minmax(0, 1fr); } }
.cr-form { display: grid; gap: 12px; }
.cr-danger { display: flex; gap: 8px; align-items: flex-start; margin: 0; padding: 8px 10px; border-radius: var(--r-s); background: var(--warn-bg); color: var(--warn); font-size: .9em; font-weight: 600; }
.cr-step { border: 0; margin: 0; padding: 0; display: grid; gap: 8px; min-width: 0; }
.cr-step legend { display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--sea-deep); margin-bottom: 6px; padding: 0; }
.cr-n { width: 26px; height: 26px; border-radius: 50%; background: var(--sea); color: var(--sea-ink); display: inline-grid; place-items: center; font-size: .85em; }
.cr-place select { width: 100%; }
.cr-map .map { height: 260px; }
.cr-cats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 520px) { .cr-cats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cr-cat { display: grid; justify-items: center; gap: 4px; padding: 10px 4px; min-height: 76px; border: 1.5px solid var(--line); border-radius: var(--r-m); background: var(--surface); color: var(--sea-deep); font: inherit; font-size: .88em; font-weight: 600; cursor: pointer; text-align: center; line-height: 1.25; }
.cr-cat .ic { width: 26px; height: 26px; color: var(--sea); }
.cr-cat[aria-pressed="true"] { border-color: var(--sea); background: var(--sea-soft); box-shadow: 0 0 0 2px var(--sea); }
.cr-who { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0; }
.cr-who b { margin-right: 4px; font-size: .92em; }
.cr-photos { display: flex; flex-wrap: wrap; gap: 8px; }
.cr-thumb { position: relative; width: 84px; height: 84px; }
.cr-thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: var(--r-s); }
.cr-thumb button { position: absolute; top: -8px; right: -8px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: #12355E; color: #fff; cursor: pointer; }
.cr-add { width: 84px; height: 84px; display: grid; place-items: center; align-content: center; gap: 4px; border: 1.5px dashed var(--sea); border-radius: var(--r-s); color: var(--sea-deep); font-size: .72em; font-weight: 700; text-align: center; cursor: pointer; padding: 4px; }
.cr-add .ic { width: 24px; height: 24px; color: var(--sea); }
.cr-note { display: flex; gap: 8px; }
.cr-note input { flex: 1; min-width: 0; }
.cr-contact { display: grid; gap: 6px; }
.cr-send { min-height: 52px; font-size: 1.05em; }
.cr-privacy { margin: 0; display: flex; gap: 6px; align-items: flex-start; }
.cr-done { display: grid; gap: 8px; }
.cr-done-h { display: flex; gap: 8px; align-items: center; margin: 0; font-size: 1.15em; }
.cr-code { display: flex; align-items: baseline; gap: 10px; margin: 0; }
.cr-code b { font-size: 1.8em; letter-spacing: .04em; color: var(--sea-deep); font-variant-numeric: tabular-nums; }
.cr-saw, .cr-same { margin: 0; }
.cr-same { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.cr-steps { list-style: none; display: flex; gap: 4px; margin: 6px 0; padding: 0; font-size: .82em; font-weight: 700; }
.cr-steps li { flex: 1; text-align: center; padding: 6px 2px; border-radius: 999px; background: var(--mist); color: var(--muted); }
.cr-steps li.done { background: var(--sea-soft); color: var(--sea-deep); }
.cr-steps li.cur { background: var(--sea); color: var(--sea-ink); }
.cr-steps.off li { background: var(--warn-bg); color: var(--warn); }
.cr-mine { display: grid; gap: 8px; align-content: start; }
.cr-mine h2 { margin: 0; }
.cr-lookup { display: flex; gap: 8px; }
.cr-lookup input { flex: 1; min-width: 0; }
.cr-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.cr-list .panel { padding: 12px; }
.cr-li-top { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cr-li-top small { flex-basis: 100%; }
.cr-reply { margin: 4px 0 0; padding: 8px 10px; background: var(--go-bg); border-radius: var(--r-s); font-size: .92em; }
.cr-reply b { color: var(--go); margin-right: 4px; }
.cr-after { margin: 6px 0 0; }
.cr-after img { width: 100%; max-height: 200px; object-fit: cover; border-radius: var(--r-s); }
.cr-after figcaption { font-size: .8em; color: var(--muted); }
.cr-inline { margin-top: 10px; }
.cr-form.compact .cr-danger { display: none; }

/* 관리자 [제보·민원] */
.ca { display: grid; gap: 12px; }
.ca-warn { display: flex; gap: 8px; align-items: flex-start; margin: 0; padding: 10px 12px; background: var(--warn-bg); color: var(--warn); border-radius: var(--r-s); font-size: .92em; }
.ca-top { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
@media (max-width: 600px) { .ca-top { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.ca-kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); padding: 10px 12px; display: grid; }
.ca-kpi b { font-size: 1.7em; line-height: 1.1; color: var(--sea-deep); font-variant-numeric: tabular-nums; }
.ca-kpi small { color: var(--muted); font-weight: 600; }
.ca-kpi.warn b { color: var(--stop); }
.ca-views { flex-wrap: wrap; align-items: center; }
.ca-sample { margin-left: auto; }
.ca-filter { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ca-filter input.box { min-width: 0; flex: 1 1 140px; font-weight: 400; cursor: text; }
.ca-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ca-row { padding: 0; overflow: hidden; }
.ca-row.stale { border-left: 4px solid var(--stop); }
.ca-head { width: 100%; display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 0; background: none; font: inherit; color: inherit; text-align: left; cursor: pointer; flex-wrap: wrap; }
.ca-head:hover { background: var(--mist); }
.ca-count { flex: none; min-width: 34px; height: 34px; border-radius: 50%; color: #fff; display: inline-grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; }
.ca-main { flex: 1 1 220px; min-width: 0; display: grid; }
.ca-main b { overflow-wrap: anywhere; }
.ca-tags { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.ca-tags .badge[class*="st-접수"] { background: var(--warn-bg); color: var(--warn); }
.ca-tags .badge[class*="st-확인"], .ca-tags .badge[class*="st-처리"] { background: var(--sea-soft); color: var(--sea-deep); }
.ca-tags .badge[class*="st-완료"] { background: var(--go-bg); color: var(--go); }
.ca-tags .badge[class*="st-반려"], .ca-tags .badge[class*="st-중복"] { background: var(--mist); color: var(--muted); }
.ca-body { padding: 4px 14px 14px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
.ca-sum { margin: 6px 0 0; font-weight: 600; }
.ca-body > p { margin: 0; }

@media (max-width: 900px) {

/* 우리 쪽과 맞추기: 코스 전 대화는 가운데 한 장(메신저형) 그대로, 후보 미리 보기는 대화 칸 안에 접어서 */

@media (max-width: 900px) { .planner-shell .course-layout[data-pane="schedule"] { min-height: 0; } }   /* 폰: 일정 칸은 지도 높이만큼 비우지 않게 */

/* =====================================================================
   첫 화면 새 디자인 (2026-11-20 팀장 요청): 밝은 첫 화면 + 오른쪽 사진, 둥근 검색창, 빠른 시작,
   바로가기 띠, 사진 카드 추천 코스, 동이 안내 띠, 서 있는 동이 메뉴, 걸음 기준 픽토그램 네모
   ===================================================================== */
.hero { background: linear-gradient(180deg, var(--sea-soft) 0%, var(--bg) 100%); color: var(--ink); }
.hero::after { display: block; z-index: 0; pointer-events: none; background: linear-gradient(0deg, var(--bg) 0%, transparent 26%); }
.hero-bg { left: auto; right: 0; width: 62%; z-index: 0;
  -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 34%); mask-image: linear-gradient(90deg, transparent 0%, #000 34%); }
.hero-in { position: relative; z-index: 1; grid-template-columns: minmax(0, 1fr); min-height: min(560px, 72vh); padding-top: 56px; padding-bottom: 96px; align-items: center; }
.hero-copy { max-width: 620px; }
.hero-eyebrow { margin: 0 0 10px; font-weight: 700; color: var(--muted); font-size: 1.05em; }
.hero h1 { color: var(--sea-deep); text-shadow: none; font-size: clamp(34px, 4.6vw, 58px); line-height: 1.16; margin-bottom: 14px; max-width: none; }
.hero h1 em { font-style: normal; color: var(--sea); }
.hero .lead { color: var(--muted); margin-bottom: 22px; max-width: 30em; }
.ask { border: 1.5px solid var(--line); background: var(--surface); box-shadow: 0 14px 34px -20px rgba(18, 53, 94, .55); padding: 6px 6px 6px 18px; }
.ask-ic { color: var(--sea); flex: none; }
.ask input { color: var(--ink); }
.ask input::placeholder { color: var(--muted); }
.ask button.ask-go { width: 52px; height: 52px; min-height: 52px; padding: 0; display: grid; place-items: center; background: var(--sea); color: var(--sea-ink); flex: none; }
.ask button.ask-go:hover { background: var(--sea-deep); }
.hero-chips { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 16px 0 0; }
.hero-chips button { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--surface); color: var(--sea-deep); font-weight: 700; cursor: pointer; font: inherit; font-weight: 700; }
.hero-chips button:hover { border-color: var(--sea); background: var(--sea-soft); }
.hero-chips .acc-ic, .hero-chips .ic { color: var(--sea); }
.hero-pause { color: var(--sea-deep); background: var(--surface); border-color: var(--line); top: 16px; bottom: auto; }
.hero-pause:hover { background: var(--mist); }
@media (max-width: 820px) {
  .hero-bg { width: 100%; height: min(300px, 40vh); top: 0; bottom: auto; -webkit-mask-image: linear-gradient(180deg, #000 60%, transparent 100%); mask-image: linear-gradient(180deg, #000 60%, transparent 100%); }
  .hero-in { padding-top: calc(min(300px, 40vh) - 8px); padding-bottom: 76px; min-height: 0; }
  .hero-pause { top: 12px; bottom: auto; }
  .hero-chips button { padding: 0 13px; }

/* 바로가기 띠: 첫 화면 아래에 걸침 */
.quickbar { position: relative; z-index: 2; margin-top: -48px; }
.quickbar ul { list-style: none; margin: 0; padding: 8px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--surface);
  border-radius: 999px; box-shadow: 0 18px 40px -22px rgba(18, 53, 94, .5); border: 1px solid var(--line); }

.quickbar a { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 64px; text-decoration: none; color: var(--sea-deep); font-weight: 700; font-size: 1.05em; border-radius: 999px; }
.quickbar a:hover { background: var(--mist); }

.qb-ic.c1 { background: #2462B4; } .qb-ic.c2 { background: #1A7F9C; } .qb-ic.c3 { background: #C46A12; } .qb-ic.c4 { background: #2E7D5E; }

/* 섹션 제목 위 주황 막대 (섹션 공통) */
.sec-head h2::before { content: ""; display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--sun); margin-bottom: 12px; }

/* 추천 코스: 사진 카드 */
.cgrid2 { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 18px; }
.ccard2 { position: relative; display: block; width: 100%; aspect-ratio: 16 / 10; border: 0; padding: 0; border-radius: 20px; overflow: hidden; cursor: pointer; text-align: left;
  background: var(--mist); box-shadow: 0 16px 34px -22px rgba(18, 53, 94, .6); color: #fff; font: inherit; }
.ccard2 .ph { position: absolute; inset: 0; margin: 0; height: 100%; aspect-ratio: auto; border-radius: 0; }
.ccard2 .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease; }
.ccard2:hover .ph img { transform: scale(1.04); }
.ccard2::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8, 24, 46, 0) 38%, rgba(8, 24, 46, .85) 100%); }
.cc2-badge { position: absolute; z-index: 1; top: 14px; left: 14px; background: #fff; color: #12355E; font-weight: 700; font-size: .85em; padding: 4px 12px; border-radius: 999px; }
.cc2-t { position: absolute; z-index: 1; left: 18px; right: 70px; bottom: 16px; display: grid; gap: 6px; }

.cc2-go { position: absolute; z-index: 1; right: 16px; bottom: 16px; width: 42px; height: 42px; border-radius: 50%; background: #fff; color: #12355E; display: grid; place-items: center; }
.ccard2:disabled { cursor: wait; opacity: .7; }
@media (prefers-reduced-motion: reduce) { .ccard2 .ph img { transition: none; } .ccard2:hover .ph img { transform: none; } }

/* 동이 안내 띠 */
.dongi-banner { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 22px; margin-top: 48px; padding: 18px 28px 18px 18px;
  background: linear-gradient(100deg, var(--sea-soft), var(--mist)); border-radius: 24px; border: 1px solid var(--line); }
.dongi-banner img { width: 110px; height: 110px; object-fit: contain; }

.dongi-banner p { margin: 0; color: var(--muted); }
.db-go { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 24px; border-radius: 999px; background: var(--sea-deep); color: var(--sea-ink); font-weight: 700; text-decoration: none; white-space: nowrap; }

/* 서 있는 동이 메뉴 (예전 '메뉴' 단추 대신) */
.dongi-menu { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: 20px; z-index: 45; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.dm-dongi { width: 76px; height: 96px; border: 0; padding: 0; background: transparent; cursor: pointer; filter: drop-shadow(0 8px 12px rgba(18, 53, 94, .3)); transition: transform .2s ease; }
.dm-dongi img { width: 100%; height: 100%; object-fit: contain; display: block; }
.dongi-menu.open .dm-dongi, .dm-dongi:hover { transform: translateY(-4px); }
.dm-list { list-style: none; margin: 0; padding: 8px; display: grid; gap: 2px; min-width: 176px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: 0 18px 40px -18px rgba(18, 53, 94, .55); position: relative; }
.dm-list::after { content: ""; position: absolute; right: 30px; bottom: -8px; width: 14px; height: 14px; background: var(--surface); border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); transform: rotate(45deg); }
.dm-list[hidden] { display: none; }

@media (max-width: 760px) { .dongi-menu { bottom: calc(70px + env(safe-area-inset-bottom, 0px)); } .dm-dongi { width: 58px; height: 74px; } }
@media (prefers-reduced-motion: reduce) { .dm-dongi { transition: none; } }

/* 관광지 상세: 걸음 기준 픽토그램 네모 (글씨 없이, 말풍선·화면 읽기로 이름) */

/* =====================================================================
   관광지 상세 새 화면 (2026-11-20 팀장 요청, 레퍼런스 참고):
   얇은 소식 띠 → 머리 카드(글 | 큰 사진 + 작은 사진 3장) → 이동약자 이용 정보 → 위치·주변 | 방문 전 확인 → 방문자 팁
   ===================================================================== */
.pp4 { display: grid; gap: 16px; }
.pp4 > .panel { margin: 0; }
.pp4-news .pp-notice { border-radius: 12px; padding: 10px 14px; }

.pp4-crumb { display: flex; align-items: center; gap: 8px; font-size: .92em; color: var(--muted); }
.pp4-crumb a { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); text-decoration: none; }
.pp4-crumb a:hover { color: var(--sea); text-decoration: underline; }
.pp4-crumb .ic { width: 18px; height: 18px; color: var(--sea-deep); }
.pp4-hero h1 { font-family: var(--f-display); font-weight: 400; color: var(--sea-deep); font-size: clamp(32px, 4vw, 48px); line-height: 1.15; margin: 10px 0 8px; letter-spacing: -.02em; }
.pp4-addr { display: flex; align-items: flex-start; gap: 6px; margin: 0 0 14px; font-size: 1.05em; color: var(--ink); }
.pp4-addr .ic { color: var(--sea-deep); flex: none; margin-top: 2px; }
.pp4-tags { list-style: none; margin: 0 0 14px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; }
.pp4-tags li { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--sea-deep); font-weight: 700; font-size: .92em; }
.pp4-tags li .ic, .pp4-tags li .acc-ic { width: 18px; height: 18px; color: var(--sea); }
.pp4-tags li.t-warn { border-color: #E2B33C; background: #FFF8E3; color: #6E4A00; } .pp4-tags li.t-warn .ic { color: #A86F00; }
.pp4-tags li.t-bad { border-color: #E8A29C; background: #FDEEEC; color: #8E1E17; } .pp4-tags li.t-bad .ic, .pp4-tags li.t-bad .acc-ic { color: #B3261E; }
.pp4-tags li.t-ok { border-color: #9FD0B0; background: #EEF8F1; color: #17602D; } .pp4-tags li.t-ok .ic, .pp4-tags li.t-ok .acc-ic { color: #1A7F3C; }
.pp4-modes { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 0 0 14px; }
.pp4-k { font-weight: 700; color: var(--muted); font-size: .92em; }
.pp4-modes .pm-sq { width: 48px; height: 48px; border-radius: 12px; }
.pp4-info { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; margin: 0 0 14px; padding: 14px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.pp4-info > div { padding: 0 12px; min-width: 0; }
.pp4-info > div + div { border-left: 1px solid var(--line); }
.pp4-info > div:first-child { padding-left: 0; }
.pp4-info dt { display: flex; align-items: center; gap: 6px; font-weight: 700; color: var(--sea-deep); font-size: .92em; }
.pp4-info dt .ic { color: var(--sea); width: 20px; height: 20px; }
.pp4-info dd { margin: 4px 0 0 26px; color: var(--ink); overflow-wrap: anywhere; }
.pp4-today { display: block; font-size: .82em; color: var(--muted); margin-top: 2px; }
.pp4-today.on { color: #17692E; font-weight: 700; }
.pp4-verdict { margin: 0 0 16px; padding: 12px 14px; border-radius: 12px; display: flex; gap: 10px; align-items: flex-start; }
.pp4-verdict.v-G { background: #EEF8F1; } .pp4-verdict.v-Y { background: #FFF6DC; } .pp4-verdict.v-R { background: #FDEEEC; } .pp4-verdict.v-U { background: var(--mist); }
.pp4-acts { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.pp4-btn { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 22px; border-radius: 999px; border: 1.5px solid var(--sea-deep); background: var(--surface);
  color: var(--sea-deep); font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }
.pp4-btn:hover { background: var(--mist); }
.pp4-btn.main { background: var(--sea-deep); color: var(--sea-ink); }
.pp4-btn.main:hover { background: var(--sea); border-color: var(--sea); }
.pp4-btn.main.on { background: var(--glow); color: var(--ink); border-color: var(--sun); }
.pp4-report { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); font-size: .92em; margin-left: 4px; }
.pp4-report .ic { width: 18px; height: 18px; }
.pp4-photos { display: grid; gap: 10px; }
.pp4-main { position: relative; aspect-ratio: 16 / 10; border-radius: 18px; overflow: hidden; background: var(--mist); }
.pp4-main .ph { position: absolute; inset: 0; }
.pp4-main > img { width: 100%; height: 100%; object-fit: contain; }
.pp4-thumbs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.pp4-thumbs button { position: relative; display: block; width: 100%; aspect-ratio: 4 / 3; padding: 0; border: 3px solid transparent; border-radius: 12px; overflow: hidden; cursor: pointer; background: var(--mist); }
.pp4-thumbs button[aria-pressed="true"] { border-color: var(--sea); }
.pp4-thumbs .ph { position: absolute; inset: 0; }
.pp4-intro { grid-column: 1 / -1; margin-top: -6px; color: var(--muted); }
.pp4-intro p { margin: 0; }

.pp4-h-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.pp4-h { display: flex; align-items: center; gap: 8px; margin: 0; }
.pp4-h .acc-ic, .pp4-h .ic { color: var(--sea); }
.pp4-pills { list-style: none; margin: 0 0 12px; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.pp4-pills li { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 14px; border: 1px solid; font-weight: 600; line-height: 1.4; }
.pp4-pills .picto { flex: none; }
.pp4-pills .p-ok { background: #EEF8F1; border-color: #BFE3CA; color: #17602D; }
.pp4-pills .p-warn { background: #FFF8E3; border-color: #F0D48A; color: #6E4A00; }
.pp4-pills .p-bad { background: #FDEEEC; border-color: #F0C1BC; color: #8E1E17; }
.pp4-pills .p-info { background: var(--sea-soft); border-color: var(--line); color: var(--sea-deep); }
.pp4-route { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); }
.pp4-route ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 0; flex: 1; min-width: 0; }
.pp4-route li { display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; }
.pp4-route li + li { border-left: 1px solid var(--line); }
.pp4-route li:first-child { padding-left: 0; }
.pp4-route li .ic { width: 18px; height: 18px; color: var(--sea); }
.pp4-more { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--sea-deep); background: var(--surface);
  color: var(--sea-deep); font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap; }
.pp4-more:hover { background: var(--mist); }
#pp4-route-more:not([hidden]) { margin-top: 12px; }

.pp4-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.pp4-row > .panel { margin: 0; }
.pp4-near-in { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-top: 12px; align-items: start; }
.pp4-map .map { height: 190px; border-radius: 14px; }
.pp4-dist { margin: 0 0 12px; display: grid; gap: 10px; }
.pp4-dist > div { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px; align-items: baseline; }
.pp4-dist dt { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--sea-deep); white-space: nowrap; }
.pp4-dist dt .ic { color: var(--sea); width: 20px; height: 20px; }
.pp4-dist dd { margin: 0; display: flex; gap: 8px; justify-content: space-between; min-width: 0; }
.pp4-nm { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pp4-dist b { color: var(--ink); white-space: nowrap; }
.pp4-maplink { display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 12px; background: var(--sea-soft); color: var(--sea-deep); font-weight: 700; text-decoration: none; }
.pp4-maplink:hover { background: var(--mist); }
.pp4-before-in { display: flex; align-items: center; gap: 16px; margin-top: 12px; flex-wrap: wrap; }
.pp4-before-in ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; flex: 1; min-width: 220px; }
.pp4-before-in li { display: flex; align-items: flex-start; gap: 10px; font-size: 1.02em; }
.pp4-before-in li .ic, .pp4-before-in li .acc-ic { color: var(--sea-deep); flex: none; width: 22px; height: 22px; margin-top: 1px; }
.pp4-call { display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 24px; border-radius: 999px; background: var(--sea-deep); color: var(--sea-ink); font-weight: 700; text-decoration: none; }
.pp4-call:hover { background: var(--sea); }
.pp4-tips { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; padding: 16px 22px; border-radius: 18px; background: linear-gradient(100deg, var(--sea-soft), var(--mist)); border: 1px solid var(--line); }
.pp4-tips h2 { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 1.25em; padding-right: 18px; border-right: 1px solid var(--line-strong); }
.pp4-tips h2 .ic { color: #C97A00; width: 26px; height: 26px; }
.pp4-tips ul { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px 22px; flex: 1; min-width: 0; }
.pp4-tips li { display: flex; align-items: flex-start; gap: 6px; }
.pp4-tips li .ic { color: var(--sea); flex: none; margin-top: 2px; }

/* 동이 메뉴의 긴급·도움 (머리말에서 옮김) */
.dm-list .dm-sos { color: #B3261E; }
.dm-list .dm-sos .ic { color: #B3261E; }
.dm-list .dm-sos:hover { background: #FDEEEC; }

@media (max-width: 960px) {
  .pp4-hero { grid-template-columns: minmax(0, 1fr); }
  .pp4-photos { order: -1; }
  .pp4-row { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 600px) {
  .pp4-hero { padding: 16px; gap: 16px; }
  .pp4-info { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 0; }
  .pp4-info > div:nth-child(3) { border-left: 0; padding-left: 0; }
  .pp4-near-in { grid-template-columns: minmax(0, 1fr); }
  .pp4-route li { padding: 4px 10px; }
  .pp4-route li + li { border-left: 0; }
  .pp4-route li:first-child { padding-left: 10px; }
  .pp4-tips h2 { border-right: 0; padding-right: 0; }
  .pp4-btn { flex: 1; justify-content: center; }
}
.pp4-thumbs .ph, .pp4-thumbs .ph-s { position: absolute; inset: 0; width: 100%; height: 100%; }
.pp4-info { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 0; }
.pp4-info > div:nth-child(3) { border-left: 0; padding-left: 0; } .pp4-info > div:nth-child(2n) { padding-right: 0; }
.pp4-info dd { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
@media (min-width: 961px) { .pp4-hero { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

/* 동이 메뉴: 단추가 먼저(키보드 순서), 목록은 위에 보이게 / 코스가 있으면 '동이에게 고쳐 달라고 하기' 단추 위로 */
.dongi-menu { flex-direction: column-reverse; }
.dongi-menu.lifted { bottom: 104px; }
@media (max-width: 760px) { .dongi-menu.lifted { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); } }
@media (max-width: 600px) { .pp4-info { gap: 12px 0; } }
.dongi-menu[hidden] { display: none; }
.pp4-row > .panel, .pp4-row > .panel + .panel { margin: 0 !important; }

/* ---------- 홈 '동이와 코스 짜기' (코스 만들기 전): 다른 섹션과 같은 폭, 왼쪽 안내 + 오른쪽 대화 ---------- */
#plan.wrap:not(:has(.planner-shell)) { max-width: 1160px; width: auto; margin-inline: auto; }
.grid:not(.has-course) { grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); max-width: none; gap: 20px; align-items: stretch; }
.grid:not(.has-course) > .panel.chat { max-width: none; justify-self: stretch; width: 100%; }
.plan-aside { display: flex; flex-direction: column; gap: 14px; padding: 22px; border-radius: 24px; border: 1px solid var(--line);
  background: linear-gradient(180deg, var(--sea-soft), var(--surface) 70%); }
.pa-dongi { width: 120px; height: 120px; object-fit: contain; align-self: center; }
.plan-aside h3 { margin: 0; text-align: center; font-size: 1.35em; }
.plan-aside ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.plan-aside li { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.plan-aside li img { flex: none; }
.plan-aside li b { display: block; color: var(--sea-deep); }
.plan-aside li small { display: block; color: var(--muted); margin-top: 2px; line-height: 1.45; }
.pa-more { margin-top: auto; display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; border-radius: 999px; border: 1.5px solid var(--sea-deep); color: var(--sea-deep); font-weight: 700; text-decoration: none; }
.pa-more:hover { background: var(--mist); }
.qb-3d { width: 44px; height: 44px; object-fit: contain; flex: none; }
@media (max-width: 900px) {
  .grid:not(.has-course) { grid-template-columns: minmax(0, 1fr); }
  .plan-aside { display: none; }   /* 폰: 대화가 먼저 (안내는 바로가기·이용 안내로) */
}

/* ---------- 관리자: AI로 작업하기 ---------- */
.aiw { display: grid; gap: 14px; }
.aiw .panel { margin: 0; }
.aiw-in h2 { display: flex; align-items: center; gap: 8px; margin: 0 0 6px; }
.aiw-drop { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 12px; padding: 18px; border: 2px dashed var(--line-strong); border-radius: 16px; background: var(--mist); }
.aiw-file { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line-strong); cursor: pointer; font-weight: 700; color: var(--sea-deep); }
.aiw-file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.aiw-file:focus-within { outline: 3px solid var(--sun); outline-offset: 2px; }
.aiw-url { flex: 1; min-width: 220px; min-height: 48px; border-radius: 12px; border: 1.5px solid var(--line-strong); padding: 0 12px; background: var(--surface); color: var(--ink); }
.aiw-place p { margin: 0 0 8px; }
.aiw-k { display: inline-block; font-weight: 700; color: var(--muted); margin-right: 6px; }
.aiw-other select { margin-left: 8px; min-height: 40px; }
.aiw-tbl td, .aiw-tbl th { vertical-align: top; }
.aiw-tbl .badge { margin-left: 6px; }
.aiw-acc { background: #FFF8E3; }
.aiw-save { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-top: 12px; }
.aiw-save label { display: grid; gap: 4px; flex: 1; min-width: 240px; }
.aiw-save input { min-height: 44px; border-radius: 10px; border: 1.5px solid var(--line-strong); padding: 0 10px; }

/* 코스 마지막 단계: 이동 방법 → 출발하는 곳 (2026-11-20 개선 2단계) */
.go-how { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; width: 100%; }
.go-k { font-weight: 700; min-width: 6em; }
.go-note { flex-basis: 100%; }
.warn-txt { color: var(--warn); font-weight: 700; }

.demo-note { background: var(--glow); color: var(--ink); border-bottom: 1px solid var(--line); font-size: 14px; line-height: 1.5; }
.demo-note .in { max-width: 1160px; margin: 0 auto; padding-block: 8px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; }
.demo-note b { font-family: var(--f-display); font-weight: 400; color: var(--sun-deep); }
.demo-note a { color: var(--sea); font-weight: 600; }
</style>

ED\uC548\uB0B4 1330 (24\uC2DC\uAC04)","Call 1330 for interpretation (24h)")]},{t:n("\uB204\uAD6C\uB098 \uCC59\uAE38 \uAC83","For everyone"),i:[n("\uC7A5\uC560\uC778 \uB4F1\uB85D\uC99D\xB7\uBCF5\uC9C0\uCE74\uB4DC (\uC8FC\uCC28 \uC694\uAE08 \uBA74\uC81C, \uC785\uC7A5\uB8CC \uD560\uC778)","Disability card (parking & ticket discounts)"),n("\uD734\uB300\uD3F0 \uBCF4\uC870\uBC30\uD130\uB9AC \u2014 \uC9C0\uB3C4\xB7\uC804\uD654\uB97C \uACC4\uC18D \uC4F0\uB2C8\uAE4C\uC694","A power bank for maps and calls"),n("\uB298 \uBA39\uB294 \uC57D\uACFC \uBCF5\uC6A9 \uC2DC\uAC04\uD45C","Regular medicines"),n("\uAC00\uC871 \uC5F0\uB77D\uCC98\uB97C \uC801\uC740 \uCABD\uC9C0","A note with family phone numbers")]},{t:n("\uACA8\uC6B8 \uBC14\uB2F7\uAC00 (11~2\uC6D4)","Winter by the sea (Nov\u2013Feb)"),i:[n("\uBC14\uB2F7\uBC14\uB78C\uC774 \uCC28\uC694 \u2014 \uBAA8\uC790\xB7\uC7A5\uAC11\xB7\uBB34\uB98E \uB2F4\uC694","Sea wind is cold: hat, gloves, lap blanket"),n("\uD574 \uC9C0\uB294 \uC2DC\uAC01\uC774 5\uC2DC \uBC18 \uBB34\uB835\uC774\uB77C \uC2E4\uC678\uB294 \uC624\uD6C4 4\uC2DC \uC804\uC5D0","Sunset ~5:30pm; finish outdoors by 4pm"),n("\uD574\uB9DE\uC774\uB294 \uC0C8\uBCBD\uC774\uB77C \uCDA5\uACE0 \uBD90\uBCBC\uC694. \uCD9C\uB801\uB2E4\uB9AC\uB294 \uBCF4\uD1B5 \uC624\uC804 9\uC2DC\uBD80\uD130","Sunrise is cold and crowded; the bridge usually opens at 9am"),n("\uB208\xB7\uBE44 \uC624\uB294 \uB0A0\uC740 \uB370\uD06C\uAC00 \uBBF8\uB044\uB7EC\uC6CC\uC694 \u2014 \uC2E4\uB0B4 \uC704\uC8FC\uB85C","Wet decks are slippery; go indoors")]}],s=[[n("\uCD08\uB85D\xB7\uB178\uB791\xB7\uBE68\uAC15\uC740 \uBB34\uC2A8 \uB73B\uC774\uC5D0\uC694?","What do the colors mean?"),n("\uCD08\uB85D\uC740 \uADF8 \uAE30\uC900\uC73C\uB85C \uAC08 \uC218 \uC788\uC5B4\uC694, \uB178\uB791\uC740 \uB3C4\uC6C0\uC774 \uC788\uAC70\uB098 \uC870\uC2EC\uD558\uBA74 \uAC08 \uC218 \uC788\uC5B4\uC694, \uBE68\uAC15\uC740 \uC5B4\uB824\uC6CC\uC694. \uACBD\uC0AC\uB85C \uAE30\uC6B8\uAE30\xB7\uCD9C\uC785\uAD6C \uD131\xB7\uD1B5\uB85C \uD3ED\uC744 \uC7A5\uC560\uC778\uB4F1\uD3B8\uC758\uBC95 \uAE30\uC900\uACFC \uBE44\uAD50\uD574 \uC815\uD574\uC694.","Green = accessible, yellow = with care, red = not accessible, based on ramp slope, steps and path width under Korean accessibility law.")],[n("\uC601\uC5C5\uC2DC\uAC04\uC774 \uB9DE\uB098\uC694?","Are opening hours accurate?"),n("\uC6B4\uC601\uC2DC\uAC04\uC740 \uBC14\uB014 \uC218 \uC788\uC73C\uB2C8 \uCD9C\uBC1C \uC804\uC5D0 \uC804\uD654\uB85C \uD55C \uBC88 \uB354 \uD655\uC778\uD574 \uC8FC\uC138\uC694.","Public data where available; others are marked as samples. Call ahead.")],[n("\uC81C\uAC00 \uC785\uB825\uD55C \uC815\uBCF4\uAC00 \uC800\uC7A5\uB418\uB098\uC694?","Is my information stored?"),n("\uC774\uB3D9 \uC870\uAC74\uC740 \uC11C\uBC84\uC5D0 \uC800\uC7A5\uD558\uC9C0 \uC54A\uC544\uC694. [\uB0B4 \uC77C\uC815]\uB3C4 \uC774 \uAE30\uAE30\uC5D0\uB9CC \uB0A8\uC544\uC694.","No. Saved trips stay on this device.")],[n("\uD604\uC7A5\uACFC \uB2E4\uB978 \uC815\uBCF4\uB97C \uBD24\uC5B4\uC694.","I found wrong information."),n("\uCF54\uC2A4 \uACB0\uACFC \uC544\uB798 [\uD604\uC7A5 \uC81C\uBCF4]\uB85C \uC0AC\uC9C4\uACFC \uD568\uAED8 \uC54C\uB824 \uC8FC\uC138\uC694. \uD300\uC774 \uD655\uC778\uD55C \uB4A4 \uBC18\uC601\uD574\uC694.","Use the report form below a route; the team reviews it.")],[n("\uD720\uCCB4\uC5B4\uAC00 \uD0C8 \uC218 \uC788\uB294 \uCC28\uB294 \uC5B4\uB5BB\uAC8C \uBD88\uB7EC\uC694?","How do I book a wheelchair vehicle?"),n("\uB3D9\uD574\uC2DC \uAD50\uD1B5\uC57D\uC790\uC774\uB3D9\uC9C0\uC6D0\uC13C\uD130 1577-2014\uB85C \uC804\uD654\uD558\uAC70\uB098 \uAC15\uC6D0 \uAD50\uD1B5\uC57D\uC790 \uAD11\uC5ED\uC774\uB3D9\uC9C0\uC6D0\uC13C\uD130 \uC571\uC73C\uB85C \uC608\uC57D\uD574\uC694. \uB2E4\uB978 \uC9C0\uC5ED\uC5D0 \uC0AC\uB294 \uB4F1\uB85D \uC7A5\uC560\uC778\uB3C4 \uC774\uC6A9\uD560 \uC218 \uC788\uACE0, \uC2DC\uC678\uB85C \uAC08 \uB54C\uB294 7\uC77C \uC804\uAE4C\uC9C0 \uC608\uC57D\uD574\uC694. [\uAD50\uD1B5] \uD398\uC774\uC9C0\uC5D0 \uC790\uC138\uD788 \uC788\uC5B4\uC694.","Call 1577-2014 or use the Gangwon mobility app. Visitors from other regions can use it; book 7 days ahead for out-of-town trips.")],[n("\uC7A5\uC560\uC778 \uCC28\uB7C9\uC740 \uC8FC\uCC28\uBE44\uAC00 \uC5BC\uB9C8\uC608\uC694?","Is parking free with a disability permit?"),n("\uACF5\uC601\uC8FC\uCC28\uC7A5 24\uACF3 \uC911 18\uACF3\uC740 \uC7A5\uC560\uC778 \uCC28\uB7C9\uC774 \uBB34\uB8CC\uC608\uC694(2\uC2DC\uAC04\uC774 \uB118\uC73C\uBA74 \uBC18\uAC12). [\uAD50\uD1B5 \u2192 \uC8FC\uCC28\uC7A5]\uC5D0\uC11C '\uC7A5\uC560\uC778 \uCC28\uB7C9 \uBA74\uC81C\uB9CC'\uC744 \uB204\uB974\uBA74 \uADF8\uACF3\uB9CC \uBCF4\uC5EC\uC694.","18 of 24 public car parks are free with a permit (half price after 2 hours).")],[n("\uBE44\uAC00 \uC624\uBA74 \uCF54\uC2A4\uAC00 \uBC14\uB00C\uB098\uC694?","What if it rains?"),n("\uADF8\uB0A0 \uBE44 \uC608\uBCF4\uAC00 \uC788\uC73C\uBA74 \uC2E4\uB0B4 \uC7A5\uC18C\uB97C \uBA3C\uC800 \uB123\uC5B4\uC694. \uC9C1\uC811 [\uC2E4\uB0B4 \uC704\uC8FC\uB85C \uBC14\uAFB8\uAE30]\uB97C \uB20C\uB7EC\uB3C4 \uB3FC\uC694. \uB2E4\uB9CC \uD720\uCCB4\uC5B4\xB7\uC720\uBAA8\uCC28\uB85C \uAC08 \uC218 \uC788\uB294 \uC2E4\uB0B4 \uC7A5\uC18C\uB294 \uC544\uC9C1 \uB9CE\uC9C0 \uC54A\uC544\uC694.","Indoor places go first on rainy days. Few indoor places are wheelchair-accessible yet.")],[n("\uB3D9\uD574\uC5D0 \uC800\uC0C1\uBC84\uC2A4\uAC00 \uC788\uB098\uC694?","Are there low-floor buses?"),n("\uC544\uC9C1 \uC5C6\uC5B4\uC694. \uD720\uCCB4\uC5B4\uB85C \uC2DC\uB0B4\uB97C \uB2E4\uB2D0 \uB54C\uB294 \uD720\uCCB4\uC5B4 \uCC28\uB7C9(1577-2014)\uC774\uB098 \uD0DD\uC2DC\uB97C \uC774\uC6A9\uD558\uC138\uC694. \uC2DC\uD2F0\uD22C\uC5B4 \uBC84\uC2A4\uB3C4 \uC811\uC774\uC2DD \uD720\uCCB4\uC5B4\uB9CC \uC2E4\uC744 \uC218 \uC788\uC5B4\uC694.","Not yet. Use the wheelchair vehicle service or a taxi.")],[n("\uC804\uB3D9\uD720\uCCB4\uC5B4 \uBC30\uD130\uB9AC\uAC00 \uAC71\uC815\uB3FC\uC694.","Worried about wheelchair battery?"),n("\uB3D9\uD574\uC2DC\uC5D0 \uC804\uB3D9\uD720\uCCB4\uC5B4 \uAE09\uC18D\uCDA9
