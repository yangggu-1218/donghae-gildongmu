<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>동해 길동무 · 운영 화면 시안</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f8;color:#173a49;font:17px/1.6 system-ui,sans-serif;word-break:keep-all}header{background:#164957;color:white}header div,main{max-width:940px;margin:auto;padding:20px clamp(16px,4vw,38px)}header div,.head,nav{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}a{color:#165775}header a{color:white}h1{font-size:clamp(28px,4vw,42px);margin:20px 0 8px}h2{font-size:23px;margin:0}p{margin:6px 0 14px}nav{justify-content:flex-start;margin:16px 0}button,input{font:inherit;border:1px solid #95aeb8;border-radius:7px;padding:9px 14px;background:white;color:inherit}button{cursor:pointer;min-height:46px}button[aria-pressed=true],.action{background:#164957;color:white}.sheet{background:white;padding:clamp(18px,4vw,34px);border-radius:12px;border:1px solid #cedce1}.source{border-left:4px solid #197278;background:#eff6f8;padding:18px;margin:20px 0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.fields label{display:grid;gap:5px}.fields input{width:100%;min-width:0}.status{padding:12px 0;border-bottom:1px solid #dde6e9;display:flex;justify-content:space-between;gap:16px}.ok{color:#126741}.warn{color:#875b06}.bad{color:#aa3432}output{display:block;margin:10px 0;font-weight:650}summary{cursor:pointer;margin-bottom:12px}@media(max-width:600px){.fields{grid-template-columns:1fr}.head{align-items:flex-start}.source{padding:14px}}</style>
<header><div><b>동해 길동무</b><span>관리자 화면 시안</span></div></header><main><h1>운영 관리</h1><nav aria-label="업무 선택"></nav><section class="sheet" id="panel"></section></main>
<script>
const cases=[
 {title:"행사 등록",tab:"site",source:"묵호항 겨울 산책 안내",body:"2026년 12월 12일, 묵호항 수변공원에서 ‘묵호항 겨울 산책’을 진행합니다.",labels:["행사 이름","시작일","장소","문의 전화"],values:["묵호항 겨울 산책","2026-12-12","묵호항 수변공원",""]},
 {title:"운영시간 수정",tab:"place",source:"추암 안내소 겨울 운영 안내",body:"추암 안내소는 오전 9시에 문을 엽니다. 입장은 오후 4시까지 가능합니다. 폐관 시각은 추후 안내합니다.",labels:["여는 시각","닫는 시각","마지막 입장"],values:["09:00","","16:00"]},
 {title:"공공데이터 점검",tab:"data"}];
const panel=document.querySelector("#panel"),nav=document.querySelector("nav");
function show(i){const c=cases[i];Array.from(nav.children).forEach((b,j)=>b.setAttribute("aria-pressed",j===i));panel.replaceChildren();
 const head=document.createElement("div");head.className="head";head.innerHTML='<h2>'+c.title+'</h2><a href="/#/admin/'+c.tab+'">실제 관리자 화면 열기 ↗</a>';panel.append(head);
 if(i===2){panel.insertAdjacentHTML("beforeend",'<p>신호등 표시 예시</p>'+[["길동무 서버","ok","● 정상"],["무장애 관광지","warn","● 확인 필요 · 제공 자료 없음"],["관광사진","bad","● 장애 · 응답 오류"]].map(([name,style,state])=>'<div class="status"><b>'+name+'</b><span class="'+style+'">'+state+'</span></div>').join(""));return;}
 const section=document.createElement("section");section.className="source";section.innerHTML='<h2>안내 자료로 채우기</h2><p>예시 공고로 초안 작성을 체험해 보세요.</p><details><summary>'+c.source+' · 예시 원문 보기</summary><p>'+c.body+'</p></details><button class="action">예시 자료로 채우기</button>';panel.append(section);
 const fields=document.createElement("div");fields.className="fields";const out=document.createElement("output");section.append(out);
 const inputs=c.labels.map((label,j)=>{const l=document.createElement("label");l.textContent=label;const input=document.createElement("input");input.type=i===1?"time":j===1?"date":"text";l.append(input);fields.append(l);return input;});panel.append(fields);
 function review(){const missing=c.labels.filter((_,j)=>!inputs[j].value);out.textContent=missing.length?"직접 확인할 항목 · "+missing.join(", "):"모든 항목을 채웠어요.";}
 fields.oninput=review;section.querySelector("button").onclick=()=>{inputs.forEach((el,j)=>{if(c.values[j])el.value=c.values[j]});review();};}
cases.forEach((c,i)=>{const b=document.createElement("button");b.textContent=c.title;b.onclick=()=>show(i);nav.append(b)});show(0);
</script></html>
